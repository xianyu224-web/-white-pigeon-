<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>宿管管理 - 宿舍管理系统</title>
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <script src="mock-data.js"></script>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { font-family: 'Inter', system-ui, sans-serif; background: #fff; color: #000; min-height: 100vh; }
        header { position: sticky; top: 44px; z-index: 50; background: rgba(255,255,255,0.9); backdrop-filter: blur(12px); border-bottom: 1px solid #e0e0e0; box-shadow: 2px 2px 0 0 rgba(0,0,0,1); }
        .header-inner { max-width: 1200px; margin: 0 auto; padding: 0 20px; height: 64px; display: flex; align-items: center; justify-content: space-between; }
        .logo { display: flex; align-items: center; gap: 10px; font-size: 20px; font-weight: 700; color: #000; text-decoration: none; }
        .logo i { font-size: 24px; }
        nav { display: flex; gap: 32px; margin-left: 40px; flex: 1; }
        nav a { color: #666; text-decoration: none; font-size: 14px; font-weight: 500; padding: 22px 0; border-bottom: 2px solid transparent; transition: all 0.2s; }
        nav a:hover { color: #000; }
        nav a.active { color: #000; border-bottom-color: #000; font-weight: 600; }
        .header-right { display: flex; align-items: center; gap: 16px; }
        .user-info { display: flex; align-items: center; gap: 10px; }
        .user-avatar { width: 32px; height: 32px; border-radius: 50%; background: #f5f5f5; border: 1px solid rgba(0,0,0,0.3); display: flex; align-items: center; justify-content: center; color: #666; font-size: 14px; }
        .user-name { font-size: 14px; font-weight: 500; }
        .logout-btn { padding: 8px; border: none; background: transparent; color: #666; cursor: pointer; border-radius: 50%; transition: all 0.2s; font-size: 16px; }
        .logout-btn:hover { background: #f5f5f5; color: #000; }
        main { max-width: 1200px; margin: 0 auto; padding: 32px 20px; min-height: calc(100vh - 64px - 44px - 60px); }
        .page-header { display: flex; flex-direction: column; gap: 16px; margin-bottom: 24px; }
        @media (min-width: 768px) { .page-header { flex-direction: row; align-items: center; justify-content: space-between; } }
        .page-title h1 { font-size: clamp(1.5rem, 3vw, 2rem); font-weight: 700; margin-bottom: 4px; }
        .page-title p { color: #666; font-size: 14px; }
        .btn { padding: 10px 20px; background: #000; color: #fff; border: none; border-radius: 8px; font-size: 14px; font-weight: 500; cursor: pointer; transition: all 0.2s; display: inline-flex; align-items: center; gap: 8px; box-shadow: 2px 2px 0 0 rgba(0,0,0,1); text-decoration: none; }
        .btn:hover { background: #333; transform: translate(-1px, -1px); box-shadow: 3px 3px 0 0 rgba(0,0,0,1); }
        .btn-outline { background: #fff; color: #000; border: 1px solid #e0e0e0; box-shadow: 2px 2px 0 0 rgba(0,0,0,1); }
        .btn-outline:hover { background: #f5f5f5; border-color: #000; }
        .btn-sm { padding: 6px 12px; font-size: 13px; box-shadow: none; }
        .btn-danger { background: #fff; color: #dc2626; border: 1px solid #fecaca; box-shadow: none; }
        .btn-danger:hover { background: #fef2f2; border-color: #dc2626; transform: none; box-shadow: none; }
        .search-card { background: #fff; border: 1px solid #e0e0e0; border-radius: 12px; padding: 20px; margin-bottom: 24px; box-shadow: 2px 2px 0 0 rgba(0,0,0,1); }
        .search-row { display: flex; flex-direction: column; gap: 16px; }
        @media (min-width: 768px) { .search-row { flex-direction: row; } }
        .search-input { flex: 1; position: relative; }
        .search-input i { position: absolute; left: 14px; top: 50%; transform: translateY(-50%); color: #666; }
        .search-input input { width: 100%; padding: 10px 16px 10px 40px; border: 1px solid #e0e0e0; border-radius: 8px; background: #f5f5f5; font-size: 14px; font-family: inherit; transition: all 0.2s; }
        .search-input input:focus { outline: none; border-color: #000; background: #fff; }
        .search-buttons { display: flex; gap: 12px; justify-content: flex-end; }
        .table-card { background: #fff; border: 1px solid #e0e0e0; border-radius: 12px; overflow: hidden; box-shadow: 2px 2px 0 0 rgba(0,0,0,1); }
        .table-header { display: grid; grid-template-columns: 2fr 1fr 1fr 1fr 1.5fr 1.5fr; padding: 14px 24px; background: #f5f5f5; border-bottom: 1px solid #e0e0e0; font-size: 13px; font-weight: 500; color: #666; }
        .table-row { display: grid; grid-template-columns: 2fr 1fr 1fr 1fr 1.5fr 1.5fr; padding: 16px 24px; border-bottom: 1px solid #e0e0e0; align-items: center; transition: background 0.2s; }
        .table-row:hover { background: #fafafa; }
        .table-row:last-child { border-bottom: none; }
        .admin-cell { display: flex; align-items: center; gap: 12px; }
        .admin-avatar { width: 40px; height: 40px; border-radius: 50%; background: #f5f5f5; display: flex; align-items: center; justify-content: center; color: #666; font-size: 16px; }
        .admin-name { font-weight: 600; }
        .admin-email { font-size: 12px; color: #666; margin-top: 2px; }
        .cell { font-size: 14px; }
        .cell-sm { font-size: 13px; color: #666; }
        .actions { display: flex; gap: 8px; justify-content: flex-end; }
        .empty-state { padding: 48px 24px; text-align: center; color: #666; }
        .empty-state i { font-size: 36px; margin-bottom: 12px; display: block; }
        .pagination { display: flex; align-items: center; justify-content: space-between; padding: 16px 24px; border-top: 1px solid #e0e0e0; }
        .pagination-info { font-size: 13px; color: #666; }
        .pagination-info span { color: #000; font-weight: 600; }
        .pagination-btns { display: flex; gap: 4px; }
        .page-btn { width: 36px; height: 36px; border: 1px solid #e0e0e0; background: #fff; border-radius: 6px; cursor: pointer; font-size: 13px; font-weight: 500; color: #666; transition: all 0.2s; display: flex; align-items: center; justify-content: center; }
        .page-btn:hover:not(:disabled) { border-color: #000; color: #000; }
        .page-btn.active { background: #000; color: #fff; border-color: #000; }
        .page-btn:disabled { opacity: 0.4; cursor: not-allowed; }
        .modal-overlay { display: none; position: fixed; inset: 0; background: rgba(0,0,0,0.5); z-index: 1000; align-items: center; justify-content: center; padding: 20px; }
        .modal-overlay.show { display: flex; }
        .modal { background: #fff; border-radius: 12px; max-width: 500px; width: 100%; max-height: 90vh; overflow-y: auto; box-shadow: 4px 4px 0 0 rgba(0,0,0,1); }
        .modal-header { display: flex; align-items: center; justify-content: space-between; padding: 24px; border-bottom: 1px solid #e0e0e0; }
        .modal-header h3 { font-size: 20px; font-weight: 700; }
        .modal-close { background: none; border: none; font-size: 20px; color: #666; cursor: pointer; }
        .modal-body { padding: 24px; }
        .form-grid { display: grid; grid-template-columns: 1fr; gap: 16px; }
        @media (min-width: 640px) { .form-grid { grid-template-columns: 1fr 1fr; } }
        .form-group label { display: block; font-size: 13px; font-weight: 500; color: #374151; margin-bottom: 6px; }
        .form-group input, .form-group select { width: 100%; padding: 10px 14px; border: 1px solid #e0e0e0; border-radius: 8px; background: #f5f5f5; font-size: 14px; font-family: inherit; transition: all 0.2s; }
        .form-group input:focus, .form-group select:focus { outline: none; border-color: #000; background: #fff; }
        .modal-footer { display: flex; justify-content: flex-end; gap: 12px; padding: 16px 24px; border-top: 1px solid #e0e0e0; }
        footer { border-top: 1px solid #e0e0e0; background: rgba(255,255,255,0.5); padding: 16px 20px; text-align: center; font-size: 12px; color: #666; letter-spacing: 0.5px; }
        .mobile-menu-btn { display: none; background: none; border: none; font-size: 20px; cursor: pointer; color: #000; }
        @media (max-width: 768px) {
            nav { display: none; position: absolute; top: 64px; left: 0; right: 0; background: #fff; border-bottom: 1px solid #e0e0e0; flex-direction: column; padding: 16px 20px; gap: 12px; margin-left: 0; z-index: 100; }
            nav.open { display: flex; }
            nav a { padding: 8px 0; border-bottom: none; }
            nav a.active { border-bottom: none; }
            .mobile-menu-btn { display: block; }
            .user-name { display: none; }
            .table-header, .table-row { grid-template-columns: 2fr 1fr 1.5fr; }
            .table-header > div:nth-child(2), .table-header > div:nth-child(3), .table-header > div:nth-child(4),
            .table-row > .cell-sm:nth-child(2), .table-row > .cell-sm:nth-child(3), .table-row > .cell:nth-child(4) { display: none; }
        }
    </style>
</head>
<body>
    <header>
        <div class="header-inner">
            <div style="display:flex;align-items:center;">
                <a href="dashboard.html" class="logo"><i class="fa fa-building"></i><span>宿舍管理系统</span></a>
                <nav id="mainNav">
                    <a href="dashboard.html">仪表板</a>
                    <a href="student.html">学生管理</a>
                    <a href="dorm.html">宿舍管理</a>
                    <a href="dormadmin.html" class="active">宿管管理</a>
                    <a href="profile.html">个人中心</a>
                </nav>
            </div>
            <div class="header-right">
                <button class="mobile-menu-btn" onclick="toggleMenu()"><i class="fa fa-bars"></i></button>
                <div class="user-info"><div class="user-avatar"><i class="fa fa-user-shield"></i></div><span class="user-name" id="userName">管理员</span></div>
                <button class="logout-btn" onclick="logout()"><i class="fa fa-sign-out"></i></button>
            </div>
        </div>
    </header>

    <main>
        <div class="page-header">
            <div class="page-title"><h1>宿管管理</h1><p>管理系统中的所有宿管信息</p></div>
            <button class="btn" onclick="openAddModal()"><i class="fa fa-plus"></i> 新增宿管</button>
        </div>

        <div class="search-card">
            <div class="search-row">
                <div class="search-input">
                    <i class="fa fa-search"></i>
                    <input type="text" id="searchInput" placeholder="搜索工号、姓名、楼栋..." onkeyup="if(event.key==='Enter')handleSearch()">
                </div>
                <div class="search-buttons">
                    <button class="btn btn-outline btn-sm" onclick="resetSearch()">重置</button>
                    <button class="btn btn-sm" onclick="handleSearch()"><i class="fa fa-search"></i> 查询</button>
                </div>
            </div>
        </div>

        <div class="table-card">
            <div class="table-header">
                <div>宿管信息</div><div>工号</div><div>楼栋</div><div>角色</div><div>联系方式</div><div style="text-align:right;">操作</div>
            </div>
            <div id="tableBody"></div>
            <div class="pagination">
                <div class="pagination-info">共 <span id="totalCount">0</span> 条记录</div>
                <div class="pagination-btns" id="paginationBtns"></div>
            </div>
        </div>
    </main>

    <footer><p>© 2024 宿舍管理系统 | 版本 1.0.0</p></footer>

    <div class="modal-overlay" id="adminModal">
        <div class="modal">
            <div class="modal-header">
                <h3 id="modalTitle">新增宿管</h3>
                <button class="modal-close" onclick="closeModal()"><i class="fa fa-times"></i></button>
            </div>
            <div class="modal-body">
                <form id="adminForm" onsubmit="return handleSubmit(event)">
                    <div class="form-grid">
                        <div class="form-group"><label>工号 *</label><input type="text" id="f_adminNo" required></div>
                        <div class="form-group"><label>姓名 *</label><input type="text" id="f_name" required></div>
                        <div class="form-group"><label>楼栋号</label><input type="text" id="f_buildingNo"></div>
                        <div class="form-group"><label>角色</label>
                            <select id="f_role">
                                <option value="普通宿管">普通宿管</option>
                                <option value="主管">主管</option>
                            </select>
                        </div>
                        <div class="form-group"><label>电话</label><input type="text" id="f_phone"></div>
                        <div class="form-group"><label>邮箱</label><input type="email" id="f_email"></div>
                        <div class="form-group" style="grid-column: 1 / -1;"><label>密码</label><input type="text" id="f_password" placeholder="默认123456"></div>
                    </div>
                </form>
            </div>
            <div class="modal-footer">
                <button class="btn btn-outline" onclick="closeModal()">取消</button>
                <button class="btn" onclick="document.getElementById('adminForm').requestSubmit()">确定</button>
            </div>
        </div>
    </div>

    <script>
        const user = requireAdmin();
        if (user) { document.getElementById('userName').textContent = user.name; }

        let currentPage = 1;
        const pageSize = 10;
        let currentKeyword = '';
        let editingId = 0;

        function toggleMenu() { document.getElementById('mainNav').classList.toggle('open'); }

        function loadTable() {
            const data = getDormAdminPage(currentPage, pageSize, currentKeyword);
            document.getElementById('totalCount').textContent = data.total;

            if (data.list.length === 0) {
                document.getElementById('tableBody').innerHTML = '<div class="empty-state"><i class="fa fa-inbox"></i>暂无数据</div>';
            } else {
                document.getElementById('tableBody').innerHTML = data.list.map(a => `
                    <div class="table-row">
                        <div class="admin-cell">
                            <div class="admin-avatar"><i class="fa fa-user-shield"></i></div>
                            <div><div class="admin-name">${a.name}</div><div class="admin-email">${a.email || '无邮箱'}</div></div>
                        </div>
                        <div class="cell-sm">${a.adminNo}</div>
                        <div class="cell-sm">${a.buildingNo || '未分配'}</div>
                        <div class="cell-sm">${a.role || '普通宿管'}</div>
                        <div class="cell-sm">${a.phone || '无电话'}</div>
                        <div class="actions">
                            <button class="btn btn-outline btn-sm" onclick="openEditModal(${a.id})"><i class="fa fa-edit"></i> 编辑</button>
                            <button class="btn btn-danger btn-sm" onclick="handleDelete(${a.id}, '${a.name}')"><i class="fa fa-trash"></i> 删除</button>
                        </div>
                    </div>
                `).join('');
            }

            let html = '';
            html += `<button class="page-btn" onclick="prevPage()" ${currentPage<=1?'disabled':''}><i class="fa fa-chevron-left"></i></button>`;
            html += `<button class="page-btn active">${currentPage}</button>`;
            html += `<button class="page-btn" onclick="nextPage()" ${currentPage>=data.totalPages?'disabled':''}><i class="fa fa-chevron-right"></i></button>`;
            document.getElementById('paginationBtns').innerHTML = html;
        }

        function handleSearch() { currentKeyword = document.getElementById('searchInput').value; currentPage = 1; loadTable(); }
        function resetSearch() { document.getElementById('searchInput').value = ''; currentKeyword = ''; currentPage = 1; loadTable(); }
        function prevPage() { if (currentPage > 1) { currentPage--; loadTable(); } }
        function nextPage() { const data = getDormAdminPage(currentPage, pageSize, currentKeyword); if (currentPage < data.totalPages) { currentPage++; loadTable(); } }

        function openAddModal() {
            editingId = 0;
            document.getElementById('modalTitle').textContent = '新增宿管';
            document.getElementById('adminForm').reset();
            document.getElementById('f_role').value = '普通宿管';
            document.getElementById('f_adminNo').disabled = false;
            document.getElementById('adminModal').classList.add('show');
        }

        function openEditModal(id) {
            const admin = getDormAdmins().find(a => a.id === id);
            if (!admin) return;
            editingId = id;
            document.getElementById('modalTitle').textContent = '编辑宿管';
            document.getElementById('f_adminNo').value = admin.adminNo;
            document.getElementById('f_adminNo').disabled = true;
            document.getElementById('f_name').value = admin.name;
            document.getElementById('f_buildingNo').value = admin.buildingNo || '';
            document.getElementById('f_role').value = admin.role || '普通宿管';
            document.getElementById('f_phone').value = admin.phone || '';
            document.getElementById('f_email').value = admin.email || '';
            document.getElementById('f_password').value = '';
            document.getElementById('adminModal').classList.add('show');
        }

        function closeModal() { document.getElementById('adminModal').classList.remove('show'); }

        function handleSubmit(e) {
            e.preventDefault();
            const data = {
                adminNo: document.getElementById('f_adminNo').value,
                name: document.getElementById('f_name').value,
                buildingNo: document.getElementById('f_buildingNo').value,
                role: document.getElementById('f_role').value,
                phone: document.getElementById('f_phone').value,
                email: document.getElementById('f_email').value,
                password: document.getElementById('f_password').value
            };
            let result;
            if (editingId > 0) { data.id = editingId; result = updateDormAdmin(data); }
            else { result = addDormAdmin(data); }
            if (result.success) {
                showToast(editingId > 0 ? '更新成功' : '添加成功', 'success');
                closeModal(); loadTable();
            } else { showToast(result.message, 'error'); }
            return false;
        }

        function handleDelete(id, name) {
            if (!confirm('确定要删除宿管 ' + name + ' 吗？')) return;
            const result = deleteDormAdmin(id);
            if (result.success) { showToast('删除成功', 'success'); loadTable(); }
            else { showToast(result.message, 'error'); }
        }

        loadTable();
        document.getElementById('adminModal').addEventListener('click', function(e) { if (e.target === this) closeModal(); });
    </script>
</body>
</html>
