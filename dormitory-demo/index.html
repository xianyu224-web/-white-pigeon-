<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>登录 - 宿舍管理系统</title>
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <script src="mock-data.js"></script>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: 'Inter', system-ui, sans-serif;
            background: #fff;
            color: #000;
            min-height: 100vh;
        }
        header {
            position: sticky;
            top: 44px;
            z-index: 50;
            background: rgba(255,255,255,0.9);
            backdrop-filter: blur(12px);
            border-bottom: 1px solid #e0e0e0;
            box-shadow: 2px 2px 0 0 rgba(0,0,0,1);
        }
        .header-inner {
            max-width: 1200px;
            margin: 0 auto;
            padding: 0 20px;
            height: 64px;
            display: flex;
            align-items: center;
            justify-content: space-between;
        }
        .logo {
            display: flex;
            align-items: center;
            gap: 10px;
            font-size: 20px;
            font-weight: 700;
            color: #000;
            text-decoration: none;
        }
        .logo i { font-size: 24px; }
        main {
            max-width: 1200px;
            margin: 0 auto;
            padding: 40px 20px;
            min-height: calc(100vh - 64px - 44px - 60px);
            display: flex;
            align-items: center;
            justify-content: center;
        }
        .login-card {
            width: 100%;
            max-width: 420px;
            background: #fff;
            border: 1px solid #e0e0e0;
            border-radius: 12px;
            padding: 32px;
            box-shadow: 4px 4px 0 0 rgba(0,0,0,1);
        }
        .login-title {
            text-align: center;
            margin-bottom: 32px;
        }
        .login-title h1 {
            font-size: clamp(1.5rem, 3vw, 2rem);
            font-weight: 700;
            margin-bottom: 8px;
        }
        .login-title p {
            color: #666;
            font-size: 14px;
        }
        .form-group {
            margin-bottom: 20px;
        }
        .form-group label {
            display: block;
            font-size: 14px;
            color: #666;
            margin-bottom: 8px;
            font-weight: 500;
        }
        .form-group select,
        .form-group input {
            width: 100%;
            padding: 12px 16px;
            border: 1px solid #e0e0e0;
            border-radius: 8px;
            background: #f5f5f5;
            font-size: 14px;
            color: #000;
            transition: all 0.2s;
            font-family: inherit;
        }
        .form-group select:focus,
        .form-group input:focus {
            outline: none;
            border-color: #000;
            background: #fff;
        }
        .btn {
            width: 100%;
            padding: 12px 24px;
            background: #000;
            color: #fff;
            border: none;
            border-radius: 8px;
            font-size: 15px;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.2s;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
            box-shadow: 2px 2px 0 0 rgba(0,0,0,1);
        }
        .btn:hover {
            background: #333;
            transform: translate(-1px, -1px);
            box-shadow: 3px 3px 0 0 rgba(0,0,0,1);
        }
        .btn:active {
            transform: translate(1px, 1px);
            box-shadow: 1px 1px 0 0 rgba(0,0,0,1);
        }
        .btn-outline {
            background: #fff;
            color: #000;
            border: 1px solid #000;
        }
        .btn-outline:hover {
            background: #f5f5f5;
        }
        .message-box {
            padding: 12px;
            border-radius: 8px;
            font-size: 14px;
            margin-bottom: 20px;
        }
        .message-box.error {
            background: #fef2f2;
            color: #dc2626;
            border: 1px solid #fecaca;
        }
        .message-box.success {
            background: #f0fdf4;
            color: #166534;
            border: 1px solid #bbf7d0;
        }
        .quick-login {
            margin-top: 24px;
            padding-top: 24px;
            border-top: 1px solid #e0e0e0;
        }
        .quick-login-title {
            text-align: center;
            font-size: 12px;
            color: #999;
            margin-bottom: 16px;
        }
        .quick-login-btns {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 12px;
        }
        .quick-login-btn {
            padding: 10px;
            background: #fff;
            color: #000;
            border: 1px solid #000;
            border-radius: 8px;
            font-size: 13px;
            font-weight: 500;
            cursor: pointer;
            transition: all 0.2s;
            box-shadow: 2px 2px 0 0 rgba(0,0,0,1);
        }
        .quick-login-btn:hover {
            background: #f5f5f5;
            transform: translate(-1px, -1px);
            box-shadow: 3px 3px 0 0 rgba(0,0,0,1);
        }
        .register-link {
            text-align: center;
            margin-top: 24px;
            padding-top: 24px;
            border-top: 1px solid #e0e0e0;
            font-size: 14px;
            color: #666;
        }
        .register-link a {
            color: #000;
            text-decoration: none;
            font-weight: 600;
        }
        .register-link a:hover {
            text-decoration: underline;
        }
        footer {
            border-top: 1px solid #e0e0e0;
            background: rgba(255,255,255,0.5);
            padding: 16px 20px;
            text-align: center;
            font-size: 12px;
            color: #666;
            letter-spacing: 0.5px;
        }
    </style>
</head>
<body>
    <header>
        <div class="header-inner">
            <a href="index.html" class="logo">
                <i class="fa fa-building"></i>
                <span>宿舍管理系统</span>
            </a>
        </div>
    </header>

    <main>
        <div class="login-card">
            <div class="login-title">
                <h1>用户登录</h1>
                <p>请使用您的账号登录系统</p>
            </div>

            <form id="loginForm" onsubmit="return handleLogin(event)">
                <div class="form-group">
                    <label>用户类型</label>
                    <select id="userType" required>
                        <option value="">请选择用户类型</option>
                        <option value="student">学生</option>
                        <option value="admin">宿管</option>
                    </select>
                </div>

                <div class="form-group">
                    <label id="usernameLabel">账号</label>
                    <input type="text" id="username" placeholder="请输入账号" required>
                </div>

                <div class="form-group">
                    <label>密码</label>
                    <input type="password" id="password" placeholder="请输入密码" required>
                </div>

                <div id="messageBox" class="message-box error" style="display:none;"></div>

                <button type="submit" class="btn">
                    <i class="fa fa-sign-in-alt"></i>
                    登录
                </button>

                <div class="quick-login">
                    <div class="quick-login-title">快速体验（一键登录）</div>
                    <div class="quick-login-btns">
                        <button type="button" class="quick-login-btn" onclick="quickLogin('student')">
                            <i class="fa fa-user-graduate"></i> 学生登录
                        </button>
                        <button type="button" class="quick-login-btn" onclick="quickLogin('admin')">
                            <i class="fa fa-user-shield"></i> 宿管登录
                        </button>
                    </div>
                </div>

                <div class="register-link">
                    还没有账号？<a href="register.html">立即注册</a>
                </div>
            </form>
        </div>
    </main>

    <footer>
        <p>© 2024 宿舍管理系统 | 版本 1.0.0</p>
    </footer>

    <script>
        // 动态切换账号标签
        document.getElementById('userType').addEventListener('change', function() {
            const label = document.getElementById('usernameLabel');
            const input = document.getElementById('username');
            if (this.value === 'student') {
                label.textContent = '学号';
                input.placeholder = '请输入学号';
            } else if (this.value === 'admin') {
                label.textContent = '工号';
                input.placeholder = '请输入宿管工号';
            } else {
                label.textContent = '账号';
                input.placeholder = '请输入账号';
            }
        });

        function showMessage(text, type) {
            const box = document.getElementById('messageBox');
            box.textContent = text;
            box.className = 'message-box ' + type;
            box.style.display = 'block';
            setTimeout(() => { box.style.display = 'none'; }, 3000);
        }

        function handleLogin(e) {
            e.preventDefault();
            const userType = document.getElementById('userType').value;
            const username = document.getElementById('username').value;
            const password = document.getElementById('password').value;

            if (!userType || !username || !password) {
                showMessage('请填写所有必填项', 'error');
                return false;
            }

            let result;
            if (userType === 'student') {
                result = studentLogin(username, password);
            } else {
                result = adminLogin(username, password);
            }

            if (result.success) {
                showMessage('登录成功，正在跳转...', 'success');
                setTimeout(() => {
                    if (userType === 'student') {
                        window.location.href = 'profile.html';
                    } else {
                        window.location.href = 'dashboard.html';
                    }
                }, 800);
            } else {
                showMessage(result.message, 'error');
            }
            return false;
        }

        function quickLogin(type) {
            if (type === 'student') {
                document.getElementById('userType').value = 'student';
                document.getElementById('username').value = '2024001';
                document.getElementById('password').value = '123456';
                document.getElementById('usernameLabel').textContent = '学号';
                document.getElementById('username').placeholder = '请输入学号';
            } else {
                document.getElementById('userType').value = 'admin';
                document.getElementById('username').value = 'AD001';
                document.getElementById('password').value = '123456';
                document.getElementById('usernameLabel').textContent = '工号';
                document.getElementById('username').placeholder = '请输入宿管工号';
            }
            handleLogin(new Event('submit'));
        }

        // 如果已登录，跳转到对应页面
        (function() {
            const user = getCurrentUser();
            if (user) {
                if (user.role === 'admin') {
                    window.location.href = 'dashboard.html';
                } else {
                    window.location.href = 'profile.html';
                }
            }
        })();
    </script>
</body>
</html>
