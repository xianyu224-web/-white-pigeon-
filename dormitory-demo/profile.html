<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>个人中心 - 宿舍管理系统</title>
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <script src="mock-data.js"></script>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { font-family: 'Inter', system-ui, sans-serif; background: #fff; color: #000; min-height: 100vh; }
        header { position: sticky; top: 44px; z-index: 50; background: rgba(255,255,255,0.9); backdrop-filter: blur(12px); border-bottom: 1px solid #e0e0e0; box-shadow: 2px 2px 0 0 rgba(0,0,0,1); }
        .header-inner { max-width: 1200px; margin: 0 auto; padding: 0 20px; height: 64px; display: flex; align-items: center; justify-content: space-between; }
        .logo { display: flex; align-items: center; gap: 10px; font-size: 20px; font-weight: 700; color: #000; text-decoration: none; }
        .logo i { font-size: 24px; }
        nav { display: flex; gap: 32px; margin-left: 40px; flex: 1; }
        nav a { color: #666; text-decoration: none; font-size: 14px; font-weight: 500; padding: 22px 0; border-bottom: 2px solid transparent; transition: all 0.2s; }
        nav a:hover { color: #000; }
        nav a.active { color: #000; border-bottom-color: #000; font-weight: 600; }
        .header-right { display: flex; align-items: center; gap: 16px; }
        .user-info { display: flex; align-items: center; gap: 10px; }
        .user-avatar { width: 32px; height: 32px; border-radius: 50%; background: #f5f5f5; border: 1px solid rgba(0,0,0,0.3); display: flex; align-items: center; justify-content: center; color: #666; font-size: 14px; }
        .user-name { font-size: 14px; font-weight: 500; }
        .logout-btn { padding: 8px; border: none; background: transparent; color: #666; cursor: pointer; border-radius: 50%; transition: all 0.2s; font-size: 16px; }
        .logout-btn:hover { background: #f5f5f5; color: #000; }
        main { max-width: 1200px; margin: 0 auto; padding: 32px 20px; min-height: calc(100vh - 64px - 44px - 60px); }
        .page-title { margin-bottom: 24px; }
        .page-title h1 { font-size: clamp(1.5rem, 3vw, 2rem); font-weight: 700; margin-bottom: 4px; }
        .page-title p { color: #666; font-size: 14px; }
        .card { background: #fff; border: 1px solid #e0e0e0; border-radius: 12px; padding: 24px; box-shadow: 2px 2px 0 0 rgba(0,0,0,1); margin-bottom: 24px; max-width: 600px; }
        .profile-header { display: flex; align-items: center; margin-bottom: 24px; }
        .profile-avatar { width: 64px; height: 64px; border-radius: 50%; background: #f5f5f5; display: flex; align-items: center; justify-content: center; font-size: 28px; color: #666; margin-right: 16px; }
        .profile-name h2 { font-size: 20px; font-weight: 700; margin-bottom: 4px; }
        .profile-name p { color: #666; font-size: 14px; }
        .info-list { border-top: 1px solid #e0e0e0; }
        .info-item { display: flex; justify-content: space-between; padding: 12px 0; border-bottom: 1px solid #e0e0e0; font-size: 14px; }
        .info-item .label { color: #666; }
        .info-item .value { font-weight: 500; }
        .card h3 { font-size: 18px; font-weight: 700; margin-bottom: 16px; }
        .form-group { margin-bottom: 16px; }
        .form-group label { display: block; font-size: 13px; font-weight: 500; color: #374151; margin-bottom: 6px; }
        .form-group input { width: 100%; padding: 10px 14px; border: 1px solid #e0e0e0; border-radius: 8px; background: #f5f5f5; font-size: 14px; font-family: inherit; transition: all 0.2s; }
        .form-group input:focus { outline: none; border-color: #000; background: #fff; }
        .btn { padding: 10px 20px; background: #000; color: #fff; border: none; border-radius: 8px; font-size: 14px; font-weight: 500; cursor: pointer; transition: all 0.2s; display: inline-flex; align-items: center; gap: 8px; box-shadow: 2px 2px 0 0 rgba(0,0,0,1); }
        .btn:hover { background: #333; transform: translate(-1px, -1px); box-shadow: 3px 3px 0 0 rgba(0,0,0,1); }
        .message-box { padding: 12px; border-radius: 8px; font-size: 14px; margin-bottom: 16px; }
        .message-box.error { background: #fef2f2; color: #dc2626; border: 1px solid #fecaca; }
        .message-box.success { background: #f0fdf4; color: #166534; border: 1px solid #bbf7d0; }
        footer { border-top: 1px solid #e0e0e0; background: rgba(255,255,255,0.5); padding: 16px 20px; text-align: center; font-size: 12px; color: #666; letter-spacing: 0.5px; }
        .mobile-menu-btn { display: none; background: none; border: none; font-size: 20px; cursor: pointer; color: #000; }
        @media (max-width: 768px) {
            nav { display: none; position: absolute; top: 64px; left: 0; right: 0; background: #fff; border-bottom: 1px solid #e0e0e0; flex-direction: column; padding: 16px 20px; gap: 12px; margin-left: 0; z-index: 100; }
            nav.open { display: flex; }
            nav a { padding: 8px 0; border-bottom: none; }
            nav a.active { border-bottom: none; }
            .mobile-menu-btn { display: block; }
            .user-name { display: none; }
        }
    </style>
</head>
<body>
    <header>
        <div class="header-inner">
            <div style="display:flex;align-items:center;">
                <a href="profile.html" class="logo"><i class="fa fa-building"></i><span>宿舍管理系统</span></a>
                <nav id="mainNav">
                    <a href="profile.html" class="active">个人中心</a>
                    <a href="#" onclick="logout();return false;" style="margin-left:auto;">退出登录</a>
                </nav>
            </div>
            <div class="header-right">
                <button class="mobile-menu-btn" onclick="toggleMenu()"><i class="fa fa-bars"></i></button>
                <div class="user-info"><div class="user-avatar" id="userAvatarIcon"><i class="fa fa-user"></i></div><span class="user-name" id="userName">用户</span></div>
                <button class="logout-btn" onclick="logout()"><i class="fa fa-sign-out"></i></button>
            </div>
        </div>
    </header>

    <main>
        <div class="page-title">
            <h1>个人中心</h1>
            <p>查看和修改个人信息</p>
        </div>

        <div class="card">
            <div class="profile-header">
                <div class="profile-avatar" id="profileAvatar"><i class="fa fa-user"></i></div>
                <div class="profile-name">
                    <h2 id="displayName">用户</h2>
                    <p id="displayRole">学生</p>
                </div>
            </div>
            <div class="info-list" id="infoList"></div>
        </div>

        <div class="card">
            <h3>修改密码</h3>
            <div id="pwdMsg" class="message-box" style="display:none;"></div>
            <form onsubmit="return changePassword(event)">
                <div class="form-group"><label>原密码 *</label><input type="password" id="oldPwd" required></div>
                <div class="form-group"><label>新密码 *</label><input type="password" id="newPwd" required></div>
                <div class="form-group"><label>确认新密码 *</label><input type="password" id="confirmPwd" required></div>
                <button type="submit" class="btn"><i class="fa fa-key"></i> 修改密码</button>
            </form>
        </div>
    </main>

    <footer><p>© 2024 宿舍管理系统 | 版本 1.0.0</p></footer>

    <script>
        const user = requireLogin();
        if (user) {
            document.getElementById('userName').textContent = user.name;
            document.getElementById('displayName').textContent = user.name;
            document.getElementById('displayRole').textContent = user.role === 'admin' ? '管理员' : '学生';

            const icon = user.role === 'admin' ? 'fa-user-shield' : 'fa-user-graduate';
            document.getElementById('userAvatarIcon').innerHTML = `<i class="fa ${icon}"></i>`;
            document.getElementById('profileAvatar').innerHTML = `<i class="fa ${icon}"></i>`;

            // 管理员显示管理菜单
            if (user.role === 'admin') {
                document.getElementById('displayRole').textContent = '管理员（' + (user.roleName || '宿管') + '）';
                const nav = document.getElementById('mainNav');
                nav.innerHTML = `
                    <a href="dashboard.html">仪表板</a>
                    <a href="student.html">学生管理</a>
                    <a href="dorm.html">宿舍管理</a>
                    <a href="dormadmin.html">宿管管理</a>
                    <a href="profile.html" class="active">个人中心</a>
                `;
            }

            // 个人信息列表
            let infoHtml = '';
            if (user.role === 'student') {
                infoHtml = `
                    <div class="info-item"><span class="label">学号</span><span class="value">${user.studentNo || '-'}</span></div>
                    <div class="info-item"><span class="label">姓名</span><span class="value">${user.name || '-'}</span></div>
                    <div class="info-item"><span class="label">性别</span><span class="value">${user.gender || '-'}</span></div>
                    <div class="info-item"><span class="label">班级</span><span class="value">${user.className || '-'}</span></div>
                    <div class="info-item"><span class="label">宿舍</span><span class="value">${user.dormNo || '未分配'}</span></div>
                    <div class="info-item"><span class="label">状态</span><span class="value">${user.status || '-'}</span></div>
                    <div class="info-item"><span class="label">邮箱</span><span class="value">${user.email || '-'}</span></div>
                    <div class="info-item"><span class="label">电话</span><span class="value">${user.phone || '-'}</span></div>
                `;
            } else {
                infoHtml = `
                    <div class="info-item"><span class="label">工号</span><span class="value">${user.adminNo || '-'}</span></div>
                    <div class="info-item"><span class="label">姓名</span><span class="value">${user.name || '-'}</span></div>
                    <div class="info-item"><span class="label">楼栋</span><span class="value">${user.buildingNo || '-'}</span></div>
                    <div class="info-item"><span class="label">角色</span><span class="value">${user.role || '普通宿管'}</span></div>
                    <div class="info-item"><span class="label">邮箱</span><span class="value">${user.email || '-'}</span></div>
                    <div class="info-item"><span class="label">电话</span><span class="value">${user.phone || '-'}</span></div>
                `;
            }
            document.getElementById('infoList').innerHTML = infoHtml;
        }

        function toggleMenu() { document.getElementById('mainNav').classList.toggle('open'); }

        function showPwdMsg(text, type) {
            const box = document.getElementById('pwdMsg');
            box.textContent = text;
            box.className = 'message-box ' + type;
            box.style.display = 'block';
            setTimeout(() => { box.style.display = 'none'; }, 3000);
        }

        function changePassword(e) {
            e.preventDefault();
            const oldPwd = document.getElementById('oldPwd').value;
            const newPwd = document.getElementById('newPwd').value;
            const confirmPwd = document.getElementById('confirmPwd').value;

            if (newPwd !== confirmPwd) { showPwdMsg('两次输入的新密码不一致', 'error'); return false; }
            if (newPwd.length < 6) { showPwdMsg('新密码长度不能少于6位', 'error'); return false; }

            // 简化处理：演示版提示成功
            showPwdMsg('密码修改成功，请重新登录', 'success');
            setTimeout(() => { logout(); }, 1500);
            return false;
        }
    </script>
</body>
</html>
