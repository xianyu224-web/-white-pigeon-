<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>仪表板 - 宿舍管理系统</title>
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <script src="mock-data.js"></script>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: 'Inter', system-ui, sans-serif;
            background: #fff;
            color: #000;
            min-height: 100vh;
        }
        header {
            position: sticky;
            top: 44px;
            z-index: 50;
            background: rgba(255,255,255,0.9);
            backdrop-filter: blur(12px);
            border-bottom: 1px solid #e0e0e0;
            box-shadow: 2px 2px 0 0 rgba(0,0,0,1);
        }
        .header-inner {
            max-width: 1200px;
            margin: 0 auto;
            padding: 0 20px;
            height: 64px;
            display: flex;
            align-items: center;
            justify-content: space-between;
        }
        .logo {
            display: flex;
            align-items: center;
            gap: 10px;
            font-size: 20px;
            font-weight: 700;
            color: #000;
            text-decoration: none;
        }
        .logo i { font-size: 24px; }
        nav {
            display: flex;
            gap: 32px;
            margin-left: 40px;
            flex: 1;
        }
        nav a {
            color: #666;
            text-decoration: none;
            font-size: 14px;
            font-weight: 500;
            padding: 22px 0;
            border-bottom: 2px solid transparent;
            transition: all 0.2s;
        }
        nav a:hover { color: #000; }
        nav a.active {
            color: #000;
            border-bottom-color: #000;
            font-weight: 600;
        }
        .header-right {
            display: flex;
            align-items: center;
            gap: 16px;
        }
        .user-info {
            display: flex;
            align-items: center;
            gap: 10px;
        }
        .user-avatar {
            width: 32px;
            height: 32px;
            border-radius: 50%;
            background: #f5f5f5;
            border: 1px solid rgba(0,0,0,0.3);
            display: flex;
            align-items: center;
            justify-content: center;
            color: #666;
            font-size: 14px;
        }
        .user-name {
            font-size: 14px;
            font-weight: 500;
        }
        .logout-btn {
            padding: 8px;
            border: none;
            background: transparent;
            color: #666;
            cursor: pointer;
            border-radius: 50%;
            transition: all 0.2s;
            font-size: 16px;
        }
        .logout-btn:hover {
            background: #f5f5f5;
            color: #000;
        }
        main {
            max-width: 1200px;
            margin: 0 auto;
            padding: 32px 20px;
            min-height: calc(100vh - 64px - 44px - 60px);
        }
        .page-title {
            margin-bottom: 24px;
        }
        .page-title h1 {
            font-size: clamp(1.5rem, 3vw, 2rem);
            font-weight: 700;
            margin-bottom: 4px;
        }
        .page-title p {
            color: #666;
            font-size: 14px;
        }
        .stats-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(220px, 1fr));
            gap: 16px;
            margin-bottom: 24px;
        }
        .stat-card {
            background: #fff;
            border: 1px solid #e0e0e0;
            border-radius: 12px;
            padding: 20px;
            box-shadow: 2px 2px 0 0 rgba(0,0,0,1);
            display: flex;
            align-items: center;
            justify-content: space-between;
        }
        .stat-info p {
            font-size: 14px;
            color: #666;
            margin-bottom: 4px;
        }
        .stat-info h3 {
            font-size: 28px;
            font-weight: 700;
        }
        .stat-icon {
            width: 48px;
            height: 48px;
            border-radius: 8px;
            background: #f5f5f5;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 20px;
        }
        .welcome-card {
            background: #fff;
            border: 1px solid #e0e0e0;
            border-radius: 12px;
            padding: 32px;
            box-shadow: 2px 2px 0 0 rgba(0,0,0,1);
        }
        .welcome-card h2 {
            font-size: 18px;
            font-weight: 700;
            margin-bottom: 12px;
        }
        .welcome-card p {
            color: #666;
            font-size: 14px;
            line-height: 1.6;
        }
        footer {
            border-top: 1px solid #e0e0e0;
            background: rgba(255,255,255,0.5);
            padding: 16px 20px;
            text-align: center;
            font-size: 12px;
            color: #666;
            letter-spacing: 0.5px;
        }
        .mobile-menu-btn {
            display: none;
            background: none;
            border: none;
            font-size: 20px;
            cursor: pointer;
            color: #000;
        }
        @media (max-width: 768px) {
            nav {
                display: none;
                position: absolute;
                top: 64px;
                left: 0;
                right: 0;
                background: #fff;
                border-bottom: 1px solid #e0e0e0;
                flex-direction: column;
                padding: 16px 20px;
                gap: 12px;
                margin-left: 0;
            }
            nav.open { display: flex; }
            nav a { padding: 8px 0; border-bottom: none; }
            nav a.active { border-bottom: none; }
            .mobile-menu-btn { display: block; }
            .user-name { display: none; }
        }
    </style>
</head>
<body>
    <header>
        <div class="header-inner">
            <div style="display:flex;align-items:center;">
                <a href="dashboard.html" class="logo">
                    <i class="fa fa-building"></i>
                    <span>宿舍管理系统</span>
                </a>
                <nav id="mainNav">
                    <a href="dashboard.html" class="active">仪表板</a>
                    <a href="student.html">学生管理</a>
                    <a href="dorm.html">宿舍管理</a>
                    <a href="dormadmin.html">宿管管理</a>
                    <a href="profile.html">个人中心</a>
                </nav>
            </div>
            <div class="header-right">
                <button class="mobile-menu-btn" onclick="toggleMenu()">
                    <i class="fa fa-bars"></i>
                </button>
                <div class="user-info">
                    <div class="user-avatar"><i class="fa fa-user-shield"></i></div>
                    <span class="user-name" id="userName">管理员</span>
                </div>
                <button class="logout-btn" onclick="logout()" title="退出登录">
                    <i class="fa fa-sign-out"></i>
                </button>
            </div>
        </div>
    </header>

    <main>
        <div class="page-title">
            <h1>仪表板</h1>
            <p>系统概览和数据统计</p>
        </div>

        <div class="stats-grid" id="statsGrid"></div>

        <div class="welcome-card">
            <h2>欢迎使用宿舍管理系统</h2>
            <p>您可以点击上方导航栏管理学生、宿舍和宿管信息。系统支持学生和宿管双角色，涵盖学生信息管理、宿舍分配、退宿管理等完整功能。</p>
        </div>
    </main>

    <footer>
        <p>© 2024 宿舍管理系统 | 版本 1.0.0</p>
    </footer>

    <script>
        const user = requireAdmin();
        if (user) {
            document.getElementById('userName').textContent = user.name;
        }

        function toggleMenu() {
            document.getElementById('mainNav').classList.toggle('open');
        }

        function loadStats() {
            const stats = getStats();
            const items = [
                { label: '总学生数', value: stats.studentCount, icon: 'fa-users' },
                { label: '总宿舍数', value: stats.dormCount, icon: 'fa-building' },
                { label: '宿管人数', value: stats.adminCount, icon: 'fa-user-shield' },
                { label: '已分配宿舍', value: stats.assignedCount, icon: 'fa-bed' }
            ];
            document.getElementById('statsGrid').innerHTML = items.map(item => `
                <div class="stat-card">
                    <div class="stat-info">
                        <p>${item.label}</p>
                        <h3>${item.value}</h3>
                    </div>
                    <div class="stat-icon"><i class="fa ${item.icon}"></i></div>
                </div>
            `).join('');
        }

        loadStats();
    </script>
</body>
</html>
