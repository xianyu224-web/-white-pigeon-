<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>注册 - 宿舍管理系统</title>
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <script src="mock-data.js"></script>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { font-family: 'Inter', system-ui, sans-serif; background: #fff; color: #000; min-height: 100vh; }
        header { position: sticky; top: 44px; z-index: 50; background: rgba(255,255,255,0.9); backdrop-filter: blur(12px); border-bottom: 1px solid #e0e0e0; box-shadow: 2px 2px 0 0 rgba(0,0,0,1); }
        .header-inner { max-width: 1200px; margin: 0 auto; padding: 0 20px; height: 64px; display: flex; align-items: center; justify-content: space-between; }
        .logo { display: flex; align-items: center; gap: 10px; font-size: 20px; font-weight: 700; color: #000; text-decoration: none; }
        .logo i { font-size: 24px; }
        .login-link { color: #000; text-decoration: none; font-size: 14px; font-weight: 600; }
        .login-link:hover { text-decoration: underline; }
        main { max-width: 1200px; margin: 0 auto; padding: 40px 20px; min-height: calc(100vh - 64px - 44px - 60px); display: flex; align-items: center; justify-content: center; }
        .register-card { width: 100%; max-width: 560px; background: #fff; border: 1px solid #e0e0e0; border-radius: 12px; padding: 32px; box-shadow: 4px 4px 0 0 rgba(0,0,0,1); }
        .register-title { text-align: center; margin-bottom: 32px; }
        .register-title h1 { font-size: clamp(1.5rem, 3vw, 2rem); font-weight: 700; margin-bottom: 8px; }
        .register-title p { color: #666; font-size: 14px; }
        .form-grid { display: grid; grid-template-columns: 1fr; gap: 16px; margin-bottom: 20px; }
        @media (min-width: 640px) { .form-grid { grid-template-columns: 1fr 1fr; } }
        .form-group { margin-bottom: 0; }
        .form-group.full { grid-column: 1 / -1; }
        .form-group label { display: block; font-size: 14px; color: #666; margin-bottom: 8px; font-weight: 500; }
        .form-group input, .form-group select { width: 100%; padding: 12px 16px; border: 1px solid #e0e0e0; border-radius: 8px; background: #f5f5f5; font-size: 14px; color: #000; transition: all 0.2s; font-family: inherit; }
        .form-group input:focus, .form-group select:focus { outline: none; border-color: #000; background: #fff; }
        .btn { width: 100%; padding: 12px 24px; background: #000; color: #fff; border: none; border-radius: 8px; font-size: 15px; font-weight: 600; cursor: pointer; transition: all 0.2s; display: flex; align-items: center; justify-content: center; gap: 8px; box-shadow: 2px 2px 0 0 rgba(0,0,0,1); }
        .btn:hover { background: #333; transform: translate(-1px, -1px); box-shadow: 3px 3px 0 0 rgba(0,0,0,1); }
        .message-box { padding: 12px; border-radius: 8px; font-size: 14px; margin-bottom: 20px; }
        .message-box.error { background: #fef2f2; color: #dc2626; border: 1px solid #fecaca; }
        .message-box.success { background: #f0fdf4; color: #166534; border: 1px solid #bbf7d0; }
        .tips { background: #f5f5f5; padding: 12px; border-radius: 8px; border: 1px solid #e0e0e0; margin-bottom: 20px; }
        .tips p { font-size: 12px; color: #666; margin-bottom: 4px; }
        .tips ul { font-size: 12px; color: #666; list-style: disc; padding-left: 20px; }
        .tips li { margin-bottom: 2px; }
        .login-link-section { text-align: center; margin-top: 24px; padding-top: 24px; border-top: 1px solid #e0e0e0; font-size: 14px; color: #666; }
        .login-link-section a { color: #000; text-decoration: none; font-weight: 600; }
        .login-link-section a:hover { text-decoration: underline; }
        footer { border-top: 1px solid #e0e0e0; background: rgba(255,255,255,0.5); padding: 16px 20px; text-align: center; font-size: 12px; color: #666; letter-spacing: 0.5px; }
    </style>
</head>
<body>
    <header>
        <div class="header-inner">
            <a href="index.html" class="logo"><i class="fa fa-building"></i><span>宿舍管理系统</span></a>
            <a href="index.html" class="login-link"><i class="fa fa-sign-in-alt"></i> 已有账号？去登录</a>
        </div>
    </header>

    <main>
        <div class="register-card">
            <div class="register-title">
                <h1>学生注册</h1>
                <p>填写以下信息完成学生注册</p>
            </div>

            <form onsubmit="return handleRegister(event)">
                <div id="messageBox" class="message-box error" style="display:none;"></div>

                <div class="form-grid">
                    <div class="form-group">
                        <label>学号 <span style="color:#ef4444;">*</span></label>
                        <input type="text" id="studentNo" placeholder="请输入学号" required>
                    </div>
                    <div class="form-group">
                        <label>姓名 <span style="color:#ef4444;">*</span></label>
                        <input type="text" id="name" placeholder="请输入真实姓名" required>
                    </div>
                    <div class="form-group">
                        <label>性别 <span style="color:#ef4444;">*</span></label>
                        <select id="gender" required>
                            <option value="">请选择性别</option>
                            <option value="男">男</option>
                            <option value="女">女</option>
                        </select>
                    </div>
                    <div class="form-group">
                        <label>班级</label>
                        <input type="text" id="className" placeholder="例如：计算机科学与技术1班">
                    </div>
                    <div class="form-group">
                        <label>联系电话</label>
                        <input type="tel" id="phone" placeholder="请输入联系电话">
                    </div>
                    <div class="form-group">
                        <label>邮箱</label>
                        <input type="email" id="email" placeholder="请输入邮箱地址">
                    </div>
                    <div class="form-group">
                        <label>密码 <span style="color:#ef4444;">*</span></label>
                        <input type="password" id="password" placeholder="至少6位字符" required>
                    </div>
                    <div class="form-group">
                        <label>确认密码 <span style="color:#ef4444;">*</span></label>
                        <input type="password" id="confirmPassword" placeholder="再次输入密码" required>
                    </div>
                </div>

                <div class="tips">
                    <p style="font-weight:500;margin-bottom:6px;">密码要求：</p>
                    <ul>
                        <li>至少6个字符长度</li>
                        <li>建议使用字母、数字和特殊符号组合</li>
                        <li>不要使用过于简单的密码，如"123456"等</li>
                    </ul>
                </div>

                <button type="submit" class="btn">
                    <i class="fa fa-user-plus"></i> 注册账号
                </button>

                <div class="login-link-section">
                    已有账号？<a href="index.html">立即登录</a>
                </div>
            </form>
        </div>
    </main>

    <footer><p>© 2024 宿舍管理系统 | 版本 1.0.0</p></footer>

    <script>
        function showMessage(text, type) {
            const box = document.getElementById('messageBox');
            box.textContent = text;
            box.className = 'message-box ' + type;
            box.style.display = 'block';
            setTimeout(() => { box.style.display = 'none'; }, 5000);
        }

        function handleRegister(e) {
            e.preventDefault();
            const data = {
                studentNo: document.getElementById('studentNo').value,
                name: document.getElementById('name').value,
                gender: document.getElementById('gender').value,
                className: document.getElementById('className').value,
                phone: document.getElementById('phone').value,
                email: document.getElementById('email').value,
                password: document.getElementById('password').value,
                confirmPassword: document.getElementById('confirmPassword').value
            };

            if (!data.studentNo || !data.name || !data.gender || !data.password || !data.confirmPassword) {
                showMessage('请填写所有必填字段（标*的）', 'error'); return false;
            }
            if (!/^\d+$/.test(data.studentNo)) { showMessage('学号应为数字', 'error'); return false; }
            if (data.password !== data.confirmPassword) { showMessage('两次输入的密码不一致', 'error'); return false; }
            if (data.password.length < 6) { showMessage('密码长度不能少于6位', 'error'); return false; }
            if (data.phone && !/^1[3-9]\d{9}$/.test(data.phone)) { showMessage('请输入正确的手机号码', 'error'); return false; }
            if (data.email && !/^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(data.email)) { showMessage('请输入正确的邮箱地址', 'error'); return false; }

            const result = studentRegister(data);
            if (result.success) {
                showMessage('注册成功！正在跳转到登录页面...', 'success');
                setTimeout(() => { window.location.href = 'index.html'; }, 1500);
            } else {
                showMessage(result.message, 'error');
            }
            return false;
        }
    </script>
</body>
</html>
