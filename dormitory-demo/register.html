<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>宿舍管理系统 - 学生注册</title>
  <!-- 引入Tailwind CSS -->
  <script src="https://cdn.tailwindcss.com"></script>
  <!-- 引入Font Awesome -->
  <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" rel="stylesheet">

  <!-- 配置Tailwind -->
  <script>
    tailwind.config = {
      theme: {
        extend: {
          colors: {
            primary: '#000000',
            secondary: '#ffffff',
            dark: '#111111',
            darker: '#0a0a0a',
            'dark-card': '#1a1a1a',
            'light-gray': '#f5f5f5',
            'medium-gray': '#666666',
            'border-gray': '#e0e0e0',
          },
          fontFamily: {
            sans: ['Inter', 'system-ui', 'sans-serif'],
          },
        },
      }
    }
  </script>

  <style type="text/tailwindcss">
    @layer utilities {
      .content-auto {
        content-visibility: auto;
      }
      .grid-pattern {
        background-image:
                linear-gradient(rgba(255, 255, 255, 0.05) 1px, transparent 1px),
                linear-gradient(90deg, rgba(255, 255, 255, 0.05) 1px, transparent 1px);
        background-size: 20px 20px;
      }
      .scrollbar-thin {
        scrollbar-width: thin;
      }
      .scrollbar-thin::-webkit-scrollbar {
        width: 4px;
        height: 4px;
      }
      .scrollbar-thin::-webkit-scrollbar-thumb {
        background-color: rgba(0, 0, 0, 0.5);
        border-radius: 2px;
      }
      .ins-border {
        border: 2px solid #000;
      }
      .ins-shadow {
        box-shadow: 4px 4px 0px 0px rgba(0, 0, 0, 1);
      }
      .ins-shadow-sm {
        box-shadow: 2px 2px 0px 0px rgba(0, 0, 0, 1);
      }
      .ins-hover:hover {
        transform: translate(-2px, -2px);
        box-shadow: 6px 6px 0px 0px rgba(0, 0, 0, 1);
      }
    }
  </style>

  <!-- 引入字体 -->
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">

  <!-- 引入模拟数据模块 -->
  <script src="mock-data.js"></script>
</head>
<body class="font-sans bg-white min-h-screen text-gray-900 scrollbar-thin">

<!-- 导航栏 -->
<header class="sticky top-0 z-50 bg-white/90 backdrop-blur-md border-b border-border-gray ins-shadow-sm">
  <div class="container mx-auto px-4">
    <div class="flex items-center justify-between h-16">
      <!-- 左侧Logo -->
      <div class="flex items-center">
        <a href="index.html" class="flex items-center hover:opacity-80 transition">
          <i class="fa fa-building text-2xl text-black mr-2"></i>
          <span class="text-xl font-bold text-black">宿舍管理系统</span>
        </a>
      </div>

      <!-- 右侧登录链接 -->
      <div>
        <a href="index.html" class="text-black hover:text-gray-700 transition font-medium">
          <i class="fa fa-sign-in-alt mr-1"></i>已有账号？去登录
        </a>
      </div>
    </div>
  </div>
</header>

<!-- 主内容区 -->
<main class="container mx-auto px-4 py-6 flex items-center justify-center min-h-[80vh]">
  <div class="w-full max-w-lg">
    <!-- 页面标题 -->
    <div class="mb-8 text-center">
      <h1 class="text-[clamp(1.5rem,3vw,2rem)] font-bold text-black mb-2">学生注册</h1>
      <p class="text-medium-gray text-sm">填写以下信息完成学生注册</p>
    </div>

    <!-- 注册表单 -->
    <div class="bg-white rounded-xl p-6 border border-border-gray ins-shadow-sm">
      <form id="registerForm" class="space-y-4">
        <!-- 基本信息行 -->
        <div class="grid grid-cols-1 md:grid-cols-2 gap-4">
          <div>
            <label class="block text-sm text-medium-gray mb-2">学号 <span class="text-red-500">*</span></label>
            <input type="text" id="studentNo"
                   class="w-full px-4 py-3 rounded-lg bg-light-gray border border-border-gray focus:border-black focus:outline-none transition duration-200 text-black"
                   placeholder="请输入学号" required>
            <p class="text-xs text-medium-gray mt-1">学号将作为您的登录账号</p>
          </div>

          <div>
            <label class="block text-sm text-medium-gray mb-2">姓名 <span class="text-red-500">*</span></label>
            <input type="text" id="name"
                   class="w-full px-4 py-3 rounded-lg bg-light-gray border border-border-gray focus:border-black focus:outline-none transition duration-200 text-black"
                   placeholder="请输入真实姓名" required>
          </div>
        </div>

        <!-- 性别和班级行 -->
        <div class="grid grid-cols-1 md:grid-cols-2 gap-4">
          <div>
            <label class="block text-sm text-medium-gray mb-2">性别 <span class="text-red-500">*</span></label>
            <select id="gender" class="w-full px-4 py-3 rounded-lg bg-light-gray border border-border-gray focus:border-black focus:outline-none transition duration-200 text-black" required>
              <option value="">请选择性别</option>
              <option value="男">男</option>
              <option value="女">女</option>
            </select>
          </div>

          <div>
            <label class="block text-sm text-medium-gray mb-2">班级</label>
            <input type="text" id="className"
                   class="w-full px-4 py-3 rounded-lg bg-light-gray border border-border-gray focus:border-black focus:outline-none transition duration-200 text-black"
                   placeholder="例如：计算机科学与技术1班">
          </div>
        </div>

        <!-- 联系信息行 -->
        <div class="grid grid-cols-1 md:grid-cols-2 gap-4">
          <div>
            <label class="block text-sm text-medium-gray mb-2">联系电话</label>
            <input type="tel" id="phone"
                   class="w-full px-4 py-3 rounded-lg bg-light-gray border border-border-gray focus:border-black focus:outline-none transition duration-200 text-black"
                   placeholder="请输入联系电话">
          </div>

          <div>
            <label class="block text-sm text-medium-gray mb-2">邮箱</label>
            <input type="email" id="email"
                   class="w-full px-4 py-3 rounded-lg bg-light-gray border border-border-gray focus:border-black focus:outline-none transition duration-200 text-black"
                   placeholder="请输入邮箱地址">
          </div>
        </div>

        <!-- 宿舍信息行 -->
        <div>
          <label class="block text-sm text-medium-gray mb-2">宿舍ID（选填）</label>
          <input type="number" id="dormId"
                 class="w-full px-4 py-3 rounded-lg bg-light-gray border border-border-gray focus:border-black focus:outline-none transition duration-200 text-black"
                 placeholder="请输入宿舍ID" min="0">
          <p class="text-xs text-medium-gray mt-1">如果不清楚可以留空，后续由宿管分配</p>
        </div>

        <!-- 密码行 -->
        <div class="grid grid-cols-1 md:grid-cols-2 gap-4">
          <div>
            <label class="block text-sm text-medium-gray mb-2">密码 <span class="text-red-500">*</span></label>
            <input type="password" id="password"
                   class="w-full px-4 py-3 rounded-lg bg-light-gray border border-border-gray focus:border-black focus:outline-none transition duration-200 text-black"
                   placeholder="至少6位字符" required>
            <div class="text-xs mt-1">
              <span class="text-medium-gray">密码强度：</span>
              <span id="passwordStrength" class="font-medium">弱</span>
            </div>
          </div>

          <div>
            <label class="block text-sm text-medium-gray mb-2">确认密码 <span class="text-red-500">*</span></label>
            <input type="password" id="confirmPassword"
                   class="w-full px-4 py-3 rounded-lg bg-light-gray border border-border-gray focus:border-black focus:outline-none transition duration-200 text-black"
                   placeholder="再次输入密码" required>
            <div id="passwordMatch" class="text-xs mt-1"></div>
          </div>
        </div>

        <!-- 密码提示 -->
        <div class="bg-light-gray p-3 rounded-lg border border-border-gray">
          <p class="text-xs text-medium-gray mb-1">密码要求：</p>
          <ul class="text-xs text-medium-gray list-disc pl-4">
            <li>至少6个字符长度</li>
            <li>建议使用字母、数字和特殊符号组合</li>
            <li>不要使用过于简单的密码，如"123456"等</li>
          </ul>
        </div>

        <!-- 消息提示 -->
        <div id="message" class="hidden p-3 rounded-lg text-sm" style="display: none;"></div>

        <!-- 注册按钮 -->
        <div class="pt-2">
          <button type="submit" class="w-full px-4 py-3 bg-black text-white font-semibold rounded-lg hover:bg-gray-800 transition flex items-center justify-center ins-shadow-sm ins-hover">
            <i class="fa fa-user-plus mr-2"></i> 注册账号
          </button>
        </div>

        <!-- 登录链接 -->
        <div class="pt-4 border-t border-border-gray text-center">
          <p class="text-medium-gray text-sm">已有账号？<a href="index.html" class="text-black hover:text-gray-700 transition font-medium">立即登录</a></p>
        </div>
      </form>
    </div>
  </div>
</main>

<!-- 页脚 -->
<footer class="mt-8 border-t border-border-gray bg-white/50 py-4">
  <div class="container mx-auto px-4 text-center text-xs text-medium-gray tracking-wider">
    <p>© 2024 宿舍管理系统 | 版本 1.0.0 (演示版)</p>
  </div>
</footer>

<script>
  // 全局消息显示函数
  function showMessage(text, type = 'success') {
    const messageDiv = document.getElementById('message');
    messageDiv.textContent = text;
    messageDiv.className = 'p-3 rounded-lg text-sm';
    messageDiv.style.display = 'block';

    if (type === 'success') {
      messageDiv.classList.add('bg-gray-100', 'text-black', 'border', 'border-border-gray');
    } else {
      messageDiv.classList.add('bg-red-50', 'text-red-600', 'border', 'border-red-200');
    }

    // 5秒后自动隐藏消息
    setTimeout(() => {
      messageDiv.style.display = 'none';
    }, 5000);
  }

  // 密码强度检测
  function checkPasswordStrength(password) {
    if (!password) return { strength: '弱', score: 0 };

    let score = 0;
    if (password.length >= 6) score += 1;
    if (password.length >= 8) score += 1;
    if (/[A-Z]/.test(password)) score += 1;
    if (/[0-9]/.test(password)) score += 1;
    if (/[^A-Za-z0-9]/.test(password)) score += 1;

    if (score <= 2) return { strength: '弱', score };
    if (score <= 3) return { strength: '中', score };
    return { strength: '强', score };
  }

  // 实时检测密码强度
  document.getElementById('password').addEventListener('input', function(e) {
    const password = e.target.value;
    const result = checkPasswordStrength(password);
    const strengthElement = document.getElementById('passwordStrength');

    strengthElement.textContent = result.strength;

    if (result.strength === '弱') {
      strengthElement.className = 'font-medium text-red-500';
    } else if (result.strength === '中') {
      strengthElement.className = 'font-medium text-yellow-500';
    } else {
      strengthElement.className = 'font-medium text-green-500';
    }
  });

  // 实时检查密码是否匹配
  function checkPasswordMatch() {
    const password = document.getElementById('password').value;
    const confirmPassword = document.getElementById('confirmPassword').value;
    const matchElement = document.getElementById('passwordMatch');

    if (!confirmPassword) {
      matchElement.textContent = '';
      matchElement.className = 'text-xs mt-1';
      return;
    }

    if (password === confirmPassword) {
      matchElement.textContent = '✓ 密码匹配';
      matchElement.className = 'text-xs mt-1 text-green-500';
    } else {
      matchElement.textContent = '✗ 密码不匹配';
      matchElement.className = 'text-xs mt-1 text-red-500';
    }
  }

  document.getElementById('password').addEventListener('input', checkPasswordMatch);
  document.getElementById('confirmPassword').addEventListener('input', checkPasswordMatch);

  // 表单提交
  document.getElementById('registerForm').addEventListener('submit', async function(e) {
    e.preventDefault();

    const formData = {
      studentNo: document.getElementById('studentNo').value.trim(),
      name: document.getElementById('name').value.trim(),
      gender: document.getElementById('gender').value,
      phone: document.getElementById('phone').value.trim(),
      email: document.getElementById('email').value.trim(),
      className: document.getElementById('className').value.trim(),
      dormId: parseInt(document.getElementById('dormId').value) || 0,
      password: document.getElementById('password').value,
      confirmPassword: document.getElementById('confirmPassword').value
    };

    // 验证必填字段
    if (!formData.studentNo || !formData.name || !formData.gender ||
            !formData.password || !formData.confirmPassword) {
      showMessage('请填写所有必填字段（标*的）', 'error');
      return;
    }

    // 验证学号格式
    if (!/^\d+$/.test(formData.studentNo)) {
      showMessage('学号应为数字', 'error');
      return;
    }

    // 验证密码
    if (formData.password !== formData.confirmPassword) {
      showMessage('两次输入的密码不一致', 'error');
      return;
    }

    if (formData.password.length < 6) {
      showMessage('密码长度不能少于6位', 'error');
      return;
    }

    // 验证电话格式
    if (formData.phone && !/^1[3-9]\d{9}$/.test(formData.phone)) {
      showMessage('请输入正确的手机号码', 'error');
      return;
    }

    // 验证邮箱格式
    if (formData.email && !/^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(formData.email)) {
      showMessage('请输入正确的邮箱地址', 'error');
      return;
    }

    // 显示加载状态
    const submitBtn = this.querySelector('button[type="submit"]');
    const originalText = submitBtn.innerHTML;
    submitBtn.innerHTML = '<i class="fa fa-spinner fa-spin mr-2"></i>注册中...';
    submitBtn.disabled = true;

    try {
      // 使用模拟数据注册
      const result = await MockData.student.register(formData);

      if (result.success) {
        showMessage('注册成功！正在自动登录...', 'success');

        if (result.autoLogin && result.student) {
          // 自动登录成功
          sessionStorage.setItem('student', JSON.stringify(result.student));
          sessionStorage.setItem('loginType', 'student');
          setTimeout(() => {
            window.location.href = 'student-profile.html';
          }, 2000);
        } else {
          // 注册成功，跳转到登录页
          setTimeout(() => {
            window.location.href = 'index.html';
          }, 2000);
        }
      } else {
        showMessage(result.message || '注册失败', 'error');
      }
    } catch (error) {
      console.error('注册失败:', error);
      showMessage('注册出错，请重试', 'error');
    } finally {
      submitBtn.innerHTML = originalText;
      submitBtn.disabled = false;
    }
  });

  // 页面加载时检查是否已登录
  window.addEventListener('DOMContentLoaded', async function() {
    try {
      const result = await MockData.student.checkLogin();

      if (result.isLogin && result.student) {
        // 如果已登录，直接跳转到主页
        sessionStorage.setItem('student', JSON.stringify(result.student));
        showMessage('您已登录，正在跳转到主页...', 'success');
        setTimeout(() => {
          window.location.href = 'student-profile.html';
        }, 1500);
      }
    } catch (error) {
      console.log('未登录状态，可正常注册');
    }
  });

  // 输入框获取焦点时的效果
  const inputs = document.querySelectorAll('input, select');
  inputs.forEach(input => {
    input.addEventListener('focus', function() {
      this.parentElement.classList.add('opacity-100');
    });

    input.addEventListener('blur', function() {
      this.parentElement.classList.remove('opacity-100');
    });
  });
</script>

<!-- 引入演示版提示条 -->
<script src="demo-banner.js"></script>
</body>
</html>
