<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>宿舍管理系统 - 学生个人中心</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://code.jquery.com/jquery-3.6.0.min.js"></script>
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" rel="stylesheet">
    <!-- 引入模拟数据模块 -->
    <script src="mock-data.js"></script>

    <style>
        .status-in { background-color: #d1fae5; color: #065f46; border-color: #a7f3d0; }
        .status-out { background-color: #fee2e2; color: #991b1b; border-color: #fecaca; }
        .status-unassigned { background-color: #f3f4f6; color: #374151; border-color: #e5e7eb; }
    </style>
</head>
<body class="font-sans bg-gray-50 min-h-screen text-gray-900">
<header class="sticky top-0 z-50 bg-white/90 backdrop-blur-md border-b border-gray-200 shadow-sm">
    <div class="container mx-auto px-4">
        <div class="flex items-center justify-between h-16">
            <div class="flex items-center">
                <i class="fa fa-building text-2xl text-black mr-2"></i>
                <span class="text-xl font-bold text-black">宿舍管理系统</span>
            </div>
            <div class="flex items-center gap-4">
                <button id="refreshBtn" class="p-2 rounded-full text-gray-500 hover:text-black hover:bg-gray-100 transition" title="刷新">
                    <i class="fa fa-sync"></i>
                </button>
                <button id="logOutBtn" class="px-3 py-1.5 text-sm border border-gray-300 rounded-lg hover:border-black hover:text-black transition">
                    <i class="fa fa-sign-out-alt mr-1"></i>退出登录
                </button>
                <img id="userAvatar" class="h-8 w-8 rounded-full border border-black/30" src="https://picsum.photos/200/200?random=1" alt="用户头像">
                <span id="userName" class="ml-2 text-black font-medium">加载中...</span>
            </div>
        </div>
    </div>
</header>

<main class="container mx-auto px-4 py-8">
    <div class="mb-8 flex flex-col md:flex-row md:items-center md:justify-between">
        <div>
            <h1 class="text-2xl font-bold text-black">学生个人中心</h1>
            <p class="text-gray-600 text-sm mt-1">查看个人信息和宿舍详情</p>
        </div>
        <div class="mt-4 md:mt-0 flex gap-3">
            <button id="editInfoBtn" class="px-4 py-2 bg-black text-white font-medium rounded-lg hover:bg-gray-800 transition flex items-center">
                <i class="fa fa-edit mr-2"></i> 编辑信息
            </button>
        </div>
    </div>

    <div class="grid grid-cols-1 lg:grid-cols-3 gap-6">
        <div class="lg:col-span-2">
            <div class="bg-white rounded-xl border border-gray-200 overflow-hidden shadow-sm mb-6">
                <div class="px-6 py-4 border-b border-gray-200 bg-gray-50">
                    <h2 class="text-lg font-bold text-black">个人信息</h2>
                </div>
                <div class="p-6">
                    <div id="mainContent">
                        <div class="flex flex-col md:flex-row items-start md:items-center gap-6 mb-8">
                            <div class="relative">
                                <img id="profileAvatar" class="w-24 h-24 rounded-full border-2 border-black" src="https://picsum.photos/200/200?random=1" alt="学生头像">
                            </div>
                            <div class="flex-1">
                                <h3 id="profileName" class="text-xl font-bold text-black mb-2">加载中...</h3>
                                <div class="flex flex-wrap gap-4 mb-3">
                                    <div class="flex items-center">
                                        <i class="fa fa-id-card text-gray-500 mr-2"></i>
                                        <span class="text-black" id="profileStudentNo">学号：加载中...</span>
                                    </div>
                                    <div class="flex items-center">
                                        <i class="fa fa-venus-mars text-gray-500 mr-2"></i>
                                        <span class="text-black" id="profileGender">性别：加载中...</span>
                                    </div>
                                    <div class="flex items-center">
                                        <i class="fa fa-calendar-alt text-gray-500 mr-2"></i>
                                        <span class="text-black" id="profileCreatedAt">入学时间：加载中...</span>
                                    </div>
                                </div>
                                <div class="flex items-center">
                                    <span id="profileStatus" class="px-3 py-1 text-sm rounded-full border status-in">在校</span>
                                </div>
                            </div>
                        </div>

                        <div class="grid grid-cols-1 md:grid-cols-2 gap-6">
                            <div class="space-y-4">
                                <div>
                                    <label class="block text-sm font-medium text-gray-600 mb-1">班级</label>
                                    <div class="px-4 py-3 rounded-lg bg-gray-50 border border-gray-200 text-black" id="profileClassName">加载中...</div>
                                </div>
                                <div>
                                    <label class="block text-sm font-medium text-gray-600 mb-1">联系方式</label>
                                    <div class="px-4 py-3 rounded-lg bg-gray-50 border border-gray-200 text-black" id="profilePhone">加载中...</div>
                                </div>
                            </div>
                            <div class="space-y-4">
                                <div>
                                    <label class="block text-sm font-medium text-gray-600 mb-1">电子邮箱</label>
                                    <div class="px-4 py-3 rounded-lg bg-gray-50 border border-gray-200 text-black" id="profileEmail">加载中...</div>
                                </div>
                                <div>
                                    <label class="block text-sm font-medium text-gray-600 mb-1">宿舍信息</label>
                                    <div class="px-4 py-3 rounded-lg bg-gray-50 border border-gray-200 text-black" id="profileDormInfo">加载中...</div>
                                </div>
                            </div>
                        </div>

                    </div>
                </div>
            </div>

            <div class="bg-white rounded-xl border border-gray-200 overflow-hidden shadow-sm">
                <div class="px-6 py-4 border-b border-gray-200 bg-gray-50 flex justify-between items-center">
                    <h2 class="text-lg font-bold text-black">宿舍舍友</h2>
                    <div class="text-sm text-gray-600" id="dormInfoSummary">宿舍信息加载中...</div>
                </div>
                <div class="p-6">
                    <div id="roommateContent">
                        <div id="roommateLoading" class="text-center py-8">
                            <div class="inline-block animate-spin rounded-full h-8 w-8 border-b-2 border-black"></div>
                            <p class="mt-3 text-gray-600">加载舍友信息中...</p>
                        </div>

                        <div id="roommateList" class="hidden"></div>

                        <div id="noRoommateMessage" class="hidden text-center py-8">
                            <i class="fa fa-users text-4xl text-gray-300 mb-4"></i>
                            <h3 class="text-lg font-medium text-gray-700 mb-2">暂无宿舍信息</h3>
                            <p class="text-gray-600 mb-6">您当前没有分配宿舍，或者宿舍中没有其他舍友。</p>
                        </div>
                    </div>
                </div>
            </div>
        </div>

        <div class="space-y-6">
            <div class="bg-white rounded-xl border border-gray-200 overflow-hidden shadow-sm">
                <div class="px-6 py-4 border-b border-gray-200 bg-gray-50">
                    <h3 class="text-lg font-bold text-black">宿舍详情</h3>
                </div>
                <div class="p-6">
                    <div id="dormContent">
                        <div id="dormDetailsLoading" class="text-center py-4">
                            <div class="inline-block animate-spin rounded-full h-6 w-6 border-b-2 border-black"></div>
                        </div>
                        <div id="dormDetails" class="hidden space-y-4"></div>
                        <div id="noDormMessage" class="hidden text-center py-4">
                            <i class="fa fa-bed text-3xl text-gray-300 mb-3"></i>
                            <p class="text-gray-600 text-sm">您当前没有分配宿舍</p>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </div>
</main>

<div id="editInfoModal" class="fixed inset-0 bg-black bg-opacity-50 z-50 hidden p-4">
    <div class="bg-white rounded-xl max-w-md w-full shadow-lg mx-auto my-8 relative top-1/2 transform -translate-y-1/2">
        <div class="p-6">
            <div class="flex justify-between items-center mb-6">
                <h3 class="text-xl font-bold text-black">编辑个人信息</h3>
                <button id="closeEditModal" class="text-gray-500 hover:text-black">
                    <i class="fa fa-times"></i>
                </button>
            </div>

            <form id="editForm" class="space-y-4">
                <div>
                    <label class="block text-sm font-medium text-gray-700 mb-1">姓名</label>
                    <input type="text" id="editName" required
                           class="w-full px-4 py-2 rounded-lg bg-gray-50 border border-gray-300 focus:border-black focus:outline-none transition duration-200 text-black">
                </div>

                <div>
                    <label class="block text-sm font-medium text-gray-700 mb-1">性别</label>
                    <select id="editGender" class="w-full px-4 py-2 rounded-lg bg-gray-50 border border-gray-300 focus:border-black focus:outline-none transition duration-200 text-black">
                        <option value="男">男</option>
                        <option value="女">女</option>
                    </select>
                </div>

                <div>
                    <label class="block text-sm font-medium text-gray-700 mb-1">班级</label>
                    <input type="text" id="editClassName" required
                           class="w-full px-4 py-2 rounded-lg bg-gray-50 border border-gray-300 focus:border-black focus:outline-none transition duration-200 text-black">
                </div>

                <div>
                    <label class="block text-sm font-medium text-gray-700 mb-1">手机号</label>
                    <input type="tel" id="editPhone"
                           class="w-full px-4 py-2 rounded-lg bg-gray-50 border border-gray-300 focus:border-black focus:outline-none transition duration-200 text-black">
                </div>

                <div>
                    <label class="block text-sm font-medium text-gray-700 mb-1">邮箱</label>
                    <input type="email" id="editEmail"
                           class="w-full px-4 py-2 rounded-lg bg-gray-50 border border-gray-300 focus:border-black focus:outline-none transition duration-200 text-black">
                </div>

                <div class="mt-6 flex justify-end gap-3">
                    <button type="button" id="cancelEdit" class="px-4 py-2 border border-gray-300 rounded-lg hover:border-black hover:text-black transition">
                        取消
                    </button>
                    <button type="submit" class="px-4 py-2 bg-black text-white font-medium rounded-lg hover:bg-gray-800 transition">
                        保存修改
                    </button>
                </div>
            </form>
        </div>
    </div>
</div>

<script>
    $(document).ready(function() {
        let currentStudent = null;
        let roommates = [];

        // 从sessionStorage获取登录信息
        function getCurrentStudent() {
            try {
                const studentStr = sessionStorage.getItem('student');
                if (!studentStr) {
                    window.location.href = 'index.html';
                    return null;
                }
                return JSON.parse(studentStr);
            } catch (e) {
                console.error('解析登录信息失败:', e);
                window.location.href = 'index.html';
                return null;
            }
        }

        // 显示错误信息
        function showError(message) {
            $('#mainContent').html(`
                <div class="text-center py-8">
                    <i class="fa fa-exclamation-triangle text-4xl text-red-500 mb-4"></i>
                    <h3 class="text-lg font-semibold text-gray-800 mb-2">信息加载失败</h3>
                    <p class="text-gray-600 mb-4">${message}</p>
                </div>
            `);
        }

        // 显示学生信息
        function updateStudentProfile(student) {
            if (!student) return;

            $('#userName').text(student.name || '学生');
            $('#profileName').text(student.name || '未知姓名');
            $('#profileStudentNo').text(`学号: ${student.studentNo || '未知'}`);
            $('#profileGender').text(`性别: ${student.gender || '未知'}`);
            $('#profileClassName').text(student.className || '未知班级');
            $('#profilePhone').text(student.phone || '未填写');
            $('#profileEmail').text(student.email || '未填写');

            if (student.createdAt) {
                try {
                    const createDate = new Date(student.createdAt);
                    if (!isNaN(createDate.getTime())) {
                        $('#profileCreatedAt').text(`入学时间: ${createDate.toLocaleDateString()}`);
                    } else {
                        $('#profileCreatedAt').text(`入学时间: ${student.createdAt}`);
                    }
                } catch (e) {
                    $('#profileCreatedAt').text(`入学时间: ${student.createdAt}`);
                }
            } else {
                $('#profileCreatedAt').text('入学时间: 未知');
            }

            const $statusElement = $('#profileStatus');
            $statusElement.removeClass('status-in status-out status-unassigned');

            if (student.status === '退宿') {
                $statusElement.addClass('status-out').text('退宿');
            } else if (!student.dormId || student.dormId <= 0) {
                $statusElement.addClass('status-unassigned').text('未分配宿舍');
            } else {
                $statusElement.addClass('status-in').text('在校');
            }

            if (student.dormId && student.dormId > 0) {
                const dormInfo = student.buildingNo && student.dormNo
                    ? `${student.buildingNo} ${student.dormNo}`
                    : '已分配宿舍';
                $('#profileDormInfo').text(dormInfo);
            } else {
                $('#profileDormInfo').text('未分配宿舍');
            }
        }

        // 加载学生信息
        async function loadStudentInfo() {
            const sessionStudent = getCurrentStudent();
            if (!sessionStudent) return;

            currentStudent = sessionStudent;
            updateStudentProfile(sessionStudent);

            const studentNo = sessionStudent.studentNo;

            if (studentNo) {
                try {
                    const data = await MockData.student.getByNo(studentNo);
                    if (data && data.success !== false) {
                        currentStudent = data;
                        updateStudentProfile(data);
                        // 同步更新 sessionStorage
                        const studentInfo = { ...data };
                        delete studentInfo.password;
                        sessionStorage.setItem('student', JSON.stringify(studentInfo));
                        loadRoommates();
                        loadDormDetails();
                        return;
                    }
                } catch (error) {
                    console.warn('通过学号查询失败:', error);
                }
            }

            showError('无法获取学生信息');
        }

        // 加载舍友信息
        async function loadRoommates() {
            if (!currentStudent || !currentStudent.dormId || currentStudent.dormId <= 0) {
                $('#roommateLoading').hide();
                $('#noRoommateMessage').removeClass('hidden');
                return;
            }

            try {
                const data = await MockData.student.getByDorm(currentStudent.dormId);
                roommates = Array.isArray(data) ? data : [];
                displayRoommates(roommates);

            } catch (error) {
                console.error('加载舍友信息失败:', error);
                $('#roommateLoading').hide();
                $('#roommateList').html(`
                    <div class="text-center py-8">
                        <i class="fa fa-exclamation-triangle text-3xl text-red-500 mb-4"></i>
                        <p class="text-gray-600">加载舍友信息失败</p>
                    </div>
                `);
                $('#roommateList').removeClass('hidden');
            }
        }

        // 显示舍友列表
        function displayRoommates(roommates) {
            if (!roommates || roommates.length === 0) {
                $('#roommateLoading').hide();
                $('#noRoommateMessage').removeClass('hidden');
                return;
            }

            const filteredRoommates = roommates.filter(roommate =>
                roommate.studentId !== currentStudent.studentId &&
                roommate.studentNo !== currentStudent.studentNo
            );

            if (filteredRoommates.length === 0) {
                $('#roommateLoading').hide();
                $('#noRoommateMessage').removeClass('hidden');
                return;
            }

            let html = `
                <div class="mb-4 text-gray-600 text-sm">
                    共 <span class="font-medium text-black">${filteredRoommates.length}</span> 位舍友
                </div>
                <div class="grid grid-cols-1 md:grid-cols-2 gap-4">
            `;

            filteredRoommates.forEach((roommate, index) => {
                html += `
                    <div class="border border-gray-200 rounded-lg p-4 hover:bg-gray-50 transition">
                        <div class="flex items-start">
                            <img src="https://picsum.photos/100/100?random=${roommate.studentId || index + 100}"
                                 class="w-12 h-12 rounded-full border border-gray-300 mr-3 object-cover"
                                 alt="舍友头像">
                            <div class="flex-1">
                                <h4 class="font-medium text-black">${roommate.name || '未知'}</h4>
                                <p class="text-sm text-gray-600 mb-2">${roommate.studentNo || ''}</p>
                                <div class="flex items-center text-xs text-gray-500">
                                    <span class="mr-3"><i class="fa fa-venus-mars mr-1"></i>${roommate.gender || '未知'}</span>
                                    <span><i class="fa fa-graduation-cap mr-1"></i>${roommate.className || '未知班级'}</span>
                                </div>
                            </div>
                        </div>
                    </div>
                `;
            });

            html += '</div>';

            $('#roommateLoading').hide();
            $('#roommateList').html(html);
            $('#roommateList').removeClass('hidden');
        }

        // 加载宿舍详情
        async function loadDormDetails() {
            if (!currentStudent || !currentStudent.dormId || currentStudent.dormId <= 0) {
                $('#dormDetailsLoading').hide();
                $('#dormDetails').addClass('hidden');
                $('#noDormMessage').removeClass('hidden');
                $('#dormInfoSummary').text('未分配宿舍');
                return;
            }

            try {
                const dorm = await MockData.dorm.getById(currentStudent.dormId);

                const dormInfo = {
                    buildingNo: dorm.buildingNo || currentStudent.buildingNo || '未知',
                    dormNo: dorm.dormNo || currentStudent.dormNo || '未知',
                    capacity: dorm.capacity || 4,
                    currentCount: dorm.currentCount || roommates.length || 1
                };

                displayDormDetails(dormInfo);

            } catch (error) {
                console.error('加载宿舍信息失败:', error);
                $('#dormDetailsLoading').hide();
                $('#dormDetails').html(`
                    <div class="text-center py-4 text-gray-600">
                        <i class="fa fa-exclamation-triangle text-xl text-red-500 mb-2"></i>
                        <p>加载宿舍信息失败</p>
                    </div>
                `);
                $('#dormDetails').removeClass('hidden');
                $('#dormInfoSummary').text('宿舍信息加载失败');
            }
        }

        // 显示宿舍详情
        function displayDormDetails(dorm) {
            const occupancy = dorm.currentCount || 1;
            const capacity = dorm.capacity || 4;
            const occupancyRate = Math.round((occupancy / capacity) * 100);

            $('#dormInfoSummary').text(`${dorm.buildingNo || ''} ${dorm.dormNo || ''} (${occupancy}/${capacity}人)`);

            let html = `
                <div class="space-y-4">
                    <div>
                        <label class="block text-sm font-medium text-gray-600 mb-1">宿舍号</label>
                        <div class="px-4 py-3 rounded-lg bg-gray-50 border border-gray-200 text-black font-medium">
                            ${dorm.buildingNo || ''} ${dorm.dormNo || ''}
                        </div>
                    </div>
                    <div>
                        <label class="block text-sm font-medium text-gray-600 mb-1">容纳人数</label>
                        <div class="px-4 py-3 rounded-lg bg-gray-50 border border-gray-200 text-black">
                            ${capacity} 人
                        </div>
                    </div>
                    <div>
                        <label class="block text-sm font-medium text-gray-600 mb-1">当前入住</label>
                        <div class="px-4 py-3 rounded-lg bg-gray-50 border border-gray-200">
                            <div class="flex items-center justify-between mb-2">
                                <span class="text-black">${occupancy} / ${capacity} 人</span>
                                <span class="text-black font-medium">${occupancyRate}%</span>
                            </div>
                            <div class="w-full bg-gray-200 rounded-full h-2">
                                <div class="bg-black h-2 rounded-full" style="width: ${Math.min(100, occupancyRate)}%"></div>
                            </div>
                        </div>
                    </div>
                </div>
            `;

            $('#dormDetailsLoading').hide();
            $('#dormDetails').html(html);
            $('#dormDetails').removeClass('hidden');
        }

        // 编辑信息
        $('#editInfoBtn').click(function() {
            if (!currentStudent) {
                alert('无法获取学生信息，请刷新页面重试');
                return;
            }

            $('#editName').val(currentStudent.name || '');
            $('#editGender').val(currentStudent.gender || '男');
            $('#editClassName').val(currentStudent.className || '');
            $('#editPhone').val(currentStudent.phone || '');
            $('#editEmail').val(currentStudent.email || '');

            $('#editInfoModal').removeClass('hidden');
        });

        // 编辑表单提交
        $('#editForm').submit(async function(e) {
            e.preventDefault();

            if (!currentStudent) {
                alert('未获取到学生信息，请刷新页面重试');
                return;
            }

            const name = $('#editName').val().trim();
            const gender = $('#editGender').val();
            const className = $('#editClassName').val().trim();
            const phone = $('#editPhone').val().trim();
            const email = $('#editEmail').val().trim();

            if (!name) {
                alert('姓名不能为空');
                return;
            }

            if (!className) {
                alert('班级不能为空');
                return;
            }

            const updateData = {
                studentId: currentStudent.studentId,
                name: name,
                gender: gender,
                phone: phone,
                email: email,
                className: className,
                dormId: currentStudent.dormId || 0,
                status: currentStudent.status || '在校'
            };

            const submitBtn = $(this).find('button[type="submit"]');
            const originalText = submitBtn.text();
            submitBtn.text('保存中...');
            submitBtn.prop('disabled', true);

            try {
                const result = await MockData.student.update(updateData);

                if (result.success) {
                    alert('信息更新成功');
                    $('#editInfoModal').addClass('hidden');

                    // 更新 sessionStorage
                    if (sessionStorage.getItem('student')) {
                        const updatedStudent = {
                            ...JSON.parse(sessionStorage.getItem('student')),
                            name: name,
                            gender: gender,
                            className: className,
                            phone: phone,
                            email: email
                        };
                        sessionStorage.setItem('student', JSON.stringify(updatedStudent));
                    }

                    loadStudentInfo();
                } else {
                    alert('信息更新失败: ' + result.message);
                }
            } catch (error) {
                console.error('更新学生信息失败:', error);
                alert('操作失败，请稍后重试');
            } finally {
                submitBtn.text(originalText);
                submitBtn.prop('disabled', false);
            }
        });

        // 模态框控制
        $('#closeEditModal, #cancelEdit').click(function() {
            $('#editInfoModal').addClass('hidden');
            $('#editForm')[0].reset();
        });

        // 刷新信息
        $('#refreshBtn').click(function() {
            loadStudentInfo();
        });

        // 退出登录
        $('#logOutBtn').click(function() {
            if (confirm('确定要退出登录吗？')) {
                sessionStorage.clear();
                window.location.href = 'index.html';
            }
        });

        // 页面加载时直接加载数据
        loadStudentInfo();
    });
</script>

<!-- 引入演示版提示条 -->
<script src="demo-banner.js"></script>
</body>
</html>
