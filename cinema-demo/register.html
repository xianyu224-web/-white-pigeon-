<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>注册 - 影院购票系统</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <script src="mock-data.js"></script>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        :root {
            --primary: #4361ee;
            --primary-dark: #3a56d4;
            --secondary: #7209b7;
            --accent: #f72585;
            --success: #2ed573;
            --danger: #ff4757;
            --warning: #ffa502;
            --dark: #1a1a2e;
            --light: #f8f9fa;
            --gray: #6c757d;
            --light-gray: #e9ecef;
            --card-shadow: 0 8px 30px rgba(0, 0, 0, 0.08);
            --hover-shadow: 0 20px 40px rgba(0, 0, 0, 0.12);
            --transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', 'PingFang SC', 'Microsoft YaHei', sans-serif;
            background: linear-gradient(135deg, #1a1a2e 0%, #16213e 50%, #0f3460 100%);
            color: var(--dark);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 40px 20px;
            position: relative;
            overflow: hidden;
        }

        body::before {
            content: '';
            position: absolute;
            width: 600px;
            height: 600px;
            border-radius: 50%;
            background: radial-gradient(circle, rgba(67, 97, 238, 0.15) 0%, transparent 70%);
            top: -200px;
            right: -100px;
            pointer-events: none;
        }

        body::after {
            content: '';
            position: absolute;
            width: 500px;
            height: 500px;
            border-radius: 50%;
            background: radial-gradient(circle, rgba(247, 37, 133, 0.12) 0%, transparent 70%);
            bottom: -150px;
            left: -100px;
            pointer-events: none;
        }

        .register-wrapper {
            width: 100%;
            max-width: 460px;
            position: relative;
            z-index: 10;
        }

        .register-container {
            background: white;
            border-radius: 24px;
            padding: 40px 35px;
            box-shadow: 0 25px 80px rgba(0, 0, 0, 0.3);
        }

        .register-header {
            text-align: center;
            margin-bottom: 35px;
        }

        .logo-icon-large {
            font-size: 48px;
            background: linear-gradient(135deg, var(--accent), var(--secondary));
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
            margin-bottom: 10px;
        }

        .register-header h1 {
            font-size: 26px;
            font-weight: 700;
            margin-bottom: 8px;
            color: var(--dark);
        }

        .register-header p {
            color: var(--gray);
            font-size: 14px;
        }

        .form-group {
            margin-bottom: 18px;
        }

        .form-label {
            display: block;
            font-size: 13px;
            font-weight: 600;
            margin-bottom: 8px;
            color: var(--dark);
        }

        .input-wrapper {
            position: relative;
        }

        .input-icon {
            position: absolute;
            left: 14px;
            top: 50%;
            transform: translateY(-50%);
            color: var(--gray);
            font-size: 16px;
            transition: var(--transition);
        }

        .form-input {
            width: 100%;
            padding: 12px 16px 12px 44px;
            border: 2px solid var(--light-gray);
            border-radius: 10px;
            font-size: 14px;
            transition: var(--transition);
            background: white;
            color: var(--dark);
        }

        .form-input:focus {
            outline: none;
            border-color: var(--primary);
            box-shadow: 0 0 0 4px rgba(67, 97, 238, 0.1);
        }

        .form-input:focus + .input-icon,
        .input-wrapper:focus-within .input-icon {
            color: var(--primary);
        }

        .form-error {
            font-size: 12px;
            color: var(--danger);
            margin-top: 5px;
            display: none;
        }

        .form-error.show {
            display: block;
        }

        .password-strength {
            margin-top: 8px;
            font-size: 12px;
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .strength-bars {
            display: flex;
            gap: 4px;
            flex: 1;
        }

        .strength-bar {
            height: 4px;
            flex: 1;
            background: var(--light-gray);
            border-radius: 2px;
            transition: var(--transition);
        }

        .strength-bar.weak {
            background: var(--danger);
        }

        .strength-bar.medium {
            background: var(--warning);
        }

        .strength-bar.strong {
            background: var(--success);
        }

        .strength-text {
            width: 50px;
            color: var(--gray);
            font-weight: 500;
        }

        .register-btn {
            width: 100%;
            padding: 14px;
            background: linear-gradient(135deg, var(--primary), var(--primary-dark));
            color: white;
            border: none;
            border-radius: 10px;
            font-size: 16px;
            font-weight: 600;
            cursor: pointer;
            transition: var(--transition);
            margin-top: 10px;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 10px;
        }

        .register-btn:hover:not(:disabled) {
            transform: translateY(-2px);
            box-shadow: 0 8px 25px rgba(67, 97, 238, 0.4);
        }

        .register-btn:active:not(:disabled) {
            transform: translateY(0);
        }

        .register-btn:disabled {
            opacity: 0.6;
            cursor: not-allowed;
        }

        .btn-loading {
            width: 18px;
            height: 18px;
            border: 2px solid rgba(255, 255, 255, 0.3);
            border-top-color: white;
            border-radius: 50%;
            animation: spin 0.8s linear infinite;
            display: none;
        }

        @keyframes spin {
            to { transform: rotate(360deg); }
        }

        .terms-text {
            font-size: 12px;
            color: var(--gray);
            text-align: center;
            margin-top: 15px;
            line-height: 1.6;
        }

        .terms-text a {
            color: var(--primary);
            text-decoration: none;
        }

        .login-link {
            text-align: center;
            margin-top: 25px;
            padding-top: 25px;
            border-top: 1px solid var(--light-gray);
        }

        .login-link a {
            color: var(--primary);
            text-decoration: none;
            font-weight: 600;
            transition: var(--transition);
        }

        .login-link a:hover {
            color: var(--primary-dark);
        }

        .demo-info {
            background: linear-gradient(135deg, rgba(67, 97, 238, 0.08), rgba(114, 9, 183, 0.08));
            border-radius: 12px;
            padding: 14px 18px;
            margin-bottom: 25px;
            font-size: 13px;
            color: var(--gray);
            display: flex;
            gap: 12px;
            align-items: flex-start;
        }

        .demo-info i {
            color: var(--primary);
            font-size: 16px;
            margin-top: 2px;
        }

        .demo-info strong {
            color: var(--dark);
        }

        .register-success {
            text-align: center;
            padding: 30px 0;
            display: none;
        }

        .register-success.show {
            display: block;
        }

        .success-icon {
            width: 80px;
            height: 80px;
            border-radius: 50%;
            background: linear-gradient(135deg, var(--success), #00b894);
            display: flex;
            align-items: center;
            justify-content: center;
            margin: 0 auto 20px;
            animation: successBounce 0.5s cubic-bezier(0.68, -0.55, 0.265, 1.55);
        }

        .success-icon i {
            color: white;
            font-size: 36px;
        }

        @keyframes successBounce {
            0% { transform: scale(0); }
            50% { transform: scale(1.15); }
            100% { transform: scale(1); }
        }

        .register-success h2 {
            font-size: 24px;
            font-weight: 700;
            margin-bottom: 10px;
            color: var(--dark);
        }

        .register-success p {
            color: var(--gray);
            margin-bottom: 25px;
        }

        .back-to-login-btn {
            padding: 12px 30px;
            background: linear-gradient(135deg, var(--primary), var(--primary-dark));
            color: white;
            border: none;
            border-radius: 10px;
            font-weight: 600;
            cursor: pointer;
            transition: var(--transition);
            display: inline-flex;
            align-items: center;
            gap: 8px;
        }

        .back-to-login-btn:hover {
            transform: translateY(-2px);
            box-shadow: 0 8px 20px rgba(67, 97, 238, 0.3);
        }

        @media (max-width: 480px) {
            .register-container {
                padding: 30px 25px;
            }

            .register-header h1 {
                font-size: 22px;
            }
        }
    </style>
</head>
<body>
    <div class="register-wrapper">
        <div class="register-container">
            <div class="register-header">
                <i class="fas fa-film logo-icon-large"></i>
                <h1>创建账号</h1>
                <p>加入嘻囔电影，享受精彩观影体验</p>
            </div>

            <div class="demo-info">
                <i class="fas fa-info-circle"></i>
                <div>
                    <strong>演示版本：</strong>注册数据仅保存在本地浏览器中。您也可以直接使用演示账号登录：<br>
                    用户名 <strong>demo</strong> / 密码 <strong>123456</strong>
                </div>
            </div>

            <!-- 注册表单 -->
            <form id="registerForm" onsubmit="handleRegister(event)">
                <div class="form-group">
                    <label class="form-label" for="username">用户名</label>
                    <div class="input-wrapper">
                        <i class="fas fa-user input-icon"></i>
                        <input type="text" id="username" class="form-input" placeholder="请输入用户名" required maxlength="20">
                    </div>
                    <div class="form-error" id="usernameError"></div>
                </div>

                <div class="form-group">
                    <label class="form-label" for="fullName">姓名</label>
                    <div class="input-wrapper">
                        <i class="fas fa-id-card input-icon"></i>
                        <input type="text" id="fullName" class="form-input" placeholder="请输入真实姓名" maxlength="50">
                    </div>
                    <div class="form-error" id="fullNameError"></div>
                </div>

                <div class="form-group">
                    <label class="form-label" for="email">邮箱</label>
                    <div class="input-wrapper">
                        <i class="fas fa-envelope input-icon"></i>
                        <input type="email" id="email" class="form-input" placeholder="请输入邮箱地址" required>
                    </div>
                    <div class="form-error" id="emailError"></div>
                </div>

                <div class="form-group">
                    <label class="form-label" for="password">密码</label>
                    <div class="input-wrapper">
                        <i class="fas fa-lock input-icon"></i>
                        <input type="password" id="password" class="form-input" placeholder="请输入密码（至少6位）" required minlength="6" oninput="checkPasswordStrength(this.value)">
                    </div>
                    <div class="password-strength" id="passwordStrength" style="display: none;">
                        <div class="strength-bars">
                            <div class="strength-bar" id="bar1"></div>
                            <div class="strength-bar" id="bar2"></div>
                            <div class="strength-bar" id="bar3"></div>
                        </div>
                        <span class="strength-text" id="strengthText"></span>
                    </div>
                    <div class="form-error" id="passwordError"></div>
                </div>

                <div class="form-group">
                    <label class="form-label" for="confirmPassword">确认密码</label>
                    <div class="input-wrapper">
                        <i class="fas fa-lock input-icon"></i>
                        <input type="password" id="confirmPassword" class="form-input" placeholder="请再次输入密码" required>
                    </div>
                    <div class="form-error" id="confirmPasswordError"></div>
                </div>

                <div class="form-group">
                    <label class="form-label" for="phone">手机号（选填）</label>
                    <div class="input-wrapper">
                        <i class="fas fa-phone input-icon"></i>
                        <input type="tel" id="phone" class="form-input" placeholder="请输入手机号" maxlength="11">
                    </div>
                    <div class="form-error" id="phoneError"></div>
                </div>

                <button type="submit" class="register-btn" id="registerBtn">
                    <span id="registerBtnText">立即注册</span>
                    <div class="btn-loading" id="btnLoading"></div>
                </button>

                <p class="terms-text">
                    注册即表示您同意我们的 <a href="#">《用户协议》</a> 和 <a href="#">《隐私政策》</a>
                </p>
            </form>

            <!-- 注册成功 -->
            <div class="register-success" id="registerSuccess">
                <div class="success-icon">
                    <i class="fas fa-check"></i>
                </div>
                <h2>注册成功！</h2>
                <p>您的账号已创建，可以开始购票了</p>
                <button class="back-to-login-btn" onclick="goToLogin()">
                    <i class="fas fa-sign-in-alt"></i> 去登录
                </button>
            </div>

            <div class="login-link">
                已有账号？ <a href="index.html">直接登录</a>
            </div>
        </div>
    </div>

    <script>
        function checkPasswordStrength(password) {
            const strengthEl = document.getElementById('passwordStrength');
            const bar1 = document.getElementById('bar1');
            const bar2 = document.getElementById('bar2');
            const bar3 = document.getElementById('bar3');
            const textEl = document.getElementById('strengthText');

            if (!password) {
                strengthEl.style.display = 'none';
                return;
            }

            strengthEl.style.display = 'flex';

            let strength = 0;
            if (password.length >= 6) strength++;
            if (password.length >= 8 && /[A-Z]/.test(password)) strength++;
            if (/[0-9]/.test(password) && /[^A-Za-z0-9]/.test(password)) strength++;

            // 重置
            bar1.className = 'strength-bar';
            bar2.className = 'strength-bar';
            bar3.className = 'strength-bar';

            if (strength <= 1) {
                bar1.classList.add('weak');
                textEl.textContent = '弱';
                textEl.style.color = 'var(--danger)';
            } else if (strength === 2) {
                bar1.classList.add('medium');
                bar2.classList.add('medium');
                textEl.textContent = '中';
                textEl.style.color = 'var(--warning)';
            } else {
                bar1.classList.add('strong');
                bar2.classList.add('strong');
                bar3.classList.add('strong');
                textEl.textContent = '强';
                textEl.style.color = 'var(--success)';
            }
        }

        function clearErrors() {
            document.querySelectorAll('.form-error').forEach(el => {
                el.classList.remove('show');
                el.textContent = '';
            });
        }

        function showError(fieldId, message) {
            const errorEl = document.getElementById(fieldId + 'Error');
            if (errorEl) {
                errorEl.textContent = message;
                errorEl.classList.add('show');
            }
        }

        async function handleRegister(event) {
            event.preventDefault();
            clearErrors();

            const username = document.getElementById('username').value.trim();
            const fullName = document.getElementById('fullName').value.trim();
            const email = document.getElementById('email').value.trim();
            const password = document.getElementById('password').value;
            const confirmPassword = document.getElementById('confirmPassword').value;
            const phone = document.getElementById('phone').value.trim();

            let hasError = false;

            // 验证
            if (!username) {
                showError('username', '请输入用户名');
                hasError = true;
            } else if (username.length < 3) {
                showError('username', '用户名至少3个字符');
                hasError = true;
            }

            if (!email) {
                showError('email', '请输入邮箱');
                hasError = true;
            } else if (!/^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(email)) {
                showError('email', '邮箱格式不正确');
                hasError = true;
            }

            if (!password) {
                showError('password', '请输入密码');
                hasError = true;
            } else if (password.length < 6) {
                showError('password', '密码至少6位');
                hasError = true;
            }

            if (password !== confirmPassword) {
                showError('confirmPassword', '两次输入的密码不一致');
                hasError = true;
            }

            if (phone && !/^1[3-9]\d{9}$/.test(phone)) {
                showError('phone', '手机号格式不正确');
                hasError = true;
            }

            if (hasError) return;

            // 开始注册
            const btn = document.getElementById('registerBtn');
            const btnText = document.getElementById('registerBtnText');
            const btnLoading = document.getElementById('btnLoading');

            btn.disabled = true;
            btnText.textContent = '注册中...';
            btnLoading.style.display = 'block';

            try {
                const result = await mockRegister({
                    username,
                    fullName,
                    email,
                    password,
                    phone
                });

                if (result.success) {
                    // 注册成功
                    document.getElementById('registerForm').style.display = 'none';
                    document.getElementById('registerSuccess').classList.add('show');
                } else {
                    // 显示错误
                    if (result.message.includes('用户名')) {
                        showError('username', result.message);
                    } else if (result.message.includes('邮箱')) {
                        showError('email', result.message);
                    } else {
                        showRegisterMessage(result.message || '注册失败', 'error');
                    }
                }
            } catch (error) {
                console.error('注册失败:', error);
                showRegisterMessage('注册失败，请稍后重试', 'error');
            } finally {
                btn.disabled = false;
                btnText.textContent = '立即注册';
                btnLoading.style.display = 'none';
            }
        }

        function goToLogin() {
            window.location.href = 'index.html';
        }

        function showRegisterMessage(message, type = 'info') {
            let msgEl = document.getElementById('register-msg-toast');
            if (!msgEl) {
                msgEl = document.createElement('div');
                msgEl.id = 'register-msg-toast';
                msgEl.style.cssText = `
                    position: fixed;
                    top: 30px;
                    left: 50%;
                    transform: translateX(-50%) translateY(-100px);
                    padding: 16px 32px;
                    border-radius: 12px;
                    color: white;
                    font-weight: 500;
                    z-index: 9999;
                    opacity: 0;
                    transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
                    backdrop-filter: blur(10px);
                    box-shadow: 0 8px 30px rgba(0,0,0,0.2);
                `;
                document.body.appendChild(msgEl);
            }

            const colors = {
                success: 'linear-gradient(135deg, #00b894, #00a885)',
                error: 'linear-gradient(135deg, #ff4757, #ff3838)',
                warning: 'linear-gradient(135deg, #fdcb6e, #f39c12)',
                info: 'linear-gradient(135deg, #4361ee, #3a56d4)'
            };

            msgEl.textContent = message;
            msgEl.style.background = colors[type] || colors.info;
            msgEl.style.opacity = '1';
            msgEl.style.transform = 'translateX(-50%) translateY(0)';

            setTimeout(() => {
                msgEl.style.opacity = '0';
                msgEl.style.transform = 'translateX(-50%) translateY(-100px)';
            }, 3000);
        }
    </script>
</body>
</html>
