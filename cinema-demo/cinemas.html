<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>影院列表 - 影院购票系统</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <script src="mock-data.js"></script>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        :root {
            --primary: #4361ee;
            --primary-dark: #3a56d4;
            --secondary: #7209b7;
            --accent: #f72585;
            --success: #2ed573;
            --danger: #ff4757;
            --warning: #ffa502;
            --dark: #1a1a2e;
            --light: #f8f9fa;
            --gray: #6c757d;
            --light-gray: #e9ecef;
            --card-shadow: 0 8px 30px rgba(0, 0, 0, 0.08);
            --hover-shadow: 0 20px 40px rgba(0, 0, 0, 0.12);
            --transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', 'PingFang SC', 'Microsoft YaHei', sans-serif;
            background: linear-gradient(135deg, #f5f7fa 0%, #c3cfe2 100%);
            color: var(--dark);
            min-height: 100vh;
        }

        .container {
            max-width: 1300px;
            margin: 0 auto;
            padding: 0 20px;
        }

        .header {
            background: linear-gradient(135deg, var(--dark) 0%, #16213e 100%);
            color: white;
            padding: 15px 0;
            box-shadow: 0 4px 20px rgba(0,0,0,0.1);
            position: sticky;
            top: 0;
            z-index: 1000;
        }

        .header-container {
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 30px;
        }

        .logo {
            display: flex;
            align-items: center;
            gap: 12px;
            text-decoration: none;
            color: white;
            transition: var(--transition);
        }

        .logo:hover {
            transform: translateY(-2px);
        }

        .logo-icon {
            font-size: 32px;
            background: linear-gradient(135deg, var(--accent), var(--secondary));
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
        }

        .logo-text {
            font-size: 24px;
            font-weight: 700;
            background: linear-gradient(135deg, #fff, #c3cfe2);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
        }

        .nav-menu {
            display: flex;
            gap: 20px;
        }

        .nav-item {
            color: rgba(255, 255, 255, 0.85);
            text-decoration: none;
            font-size: 15px;
            font-weight: 500;
            padding: 10px 16px;
            border-radius: 8px;
            transition: var(--transition);
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .nav-item:hover {
            color: white;
            background: rgba(255, 255, 255, 0.1);
            transform: translateY(-2px);
        }

        .nav-item.active {
            color: white;
            background: rgba(255, 255, 255, 0.15);
        }

        .main-content {
            padding: 40px 0 60px;
        }

        .page-header {
            margin-bottom: 30px;
        }

        .page-header h1 {
            font-size: 32px;
            font-weight: 700;
            margin-bottom: 10px;
            color: var(--dark);
            display: flex;
            align-items: center;
            gap: 12px;
        }

        .page-header p {
            color: var(--gray);
            font-size: 16px;
        }

        .filter-bar {
            background: white;
            padding: 20px 25px;
            border-radius: 16px;
            box-shadow: var(--card-shadow);
            margin-bottom: 30px;
            display: flex;
            gap: 20px;
            flex-wrap: wrap;
            align-items: center;
        }

        .filter-group {
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .filter-group label {
            font-weight: 600;
            color: var(--dark);
            font-size: 14px;
        }

        .filter-select, .filter-input {
            padding: 10px 15px;
            border: 2px solid var(--light-gray);
            border-radius: 8px;
            font-size: 14px;
            transition: var(--transition);
            background: white;
        }

        .filter-select:focus, .filter-input:focus {
            outline: none;
            border-color: var(--primary);
            box-shadow: 0 0 0 3px rgba(67, 97, 238, 0.1);
        }

        .filter-input {
            min-width: 240px;
        }

        .btn-search {
            padding: 10px 24px;
            background: linear-gradient(135deg, var(--primary), var(--primary-dark));
            color: white;
            border: none;
            border-radius: 8px;
            font-weight: 600;
            cursor: pointer;
            transition: var(--transition);
        }

        .btn-search:hover {
            transform: translateY(-2px);
            box-shadow: 0 8px 20px rgba(67, 97, 238, 0.3);
        }

        .cinemas-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(360px, 1fr));
            gap: 25px;
        }

        .cinema-card {
            background: white;
            border-radius: 16px;
            overflow: hidden;
            box-shadow: var(--card-shadow);
            transition: var(--transition);
            cursor: pointer;
        }

        .cinema-card:hover {
            transform: translateY(-6px);
            box-shadow: var(--hover-shadow);
        }

        .cinema-banner {
            height: 140px;
            background: linear-gradient(135deg, var(--primary), var(--secondary));
            position: relative;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .cinema-banner i {
            font-size: 56px;
            color: rgba(255, 255, 255, 0.25);
        }

        .cinema-badge {
            position: absolute;
            top: 15px;
            right: 15px;
            padding: 5px 12px;
            background: rgba(255, 255, 255, 0.95);
            border-radius: 20px;
            font-size: 12px;
            font-weight: 600;
            color: var(--primary);
        }

        .cinema-content {
            padding: 20px;
        }

        .cinema-name {
            font-size: 18px;
            font-weight: 700;
            margin-bottom: 12px;
            color: var(--dark);
        }

        .cinema-info {
            display: flex;
            flex-direction: column;
            gap: 8px;
            margin-bottom: 15px;
        }

        .info-item {
            display: flex;
            align-items: flex-start;
            gap: 8px;
            font-size: 13px;
            color: var(--gray);
            line-height: 1.5;
        }

        .info-item i {
            width: 16px;
            color: var(--primary);
            margin-top: 2px;
            flex-shrink: 0;
        }

        .cinema-tags {
            display: flex;
            gap: 6px;
            flex-wrap: wrap;
            margin-bottom: 15px;
        }

        .tag {
            padding: 4px 10px;
            background: linear-gradient(135deg, rgba(67, 97, 238, 0.1), rgba(114, 9, 183, 0.1));
            border-radius: 6px;
            font-size: 11px;
            color: var(--primary);
            font-weight: 500;
        }

        .cinema-footer {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding-top: 15px;
            border-top: 1px solid var(--light-gray);
        }

        .hall-count {
            font-size: 13px;
            color: var(--gray);
        }

        .hall-count strong {
            color: var(--primary);
            font-size: 18px;
            margin-right: 4px;
        }

        .btn-select {
            padding: 9px 20px;
            background: linear-gradient(135deg, var(--primary), var(--primary-dark));
            color: white;
            border: none;
            border-radius: 8px;
            font-weight: 600;
            cursor: pointer;
            transition: var(--transition);
            font-size: 13px;
        }

        .btn-select:hover {
            transform: translateY(-2px);
            box-shadow: 0 6px 15px rgba(67, 97, 238, 0.3);
        }

        .empty-state {
            text-align: center;
            padding: 80px 20px;
            background: white;
            border-radius: 16px;
            box-shadow: var(--card-shadow);
            grid-column: 1 / -1;
        }

        .empty-state i {
            font-size: 70px;
            color: var(--light-gray);
            margin-bottom: 20px;
        }

        .empty-state h3 {
            font-size: 22px;
            color: var(--dark);
            margin-bottom: 10px;
        }

        .empty-state p {
            color: var(--gray);
            margin-bottom: 25px;
        }

        .loading {
            text-align: center;
            padding: 60px;
            color: var(--gray);
            grid-column: 1 / -1;
        }

        .loading-spinner {
            width: 50px;
            height: 50px;
            border: 4px solid var(--light-gray);
            border-top-color: var(--primary);
            border-radius: 50%;
            animation: spin 1s linear infinite;
            margin: 0 auto 20px;
        }

        @keyframes spin {
            to { transform: rotate(360deg); }
        }

        @media (max-width: 768px) {
            .cinemas-grid {
                grid-template-columns: 1fr;
            }

            .filter-bar {
                flex-direction: column;
                align-items: stretch;
            }

            .filter-group {
                flex-direction: column;
                align-items: stretch;
            }

            .page-header h1 {
                font-size: 26px;
            }
        }
    </style>
</head>
<body>
    <header class="header">
        <div class="container header-container">
            <a href="index.html" class="logo">
                <i class="fas fa-film logo-icon"></i>
                <span class="logo-text">嘻囔电影</span>
            </a>

            <nav class="nav-menu">
                <a href="index.html" class="nav-item">
                    <i class="fas fa-film"></i> 电影
                </a>
                <a href="cinemas.html" class="nav-item active">
                    <i class="fas fa-building"></i> 影院
                </a>
                <a href="orders.html" class="nav-item">
                    <i class="fas fa-ticket-alt"></i> 订单
                </a>
                <a href="user.html" class="nav-item">
                    <i class="fas fa-user"></i> 我的
                </a>
            </nav>
        </div>
    </header>

    <main class="container main-content">
        <div class="page-header">
            <h1><i class="fas fa-building"></i> 影院列表</h1>
            <p id="cinemaCount">正在加载影院信息...</p>
        </div>

        <div class="filter-bar">
            <div class="filter-group">
                <label>城市：</label>
                <select class="filter-select" id="cityFilter">
                    <option value="">全部城市</option>
                </select>
            </div>

            <div class="filter-group">
                <label>搜索：</label>
                <input type="text" class="filter-input" id="searchInput" placeholder="输入影院名称或地址">
            </div>

            <button class="btn-search" onclick="filterCinemas()">
                <i class="fas fa-search"></i> 搜索
            </button>
        </div>

        <div id="cinemasContainer" class="cinemas-grid">
            <div class="loading">
                <div class="loading-spinner"></div>
                <p>加载中...</p>
            </div>
        </div>
    </main>

    <script>
        let allCinemas = [];

        document.addEventListener('DOMContentLoaded', function() {
            loadCinemas();
        });

        async function loadCinemas() {
            const container = document.getElementById('cinemasContainer');
            container.innerHTML = `
                <div class="loading">
                    <div class="loading-spinner"></div>
                    <p>加载影院列表中...</p>
                </div>
            `;

            try {
                const data = await mockGetCinemas();

                if (data.code === 200 && data.data && data.data.length > 0) {
                    allCinemas = data.data;
                    updateCityFilter(allCinemas);
                    displayCinemas(allCinemas);
                } else {
                    showEmptyState();
                }
            } catch (error) {
                console.error('加载影院失败:', error);
                // 使用内置mock数据
                allCinemas = MOCK_CINEMAS;
                updateCityFilter(allCinemas);
                displayCinemas(allCinemas);
            }
        }

        function updateCityFilter(cinemas) {
            const cityFilter = document.getElementById('cityFilter');
            const cities = [...new Set(cinemas.map(c => c.city).filter(Boolean))].sort();

            cityFilter.innerHTML = '<option value="">全部城市</option>';
            cities.forEach(city => {
                const option = document.createElement('option');
                option.value = city;
                option.textContent = city;
                cityFilter.appendChild(option);
            });
        }

        function displayCinemas(cinemas) {
            const container = document.getElementById('cinemasContainer');

            if (!cinemas || cinemas.length === 0) {
                showEmptyState();
                return;
            }

            const cityFilter = document.getElementById('cityFilter').value;
            const searchText = document.getElementById('searchInput').value.toLowerCase().trim();

            let filteredCinemas = cinemas;

            if (cityFilter) {
                filteredCinemas = filteredCinemas.filter(cinema =>
                    cinema.city === cityFilter
                );
            }

            if (searchText) {
                filteredCinemas = filteredCinemas.filter(cinema =>
                    (cinema.cinemaName && cinema.cinemaName.toLowerCase().includes(searchText)) ||
                    (cinema.address && cinema.address.toLowerCase().includes(searchText))
                );
            }

            if (filteredCinemas.length === 0) {
                container.innerHTML = `
                    <div class="empty-state">
                        <i class="fas fa-search"></i>
                        <h3>没有找到匹配的影院</h3>
                        <p>试试其他搜索条件吧</p>
                    </div>
                `;
                updateCinemaCount(0);
                return;
            }

            const cinemasHTML = filteredCinemas.map(cinema => createCinemaCard(cinema)).join('');
            container.innerHTML = cinemasHTML;
            updateCinemaCount(filteredCinemas.length);
        }

        function createCinemaCard(cinema) {
            const hallCount = cinema.hallCount || 8;
            const tags = cinema.tags || ['IMAX', '3D', '杜比音效'];
            const tagsHTML = tags.slice(0, 4).map(tag => `<span class="tag">${tag}</span>`).join('');

            // 根据影院ID设置不同的banner渐变
            const gradients = [
                'linear-gradient(135deg, #667eea 0%, #764ba2 100%)',
                'linear-gradient(135deg, #f093fb 0%, #f5576c 100%)',
                'linear-gradient(135deg, #4facfe 0%, #00f2fe 100%)',
                'linear-gradient(135deg, #43e97b 0%, #38f9d7 100%)',
                'linear-gradient(135deg, #fa709a 0%, #fee140 100%)',
                'linear-gradient(135deg, #30cfd0 0%, #330867 100%)',
                'linear-gradient(135deg, #a8edea 0%, #fed6e3 100%)',
                'linear-gradient(135deg, #ff9a9e 0%, #fecfef 100%)'
            ];
            const bannerStyle = `background: ${gradients[cinema.cinemaId % gradients.length]};`;

            return `
                <div class="cinema-card" onclick="selectCinema(${cinema.cinemaId})">
                    <div class="cinema-banner" style="${bannerStyle}">
                        <i class="fas fa-video"></i>
                        <div class="cinema-badge"><i class="fas fa-map-marker-alt"></i> ${cinema.city || '未知'}</div>
                    </div>

                    <div class="cinema-content">
                        <div class="cinema-name">${cinema.cinemaName || '未命名影院'}</div>

                        <div class="cinema-info">
                            <div class="info-item">
                                <i class="fas fa-map-marker-alt"></i>
                                <span>${cinema.address || '地址不详'}</span>
                            </div>
                            <div class="info-item">
                                <i class="fas fa-phone"></i>
                                <span>${cinema.contactPhone || '暂无电话'}</span>
                            </div>
                        </div>

                        <div class="cinema-tags">
                            ${tagsHTML}
                        </div>

                        <div class="cinema-footer">
                            <div class="hall-count">
                                <strong>${hallCount}</strong> 个影厅
                            </div>
                            <button class="btn-select" onclick="event.stopPropagation(); selectCinema(${cinema.cinemaId})">
                                <i class="fas fa-ticket-alt"></i> 选座购票
                            </button>
                        </div>
                    </div>
                </div>
            `;
        }

        function showEmptyState() {
            const container = document.getElementById('cinemasContainer');
            container.innerHTML = `
                <div class="empty-state">
                    <i class="fas fa-building"></i>
                    <h3>暂无影院</h3>
                    <p>当前没有可用的影院信息</p>
                </div>
            `;
            updateCinemaCount(0);
        }

        function updateCinemaCount(count) {
            const cinemaCount = document.getElementById('cinemaCount');
            cinemaCount.textContent = `共 ${count} 家影院，选一家就近观影吧！`;
        }

        function filterCinemas() {
            displayCinemas(allCinemas);
        }

        function selectCinema(cinemaId) {
            showCinemaMessage(`已选择影院，正在跳转...`, 'success');
            setTimeout(() => {
                window.location.href = `index.html?cinemaId=${cinemaId}`;
            }, 800);
        }

        function showCinemaMessage(message, type = 'info') {
            let msgEl = document.getElementById('cinema-msg-toast');
            if (!msgEl) {
                msgEl = document.createElement('div');
                msgEl.id = 'cinema-msg-toast';
                msgEl.style.cssText = `
                    position: fixed;
                    top: 80px;
                    right: 20px;
                    padding: 16px 24px;
                    border-radius: 12px;
                    color: white;
                    font-weight: 500;
                    z-index: 9999;
                    opacity: 0;
                    transform: translateX(100px);
                    transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
                    backdrop-filter: blur(10px);
                    box-shadow: 0 8px 30px rgba(0,0,0,0.2);
                    max-width: 400px;
                `;
                document.body.appendChild(msgEl);
            }

            const colors = {
                success: 'linear-gradient(135deg, #00b894, #00a885)',
                error: 'linear-gradient(135deg, #ff4757, #ff3838)',
                warning: 'linear-gradient(135deg, #fdcb6e, #f39c12)',
                info: 'linear-gradient(135deg, #4361ee, #3a56d4)'
            };

            msgEl.textContent = message;
            msgEl.style.background = colors[type] || colors.info;
            msgEl.style.opacity = '1';
            msgEl.style.transform = 'translateX(0)';

            setTimeout(() => {
                msgEl.style.opacity = '0';
                msgEl.style.transform = 'translateX(100px)';
            }, 3000);
        }

        // 监听筛选器变化
        document.getElementById('cityFilter').addEventListener('change', () => displayCinemas(allCinemas));
        document.getElementById('searchInput').addEventListener('input', () => displayCinemas(allCinemas));
    </script>
</body>
</html>
