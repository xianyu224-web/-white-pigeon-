<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>选座购票 - 电影票选座系统</title>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <script src="mock-data.js"></script>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    :root {
      --primary: #4361ee;
      --primary-dark: #3a56d4;
      --secondary: #7209b7;
      --accent: #f72585;
      --success: #4cc9f0;
      --danger: #f72585;
      --warning: #f8961e;
      --dark: #1a1a2e;
      --light: #f8f9fa;
      --gray: #6c757d;
      --light-gray: #e9ecef;
      --card-shadow: 0 8px 30px rgba(0, 0, 0, 0.08);
      --hover-shadow: 0 20px 40px rgba(0, 0, 0, 0.12);
      --transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
    }

    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', 'PingFang SC', 'Microsoft YaHei', sans-serif;
      background: linear-gradient(135deg, #f5f7fa 0%, #c3cfe2 100%);
      color: var(--dark);
      min-height: 100vh;
    }

    .container {
      max-width: 1400px;
      margin: 0 auto;
      padding: 0 20px;
    }

    .header {
      background: linear-gradient(135deg, var(--dark) 0%, #16213e 100%);
      color: white;
      padding: 15px 0;
      box-shadow: 0 4px 20px rgba(0,0,0,0.1);
      backdrop-filter: blur(10px);
    }

    .header-container {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 30px;
    }

    .logo {
      display: flex;
      align-items: center;
      gap: 12px;
      text-decoration: none;
      color: white;
      transition: var(--transition);
    }

    .logo:hover {
      transform: translateY(-2px);
    }

    .logo-icon {
      font-size: 32px;
      background: linear-gradient(135deg, var(--accent), var(--secondary));
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      background-clip: text;
    }

    .logo-text {
      font-size: 24px;
      font-weight: 700;
      background: linear-gradient(135deg, #fff, #c3cfe2);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      background-clip: text;
    }

    .back-btn {
      background: transparent;
      border: 2px solid rgba(255, 255, 255, 0.3);
      color: white;
      padding: 10px 20px;
      border-radius: 8px;
      font-size: 15px;
      font-weight: 500;
      cursor: pointer;
      transition: var(--transition);
      display: flex;
      align-items: center;
      gap: 8px;
    }

    .back-btn:hover {
      background: rgba(255, 255, 255, 0.1);
      border-color: rgba(255, 255, 255, 0.5);
      transform: translateY(-2px);
    }

    .main-content {
      padding: 40px 0 60px;
    }

    .seating-container {
      display: grid;
      grid-template-columns: 1fr 400px;
      gap: 40px;
    }

    .movie-info-card {
      background: white;
      padding: 30px;
      border-radius: 20px;
      box-shadow: var(--card-shadow);
      margin-bottom: 30px;
    }

    .movie-title {
      font-size: 28px;
      font-weight: 700;
      margin-bottom: 15px;
      color: var(--dark);
    }

    .movie-details {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
      gap: 20px;
      margin-top: 20px;
    }

    .detail-item {
      display: flex;
      flex-direction: column;
      gap: 5px;
    }

    .detail-label {
      font-size: 13px;
      color: var(--gray);
      font-weight: 500;
    }

    .detail-value {
      font-size: 16px;
      font-weight: 600;
      color: var(--dark);
    }

    .seating-section {
      background: white;
      padding: 30px;
      border-radius: 20px;
      box-shadow: var(--card-shadow);
      overflow-x: auto;
    }

    .seating-inner {
      min-width: fit-content;
      margin: 0 auto;
    }

    .screen {
      width: 80%;
      max-width: 500px;
      height: 20px;
      background: linear-gradient(135deg, #6c757d, #495057);
      border-radius: 10px;
      margin: 0 auto 40px;
      position: relative;
      box-shadow: 0 5px 15px rgba(0,0,0,0.2);
    }

    .screen-label {
      position: absolute;
      top: 50%;
      left: 50%;
      transform: translate(-50%, -50%);
      color: white;
      font-size: 12px;
      font-weight: 600;
    }

    .seating-grid {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 8px;
      margin-bottom: 40px;
    }

    .row {
      display: flex;
      align-items: center;
      gap: 6px;
    }

    .row-label {
      width: 28px;
      text-align: center;
      font-weight: 600;
      color: var(--dark);
      font-size: 13px;
      flex-shrink: 0;
    }

    .seat {
      width: 32px;
      height: 32px;
      border-radius: 6px 6px 3px 3px;
      cursor: pointer;
      transition: var(--transition);
      display: flex;
      align-items: center;
      justify-content: center;
      font-weight: 600;
      font-size: 10px;
      color: white;
      position: relative;
      flex-shrink: 0;
    }

    .seat:hover:not(.selected):not(.sold):not(.vip) {
      transform: scale(1.1);
    }

    .seat.available {
      background: linear-gradient(135deg, var(--primary), var(--primary-dark));
    }

    .seat.selected {
      background: linear-gradient(135deg, var(--success), #00a8e8);
      transform: scale(1.1);
      box-shadow: 0 4px 12px rgba(76, 201, 240, 0.5);
    }

    .seat.sold {
      background: linear-gradient(135deg, #adb5bd, #6c757d);
      cursor: not-allowed;
    }

    .seat.locked {
      background: linear-gradient(135deg, #ff9800, #f57c00);
      cursor: not-allowed;
    }

    .seat.vip {
      background: linear-gradient(135deg, var(--accent), var(--danger));
    }

    .seat-label {
      display: none;
      position: absolute;
      bottom: -28px;
      left: 50%;
      transform: translateX(-50%);
      background: var(--dark);
      color: white;
      padding: 4px 10px;
      border-radius: 4px;
      font-size: 11px;
      white-space: nowrap;
      z-index: 10;
    }

    .seat:hover .seat-label {
      display: block;
    }

    .seating-legend {
      display: flex;
      justify-content: center;
      gap: 20px;
      flex-wrap: wrap;
      margin-bottom: 10px;
    }

    .legend-item {
      display: flex;
      align-items: center;
      gap: 8px;
    }

    .legend-color {
      width: 20px;
      height: 20px;
      border-radius: 4px;
    }

    .legend-text {
      font-size: 13px;
      color: var(--gray);
    }

    .order-summary {
      background: white;
      padding: 30px;
      border-radius: 20px;
      box-shadow: var(--card-shadow);
      position: sticky;
      top: 80px;
    }

    .order-title {
      font-size: 20px;
      font-weight: 700;
      margin-bottom: 20px;
      color: var(--dark);
    }

    .order-details {
      margin-bottom: 25px;
    }

    .order-row {
      display: flex;
      justify-content: space-between;
      margin-bottom: 12px;
      padding-bottom: 12px;
      border-bottom: 1px solid var(--light-gray);
    }

    .order-label {
      color: var(--gray);
      font-size: 14px;
    }

    .order-value {
      font-weight: 600;
      color: var(--dark);
      font-size: 14px;
    }

    .order-total {
      display: flex;
      justify-content: space-between;
      font-size: 22px;
      font-weight: 700;
      color: var(--accent);
      margin-bottom: 25px;
      padding-top: 15px;
      border-top: 2px solid var(--light-gray);
    }

    .seats-selected {
      display: flex;
      flex-wrap: wrap;
      gap: 8px;
      margin-bottom: 20px;
      min-height: 30px;
    }

    .seat-tag {
      background: linear-gradient(135deg, var(--primary), var(--primary-dark));
      color: white;
      padding: 5px 12px;
      border-radius: 20px;
      font-size: 12px;
      font-weight: 600;
    }

    .seat-tag.vip {
      background: linear-gradient(135deg, var(--accent), var(--danger));
    }

    .btn-confirm {
      width: 100%;
      padding: 15px;
      background: linear-gradient(135deg, var(--accent), var(--danger));
      color: white;
      border: none;
      border-radius: 10px;
      font-size: 16px;
      font-weight: 700;
      cursor: pointer;
      transition: var(--transition);
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 10px;
    }

    .btn-confirm:hover:not(:disabled) {
      transform: translateY(-3px);
      box-shadow: 0 8px 20px rgba(242, 5, 133, 0.3);
    }

    .btn-confirm:disabled {
      opacity: 0.5;
      cursor: not-allowed;
    }

    .loading {
      text-align: center;
      padding: 60px 20px;
      color: var(--gray);
    }

    .loading-spinner {
      width: 50px;
      height: 50px;
      border: 4px solid #f3f3f3;
      border-top: 4px solid var(--primary);
      border-radius: 50%;
      animation: spin 1s linear infinite;
      margin: 0 auto 20px;
    }

    @keyframes spin {
      0% { transform: rotate(0deg); }
      100% { transform: rotate(360deg); }
    }

    .hall-info {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 25px;
      flex-wrap: wrap;
      gap: 15px;
    }

    .hall-selector {
      display: flex;
      align-items: center;
      gap: 10px;
    }

    .hall-select {
      padding: 8px 15px;
      border: 2px solid var(--light-gray);
      border-radius: 8px;
      font-size: 14px;
      cursor: pointer;
      background: white;
    }

    .hall-select:focus {
      outline: none;
      border-color: var(--primary);
    }

    .time-slot {
      padding: 6px 14px;
      border: 2px solid var(--light-gray);
      border-radius: 8px;
      font-size: 13px;
      font-weight: 600;
      cursor: pointer;
      transition: var(--transition);
    }

    .time-slot:hover {
      border-color: var(--primary);
    }

    .time-slot.selected {
      background: linear-gradient(135deg, var(--primary), var(--primary-dark));
      color: white;
      border-color: var(--primary);
    }

    .time-slots {
      display: flex;
      gap: 10px;
      flex-wrap: wrap;
    }

    .seat-number {
      font-size: 10px;
    }

    @media (max-width: 1200px) {
      .seat {
        width: 28px;
        height: 28px;
        font-size: 9px;
      }
      .row { gap: 5px; }
      .row-label { width: 24px; font-size: 12px; }
    }

    @media (max-width: 992px) {
      .seating-container {
        grid-template-columns: 1fr;
      }

      .order-summary {
        position: static;
      }

      .seat {
        width: 30px;
        height: 30px;
      }
    }

    @media (max-width: 768px) {
      .seating-section {
        padding: 20px 15px;
      }

      .seat {
        width: 24px;
        height: 24px;
        font-size: 9px;
        border-radius: 4px 4px 2px 2px;
      }

      .row {
        gap: 4px;
      }

      .row-label {
        width: 20px;
        font-size: 11px;
      }

      .seat-number {
        font-size: 8px;
      }

      .hall-info {
        flex-direction: column;
        align-items: flex-start;
      }

      .screen {
        width: 90%;
        margin-bottom: 30px;
      }

      .seating-grid {
        gap: 6px;
        margin-bottom: 30px;
      }
    }

    @media (max-width: 480px) {
      .seat {
        width: 20px;
        height: 20px;
        font-size: 8px;
      }

      .row {
        gap: 3px;
      }

      .row-label {
        width: 18px;
        font-size: 10px;
      }

      .seat-number {
        font-size: 7px;
      }
    }
  </style>
</head>
<body>
<header class="header">
  <div class="container header-container">
    <a href="index.html" class="logo">
      <i class="fas fa-film logo-icon"></i>
      <span class="logo-text">嘻囔电影</span>
    </a>

    <button class="back-btn" onclick="goBack()">
      <i class="fas fa-arrow-left"></i> 返回电影列表
    </button>
  </div>
</header>

<main class="container main-content">
  <div id="loading" class="loading">
    <div class="loading-spinner"></div>
    <p id="loadingText">正在加载选座信息...</p>
  </div>

  <div id="seatingContent" style="display: none;">
    <div class="movie-info-card">
      <h1 class="movie-title" id="movieTitle">加载中...</h1>
      <div class="movie-details">
        <div class="detail-item">
          <span class="detail-label">场次</span>
          <span class="detail-value" id="movieTime">--:--</span>
        </div>
        <div class="detail-item">
          <span class="detail-label">影厅</span>
          <span class="detail-value" id="hallName">加载中...</span>
        </div>
        <div class="detail-item">
          <span class="detail-label">票价</span>
          <span class="detail-value" id="ticketPrice">¥ --.--</span>
        </div>
        <div class="detail-item">
          <span class="detail-label">已选座位</span>
          <span class="detail-value" id="selectedCount">0 个</span>
        </div>
      </div>
    </div>

    <div class="seating-container">
      <div class="seating-section">
        <div class="hall-info">
          <div class="hall-selector">
            <span style="font-weight: 600; color: var(--dark);">影厅:</span>
            <select class="hall-select" id="hallSelect">
            </select>
          </div>
          <div class="time-slots" id="timeSlots">
          </div>
        </div>

        <div class="seating-inner">
        <div class="screen">
          <span class="screen-label">影 幕 方 向</span>
        </div>

        <div class="seating-grid" id="seatingGrid">
        </div>

        <div class="seating-legend">
          <div class="legend-item">
            <div class="legend-color" style="background: linear-gradient(135deg, var(--primary), var(--primary-dark));"></div>
            <span class="legend-text">普通座可选</span>
          </div>
          <div class="legend-item">
            <div class="legend-color" style="background: linear-gradient(135deg, var(--accent), var(--danger));"></div>
            <span class="legend-text">VIP座可选</span>
          </div>
          <div class="legend-item">
            <div class="legend-color" style="background: linear-gradient(135deg, var(--success), #00a8e8);"></div>
            <span class="legend-text">已选座</span>
          </div>
          <div class="legend-item">
            <div class="legend-color" style="background: linear-gradient(135deg, #ff9800, #f57c00);"></div>
            <span class="legend-text">已锁定</span>
          </div>
          <div class="legend-item">
            <div class="legend-color" style="background: linear-gradient(135deg, #adb5bd, #6c757d);"></div>
            <span class="legend-text">已售出</span>
          </div>
        </div>
        </div>
      </div>

      <div class="order-summary">
        <h3 class="order-title"><i class="fas fa-receipt"></i> 订单信息</h3>

        <div class="order-details">
          <div class="order-row">
            <span class="order-label">电影名称</span>
            <span class="order-value" id="orderMovieTitle">--</span>
          </div>
          <div class="order-row">
            <span class="order-label">场次时间</span>
            <span class="order-value" id="orderTime">--:--</span>
          </div>
          <div class="order-row">
            <span class="order-label">影厅</span>
            <span class="order-value" id="orderHall">--</span>
          </div>
          <div class="order-row">
            <span class="order-label">座位类型</span>
            <span class="order-value" id="orderSeatType">请选座</span>
          </div>
        </div>

        <div style="font-size: 13px; color: var(--gray); margin-bottom: 8px;">已选座位：</div>
        <div class="seats-selected" id="seatsSelected">
          <span style="color: var(--gray); font-size: 13px;">请在座位图中选择座位</span>
        </div>

        <div class="order-total">
          <span>总计:</span>
          <span id="totalPrice">¥ 0.00</span>
        </div>

        <button class="btn-confirm" id="confirmBtn" disabled onclick="confirmOrder()">
          <i class="fas fa-credit-card"></i> <span id="confirmBtnText">请先选座</span>
        </button>
      </div>
    </div>
  </div>
</main>

<div id="message" class="message"></div>

<script>
  let selectedMovie = null;
  let selectedSeats = new Set();
  let ticketPrice = 0;
  let halls = [];
  let currentHallId = 0;
  let currentShowTime = '19:30';
  let seatData = [];

  // ==================== 基础工具函数 ====================

  function showLoading(message) {
    const loadingEl = document.getElementById('loading');
    const seatingContent = document.getElementById('seatingContent');
    loadingEl.style.display = 'block';
    seatingContent.style.display = 'none';
    if (message) {
      document.getElementById('loadingText').textContent = message;
    }
  }

  function hideLoading() {
    const loadingEl = document.getElementById('loading');
    const seatingContent = document.getElementById('seatingContent');
    loadingEl.style.display = 'none';
    seatingContent.style.display = 'block';
  }

  function showSeatingMessage(message, type = 'info') {
    const messageEl = document.getElementById('message');
    messageEl.textContent = message;
    messageEl.className = `message ${type}`;
    messageEl.classList.add('show');

    setTimeout(() => {
      messageEl.classList.remove('show');
    }, 3000);
  }

  // ==================== 页面初始化 ====================

  document.addEventListener('DOMContentLoaded', function() {
    loadMovieInfo();
    loadHalls();

    document.getElementById('hallSelect').addEventListener('change', function() {
      selectedSeats.clear();
      loadSeatingChart();
    });

    generateTimeSlots();
  });

  function goBack() {
    if (selectedSeats.size > 0) {
      if (confirm('您有未确认的座位，确定要返回吗？')) {
        window.location.href = 'index.html';
      }
    } else {
      window.location.href = 'index.html';
    }
  }

  // ==================== 电影信息处理 ====================

  function loadMovieInfo() {
    try {
      const movieInfo = sessionStorage.getItem(STORAGE_KEYS.SELECTED_MOVIE);
      if (!movieInfo) {
        showSeatingMessage('未选择电影，请返回选择电影', 'error');
        setTimeout(() => window.location.href = 'index.html', 2000);
        return;
      }

      selectedMovie = JSON.parse(movieInfo);
      ticketPrice = selectedMovie.price || 45.00;

      document.getElementById('movieTitle').textContent = selectedMovie.title;
      document.getElementById('ticketPrice').textContent = `¥ ${ticketPrice.toFixed(2)}`;
      document.getElementById('orderMovieTitle').textContent = selectedMovie.title;
      document.getElementById('orderTime').textContent = currentShowTime;
      document.getElementById('totalPrice').textContent = `¥ 0.00`;

      updateShowTime(currentShowTime);
    } catch (error) {
      console.error('加载电影信息失败:', error);
      showSeatingMessage('加载电影信息失败，请重试', 'error');
    }
  }

  // ==================== 影厅处理 ====================

  async function loadHalls() {
    try {
      showLoading('正在加载影厅列表...');

      // 使用mock数据，默认影院ID为6
      const data = await mockGetHalls(6);
      if (data.code === 200 && data.data) {
        halls = data.data;
      } else {
        throw new Error('获取影厅失败');
      }

      populateHallSelect();
    } catch (error) {
      console.error('加载影厅列表失败:', error);
      showSeatingMessage('加载影厅列表失败', 'error');

      halls = [
        { hall_id: 601, hall_name: '1号激光厅', hall_type: '2D', total_rows: 12, seats_per_row: 15 },
        { hall_id: 602, hall_name: '2号IMAX巨幕厅', hall_type: 'IMAX', total_rows: 15, seats_per_row: 20 },
        { hall_id: 603, hall_name: '3号VIP厅', hall_type: 'VIP', total_rows: 8, seats_per_row: 10 }
      ];
      populateHallSelect();
    }
  }

  function populateHallSelect() {
    const hallSelect = document.getElementById('hallSelect');
    hallSelect.innerHTML = '';

    if (halls.length === 0) {
      const option = document.createElement('option');
      option.value = "";
      option.textContent = "无可用影厅";
      hallSelect.appendChild(option);
      return;
    }

    halls.forEach(hall => {
      const option = document.createElement('option');
      const hallId = hall.hall_id || hall.id;
      const hallName = hall.hall_name || hall.name;
      const hallType = hall.hall_type || hall.type || '2D';
      const totalSeats = (hall.total_rows || 10) * (hall.seats_per_row || 12);

      option.value = hallId;
      option.textContent = `${hallName} (${hallType}, ${totalSeats}座)`;
      hallSelect.appendChild(option);
    });

    if (halls.length > 0) {
      const firstHall = halls[0];
      currentHallId = firstHall.hall_id || firstHall.id;
      const hallName = firstHall.hall_name || firstHall.name || '默认影厅';
      document.getElementById('hallName').textContent = hallName;
      document.getElementById('orderHall').textContent = hallName;

      setTimeout(() => {
        loadSeatingChart();
      }, 200);
    }
  }

  // ==================== 座位图处理 ====================

  async function loadSeatingChart() {
    const hallSelect = document.getElementById('hallSelect');
    const selectedHallId = hallSelect.value;

    if (!selectedHallId) {
      showSeatingMessage('请先选择影厅', 'warning');
      return;
    }

    const selectedHall = halls.find(h => (h.hall_id || h.id) == selectedHallId);
    if (!selectedHall) {
      showSeatingMessage('影厅不存在', 'error');
      return;
    }

    currentHallId = selectedHall.hall_id || selectedHall.id;
    const hallName = selectedHall.hall_name || selectedHall.name || '默认影厅';
    document.getElementById('hallName').textContent = hallName;
    document.getElementById('orderHall').textContent = hallName;

    showLoading('正在加载座位信息...');

    try {
      const data = await mockGetSeats(currentHallId);

      if (data.code === 200 && data.data) {
        seatData = data.data;
        generateSeatingChart(seatData);
        hideLoading();
      } else {
        throw new Error('获取座位失败');
      }
    } catch (error) {
      console.error('加载座位图失败:', error);
      showSeatingMessage('加载座位信息失败', 'error');
      generateMockSeatsFallback();
      hideLoading();
    }
  }

  function generateSeatingChart(seats) {
    const seatingGrid = document.getElementById('seatingGrid');
    seatingGrid.innerHTML = '';

    if (!seats || seats.length === 0) {
      seatingGrid.innerHTML = '<div style="text-align: center; color: var(--gray); padding: 40px;">暂无座位信息</div>';
      return;
    }

    // 按行分组
    const rows = {};
    seats.forEach(seat => {
      const rowNum = seat.row_num || seat.rowNum || seat.row;
      if (!rows[rowNum]) {
        rows[rowNum] = [];
      }
      rows[rowNum].push(seat);
    });

    const sortedRows = Object.keys(rows).sort((a, b) => {
      if (a.match(/^[A-Z]+$/i) && b.match(/^[A-Z]+$/i)) {
        return a.localeCompare(b);
      }
      return isNaN(a) || isNaN(b) ? a.localeCompare(b) : a - b;
    });

    sortedRows.forEach(rowNum => {
      const rowSeats = rows[rowNum].sort((a, b) =>
        (a.col_num || a.colNum || a.col) - (b.col_num || b.colNum || b.col)
      );
      const rowEl = document.createElement('div');
      rowEl.className = 'row';

      const rowLabel = document.createElement('div');
      rowLabel.className = 'row-label';
      rowLabel.textContent = rowNum;
      rowEl.appendChild(rowLabel);

      rowSeats.forEach(seat => {
        const seatEl = document.createElement('div');
        seatEl.className = 'seat';
        const seatId = (seat.seat_id || seat.seatId || seat.id).toString();
        let seatStatus = seat.seat_status || seat.seatStatus || seat.status;
        const seatType = seat.seat_type || seat.seatType || seat.type || 'standard';
        const colNum = seat.col_num || seat.colNum || seat.col;
        const isLocked = seat.is_locked || seat.isLocked || false;

        seatEl.dataset.seatId = seatId;
        seatEl.dataset.rowNum = rowNum;
        seatEl.dataset.colNum = colNum;
        seatEl.dataset.seatType = seatType;
        seatEl.dataset.status = seatStatus;
        seatEl.dataset.locked = isLocked;

        // 设置座位状态样式
        if (seatStatus === 'sold' || seatStatus === 'occupied') {
          seatEl.classList.add('sold');
          seatEl.title = `${rowNum}排${colNum}座 - 已售出`;
        } else if (isLocked && !selectedSeats.has(seatId)) {
          seatEl.classList.add('locked');
          seatEl.title = `${rowNum}排${colNum}座 - 已被锁定`;
        } else if (seatType === 'vip' || seatType === 'VIP') {
          seatEl.classList.add('vip');
          seatEl.title = `${rowNum}排${colNum}座 - VIP座`;
        } else {
          seatEl.classList.add('available');
          seatEl.title = `${rowNum}排${colNum}座 - 可选`;
        }

        if (selectedSeats.has(seatId)) {
          seatEl.classList.add('selected');
        }

        seatEl.innerHTML = `<span class="seat-number">${colNum}</span>`;

        const seatLabel = document.createElement('div');
        seatLabel.className = 'seat-label';
        let labelText = `${rowNum}排${colNum}座 ${(seatType === 'vip' || seatType === 'VIP') ? 'VIP' : '普通'}`;
        if (seatStatus === 'sold' || seatStatus === 'occupied') {
          labelText += ' (已售)';
        } else if (isLocked && !selectedSeats.has(seatId)) {
          labelText += ' (锁定中)';
        }
        seatLabel.textContent = labelText;
        seatEl.appendChild(seatLabel);

        if (seatStatus === 'sold' || seatStatus === 'occupied' || (isLocked && !selectedSeats.has(seatId))) {
          seatEl.style.cursor = 'not-allowed';
        } else {
          seatEl.addEventListener('click', () => toggleSeat(seatId, rowNum, colNum, seatType, seatEl));
        }

        rowEl.appendChild(seatEl);
      });

      seatingGrid.appendChild(rowEl);
    });

    updateOrderSummary();
  }

  function generateMockSeatsFallback() {
    const seatingGrid = document.getElementById('seatingGrid');
    seatingGrid.innerHTML = '';

    const rows = ['A', 'B', 'C', 'D', 'E', 'F', 'G', 'H', 'I', 'J'];
    const cols = 12;
    seatData = [];

    rows.forEach(row => {
      const rowEl = document.createElement('div');
      rowEl.className = 'row';

      const rowLabel = document.createElement('div');
      rowLabel.className = 'row-label';
      rowLabel.textContent = row;
      rowEl.appendChild(rowLabel);

      for (let col = 1; col <= cols; col++) {
        const seatEl = document.createElement('div');
        seatEl.className = 'seat';
        const seatId = `${currentHallId}-${row}-${col}`;
        const seatType = row > 'E' ? 'vip' : 'standard';
        const isSold = Math.random() < 0.2;

        seatData.push({
          seat_id: seatId,
          rowNum: row,
          colNum: col,
          seatType: seatType,
          seatStatus: isSold ? 'sold' : 'available',
          isLocked: false
        });

        seatEl.dataset.seatId = seatId;
        seatEl.dataset.rowNum = row;
        seatEl.dataset.colNum = col;
        seatEl.dataset.seatType = seatType;

        if (isSold) {
          seatEl.classList.add('sold');
        } else if (seatType === 'vip') {
          seatEl.classList.add('vip');
        } else {
          seatEl.classList.add('available');
        }

        if (selectedSeats.has(seatId)) {
          seatEl.classList.add('selected');
        }

        seatEl.innerHTML = `<span class="seat-number">${col}</span>`;

        const seatLabel = document.createElement('div');
        seatLabel.className = 'seat-label';
        seatLabel.textContent = `${row}排${col}座 ${seatType === 'vip' ? 'VIP' : '普通'}`;
        seatEl.appendChild(seatLabel);

        if (!isSold) {
          seatEl.addEventListener('click', () => toggleSeat(seatId, row, col, seatType, seatEl));
        } else {
          seatEl.style.cursor = 'not-allowed';
        }

        rowEl.appendChild(seatEl);
      }
      seatingGrid.appendChild(rowEl);
    });
  }

  // ==================== 座位选择处理 ====================

  async function toggleSeat(seatId, rowNum, colNum, seatType, seatEl) {
    if (selectedSeats.has(seatId)) {
      // 取消选择
      selectedSeats.delete(seatId);
      seatEl.classList.remove('selected');

      // 释放锁定
      await mockUnlockSeat(seatId, currentHallId);
      showSeatingMessage(`已取消 ${rowNum}排${colNum}座`, 'info');
    } else {
      // 检查数量限制
      if (selectedSeats.size >= 6) {
        showSeatingMessage('最多只能选择6个座位', 'warning');
        return;
      }

      // 锁定座位
      const currentUser = getCurrentUser();
      const userId = currentUser ? (currentUser.userId || 'demo') : 'anonymous';

      const result = await mockLockSeat(seatId, currentHallId, userId);
      if (result.code === 200) {
        selectedSeats.add(seatId);
        seatEl.classList.add('selected');
        showSeatingMessage(`已选择 ${rowNum}排${colNum}座`, 'success');
      } else {
        showSeatingMessage(result.message || '座位已被锁定', 'warning');
        // 刷新座位状态
        seatEl.classList.remove('available', 'vip');
        seatEl.classList.add('locked');
        seatEl.style.cursor = 'not-allowed';
        const newEl = seatEl.cloneNode(true);
        seatEl.parentNode.replaceChild(newEl, seatEl);
      }
    }

    updateOrderSummary();
  }

  // ==================== 场次时间处理 ====================

  function updateShowTime(time) {
    currentShowTime = time;
    document.getElementById('movieTime').textContent = time;
    document.getElementById('orderTime').textContent = time;

    const timeSlots = document.querySelectorAll('.time-slot');
    timeSlots.forEach(slot => {
      if (slot.textContent === time) {
        slot.classList.add('selected');
      } else {
        slot.classList.remove('selected');
      }
    });

    // 切换场次时清空已选座位
    if (selectedSeats.size > 0) {
      selectedSeats.forEach(seatId => {
        mockUnlockSeat(seatId, currentHallId);
      });
      selectedSeats.clear();
      loadSeatingChart();
    }
  }

  function generateTimeSlots() {
    const timeSlotsEl = document.getElementById('timeSlots');
    const timeSlots = MOCK_SHOWTIMES;
    timeSlotsEl.innerHTML = '';

    timeSlots.forEach(time => {
      const timeSlot = document.createElement('div');
      timeSlot.className = `time-slot ${time === currentShowTime ? 'selected' : ''}`;
      timeSlot.textContent = time;
      timeSlot.onclick = () => updateShowTime(time);
      timeSlotsEl.appendChild(timeSlot);
    });
  }

  // ==================== 订单摘要更新 ====================

  function updateOrderSummary() {
    const selectedCount = selectedSeats.size;

    document.getElementById('selectedCount').textContent = `${selectedCount} 个`;

    const seatsSelected = document.getElementById('seatsSelected');
    seatsSelected.innerHTML = '';

    if (selectedCount === 0) {
      seatsSelected.innerHTML = '<span style="color: var(--gray); font-size: 13px;">请在座位图中选择座位</span>';
    } else {
      selectedSeats.forEach(seatId => {
        const seatTag = document.createElement('span');
        const seat = seatData.find(s => (s.seat_id || s.seatId).toString() === seatId);
        const isVIP = seat && (seat.seat_type === 'vip' || seat.seatType === 'vip' || seat.seatType === 'VIP');
        seatTag.className = `seat-tag ${isVIP ? 'vip' : ''}`;
        seatTag.textContent = getSeatDisplayName(seatId);
        seatsSelected.appendChild(seatTag);
      });
    }

    const totalPrice = selectedCount * ticketPrice;
    document.getElementById('totalPrice').textContent = `¥ ${totalPrice.toFixed(2)}`;

    const confirmBtn = document.getElementById('confirmBtn');
    const confirmBtnText = document.getElementById('confirmBtnText');
    confirmBtn.disabled = selectedCount === 0;

    if (selectedCount > 0) {
      confirmBtnText.textContent = `支付 ¥ ${totalPrice.toFixed(2)}`;
    } else {
      confirmBtnText.textContent = '请先选座';
    }

    if (selectedCount > 0) {
      const seatTypes = Array.from(selectedSeats).map(seatId => {
        const seat = seatData.find(s => (s.seat_id || s.seatId).toString() === seatId);
        return seat ? (seat.seat_type || seat.seatType) : 'standard';
      });
      const hasVIP = seatTypes.includes('vip') || seatTypes.includes('VIP');
      document.getElementById('orderSeatType').textContent = hasVIP ? '含VIP座' : '普通座';
    } else {
      document.getElementById('orderSeatType').textContent = '请选座';
    }
  }

  function getSeatDisplayName(seatId) {
    const seat = seatData.find(s => (s.seat_id || s.seatId).toString() === seatId);
    if (seat) {
      const rowNum = seat.row_num || seat.rowNum || seat.row;
      const colNum = seat.col_num || seat.colNum || seat.col;
      return `${rowNum}排${colNum}座`;
    }

    if (seatId.includes('-')) {
      const parts = seatId.split('-');
      if (parts.length >= 3) {
        const row = parts[parts.length - 2];
        const col = parts[parts.length - 1];
        return `${row}排${col}座`;
      }
    }

    return seatId;
  }

  // ==================== 订单确认 ====================

  async function confirmOrder() {
    if (selectedSeats.size === 0) {
      showSeatingMessage('请先选择座位', 'warning');
      return;
    }

    const currentUser = getCurrentUser();
    if (!currentUser) {
      showSeatingMessage('请先登录再进行购票', 'warning');
      setTimeout(() => {
        window.location.href = 'index.html';
      }, 1500);
      return;
    }

    const userId = currentUser.userId || 1;

    const orderInfo = {
      movie: selectedMovie,
      movieId: selectedMovie.id,
      movieTitle: selectedMovie.title,
      hallId: currentHallId,
      hallName: document.getElementById('hallName').textContent,
      showTime: currentShowTime,
      seats: Array.from(selectedSeats).map(seatId => {
        const seat = seatData.find(s => (s.seat_id || s.seatId).toString() === seatId);
        if (seat) {
          return {
            seatId: seat.seat_id || seat.seatId,
            rowNum: seat.row_num || seat.rowNum,
            colNum: seat.col_num || seat.colNum,
            seatType: seat.seat_type || seat.seatType
          };
        }
        if (seatId.includes('-')) {
          const parts = seatId.split('-');
          if (parts.length >= 3) {
            return {
              seatId: seatId,
              rowNum: parts[parts.length - 2],
              colNum: parseInt(parts[parts.length - 1]),
              seatType: 'standard'
            };
          }
        }
        return { seatId: seatId };
      }),
      ticketPrice: ticketPrice,
      totalPrice: selectedSeats.size * ticketPrice,
      userId: userId,
      userName: currentUser.username || currentUser.fullName || '用户'
    };

    sessionStorage.setItem(STORAGE_KEYS.ORDER_INFO, JSON.stringify(orderInfo));

    showSeatingMessage('正在跳转到支付页面...', 'success');
    setTimeout(() => {
      window.location.href = 'payment.html';
    }, 800);
  }

  // 页面卸载前释放座位
  window.addEventListener('beforeunload', function () {
    selectedSeats.forEach(seatId => {
      mockUnlockSeat(seatId, currentHallId);
    });
  });
</script>
