<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>个人中心 - 影院购票系统</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <script src="mock-data.js"></script>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        :root {
            --primary: #4361ee;
            --primary-dark: #3a56d4;
            --secondary: #7209b7;
            --accent: #f72585;
            --success: #2ed573;
            --danger: #ff4757;
            --warning: #ffa502;
            --dark: #1a1a2e;
            --light: #f8f9fa;
            --gray: #6c757d;
            --light-gray: #e9ecef;
            --card-shadow: 0 8px 30px rgba(0, 0, 0, 0.08);
            --hover-shadow: 0 20px 40px rgba(0, 0, 0, 0.12);
            --transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', 'PingFang SC', 'Microsoft YaHei', sans-serif;
            background: linear-gradient(135deg, #f5f7fa 0%, #c3cfe2 100%);
            color: var(--dark);
            min-height: 100vh;
        }

        .container {
            max-width: 1100px;
            margin: 0 auto;
            padding: 0 20px;
        }

        .header {
            background: linear-gradient(135deg, var(--dark) 0%, #16213e 100%);
            color: white;
            padding: 15px 0;
            box-shadow: 0 4px 20px rgba(0,0,0,0.1);
            position: sticky;
            top: 0;
            z-index: 1000;
        }

        .header-container {
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 30px;
        }

        .logo {
            display: flex;
            align-items: center;
            gap: 12px;
            text-decoration: none;
            color: white;
            transition: var(--transition);
        }

        .logo:hover {
            transform: translateY(-2px);
        }

        .logo-icon {
            font-size: 32px;
            background: linear-gradient(135deg, var(--accent), var(--secondary));
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
        }

        .logo-text {
            font-size: 24px;
            font-weight: 700;
            background: linear-gradient(135deg, #fff, #c3cfe2);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
        }

        .nav-menu {
            display: flex;
            gap: 20px;
        }

        .nav-item {
            color: rgba(255, 255, 255, 0.85);
            text-decoration: none;
            font-size: 15px;
            font-weight: 500;
            padding: 10px 16px;
            border-radius: 8px;
            transition: var(--transition);
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .nav-item:hover {
            color: white;
            background: rgba(255, 255, 255, 0.1);
            transform: translateY(-2px);
        }

        .nav-item.active {
            color: white;
            background: rgba(255, 255, 255, 0.15);
        }

        .main-content {
            padding: 40px 0 60px;
        }

        /* 用户信息卡片 */
        .profile-header {
            background: white;
            border-radius: 20px;
            padding: 35px;
            box-shadow: var(--card-shadow);
            margin-bottom: 30px;
            display: flex;
            gap: 30px;
            align-items: center;
            position: relative;
            overflow: hidden;
        }

        .profile-header::before {
            content: '';
            position: absolute;
            top: 0;
            left: 0;
            right: 0;
            height: 6px;
            background: linear-gradient(90deg, var(--primary), var(--secondary), var(--accent));
        }

        .avatar-section {
            position: relative;
            flex-shrink: 0;
        }

        .user-avatar-large {
            width: 110px;
            height: 110px;
            background: linear-gradient(135deg, var(--primary), var(--secondary));
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            color: white;
            font-size: 44px;
            font-weight: 700;
            box-shadow: 0 8px 25px rgba(67, 97, 238, 0.35);
        }

        .avatar-badge {
            position: absolute;
            bottom: 5px;
            right: 5px;
            width: 28px;
            height: 28px;
            background: var(--success);
            border: 3px solid white;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            color: white;
            font-size: 11px;
        }

        .user-info-section {
            flex: 1;
        }

        .user-name-large {
            font-size: 26px;
            font-weight: 700;
            margin-bottom: 8px;
            color: var(--dark);
        }

        .user-meta {
            display: flex;
            gap: 20px;
            color: var(--gray);
            font-size: 14px;
            margin-bottom: 18px;
            flex-wrap: wrap;
        }

        .user-meta-item {
            display: flex;
            align-items: center;
            gap: 6px;
        }

        .user-meta-item i {
            color: var(--primary);
        }

        .user-stats {
            display: flex;
            gap: 35px;
        }

        .stat-item {
            text-align: center;
            padding: 15px 25px;
            background: linear-gradient(135deg, rgba(67, 97, 238, 0.06), rgba(114, 9, 183, 0.06));
            border-radius: 12px;
        }

        .stat-value {
            font-size: 24px;
            font-weight: 700;
            color: var(--primary);
        }

        .stat-label {
            font-size: 13px;
            color: var(--gray);
            margin-top: 4px;
        }

        .logout-btn-section {
            flex-shrink: 0;
        }

        .btn-logout {
            padding: 10px 22px;
            border: 2px solid var(--danger);
            background: transparent;
            color: var(--danger);
            border-radius: 8px;
            font-size: 14px;
            font-weight: 600;
            cursor: pointer;
            transition: var(--transition);
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .btn-logout:hover {
            background: var(--danger);
            color: white;
            transform: translateY(-2px);
        }

        /* 功能菜单网格 */
        .menu-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(240px, 1fr));
            gap: 20px;
            margin-bottom: 30px;
        }

        .menu-card {
            background: white;
            border-radius: 16px;
            padding: 25px;
            box-shadow: var(--card-shadow);
            transition: var(--transition);
            cursor: pointer;
            border-bottom: 4px solid transparent;
        }

        .menu-card:hover {
            transform: translateY(-5px);
            box-shadow: var(--hover-shadow);
            border-bottom-color: var(--primary);
        }

        .menu-icon {
            width: 52px;
            height: 52px;
            border-radius: 14px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 24px;
            color: white;
            margin-bottom: 15px;
        }

        .menu-icon.orders {
            background: linear-gradient(135deg, var(--primary), var(--primary-dark));
        }

        .menu-icon.tickets {
            background: linear-gradient(135deg, var(--success), #00a8e8);
        }

        .menu-icon.settings {
            background: linear-gradient(135deg, var(--warning), #ff6b6b);
        }

        .menu-icon.security {
            background: linear-gradient(135deg, var(--accent), var(--secondary));
        }

        .menu-title {
            font-size: 17px;
            font-weight: 700;
            margin-bottom: 8px;
            color: var(--dark);
        }

        .menu-description {
            font-size: 13px;
            color: var(--gray);
            line-height: 1.6;
        }

        /* 最近订单 */
        .section-card {
            background: white;
            border-radius: 16px;
            padding: 25px 30px;
            box-shadow: var(--card-shadow);
            margin-bottom: 30px;
        }

        .section-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 20px;
        }

        .section-title {
            font-size: 20px;
            font-weight: 700;
            color: var(--dark);
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .section-title i {
            color: var(--primary);
        }

        .btn-view-all {
            padding: 8px 20px;
            background: var(--light);
            color: var(--primary);
            border: none;
            border-radius: 8px;
            font-weight: 600;
            cursor: pointer;
            transition: var(--transition);
            font-size: 13px;
        }

        .btn-view-all:hover {
            background: var(--primary);
            color: white;
        }

        .recent-orders-list {
            display: flex;
            flex-direction: column;
            gap: 12px;
        }

        .order-item {
            padding: 18px 20px;
            background: var(--light);
            border-radius: 12px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            transition: var(--transition);
            cursor: pointer;
        }

        .order-item:hover {
            background: #e9ecef;
            transform: translateX(5px);
        }

        .order-item-info {
            flex: 1;
        }

        .order-movie-title {
            font-size: 15px;
            font-weight: 600;
            margin-bottom: 6px;
            color: var(--dark);
        }

        .order-details-small {
            display: flex;
            gap: 15px;
            font-size: 12px;
            color: var(--gray);
            flex-wrap: wrap;
        }

        .order-detail-item {
            display: flex;
            align-items: center;
            gap: 5px;
        }

        .order-detail-item i {
            color: var(--primary);
            font-size: 11px;
        }

        .order-item-right {
            text-align: right;
            flex-shrink: 0;
        }

        .order-price {
            font-size: 18px;
            font-weight: 700;
            color: var(--accent);
            margin-bottom: 6px;
        }

        .order-status-small {
            padding: 3px 10px;
            border-radius: 20px;
            font-size: 11px;
            font-weight: 600;
            display: inline-block;
        }

        .status-paid {
            background: #d4edda;
            color: #155724;
        }

        .status-pending {
            background: #fff3cd;
            color: #856404;
        }

        .status-cancelled {
            background: #f8d7da;
            color: #721c24;
        }

        .empty-state {
            text-align: center;
            padding: 50px 20px;
            color: var(--gray);
        }

        .empty-state i {
            font-size: 50px;
            margin-bottom: 15px;
            opacity: 0.3;
        }

        .empty-state p {
            font-size: 15px;
        }

        .loading {
            text-align: center;
            padding: 40px;
            color: var(--gray);
        }

        @media (max-width: 768px) {
            .profile-header {
                flex-direction: column;
                text-align: center;
                padding: 25px;
            }

            .user-stats {
                justify-content: center;
                gap: 20px;
            }

            .stat-item {
                padding: 12px 18px;
            }

            .menu-grid {
                grid-template-columns: 1fr 1fr;
            }

            .order-item {
                flex-direction: column;
                gap: 12px;
                align-items: flex-start;
            }

            .order-item-right {
                text-align: left;
                width: 100%;
                display: flex;
                justify-content: space-between;
                align-items: center;
            }

            .user-name-large {
                font-size: 22px;
            }
        }

        @media (max-width: 480px) {
            .menu-grid {
                grid-template-columns: 1fr;
            }

            .user-stats {
                gap: 12px;
            }

            .stat-item {
                padding: 10px 14px;
            }

            .stat-value {
                font-size: 20px;
            }
        }
    </style>
</head>
<body>
    <header class="header">
        <div class="container header-container">
            <a href="index.html" class="logo">
                <i class="fas fa-film logo-icon"></i>
                <span class="logo-text">嘻囔电影</span>
            </a>

            <nav class="nav-menu">
                <a href="index.html" class="nav-item">
                    <i class="fas fa-film"></i> 电影
                </a>
                <a href="cinemas.html" class="nav-item">
                    <i class="fas fa-building"></i> 影院
                </a>
                <a href="orders.html" class="nav-item">
                    <i class="fas fa-ticket-alt"></i> 订单
                </a>
                <a href="user.html" class="nav-item active">
                    <i class="fas fa-user"></i> 我的
                </a>
            </nav>
        </div>
    </header>

    <main class="container main-content">
        <!-- 用户信息头部 -->
        <div class="profile-header" id="profileHeader">
            <div class="loading">加载中...</div>
        </div>

        <!-- 功能菜单 -->
        <div class="menu-grid">
            <div class="menu-card" onclick="window.location.href='orders.html'">
                <div class="menu-icon orders">
                    <i class="fas fa-shopping-bag"></i>
                </div>
                <div class="menu-title">我的订单</div>
                <div class="menu-description">查看和管理所有订单，包括待支付、已支付和已完成的订单</div>
            </div>

            <div class="menu-card" onclick="showComingSoon()">
                <div class="menu-icon tickets">
                    <i class="fas fa-ticket-alt"></i>
                </div>
                <div class="menu-title">票券中心</div>
                <div class="menu-description">查看您的所有电影票券，支持扫码入场和下载保存</div>
            </div>

            <div class="menu-card" onclick="showComingSoon()">
                <div class="menu-icon settings">
                    <i class="fas fa-cog"></i>
                </div>
                <div class="menu-title">账户设置</div>
                <div class="menu-description">修改个人信息、密码、绑定手机号等账户安全设置</div>
            </div>

            <div class="menu-card" onclick="showComingSoon()">
                <div class="menu-icon security">
                    <i class="fas fa-shield-alt"></i>
                </div>
                <div class="menu-title">安全中心</div>
                <div class="menu-description">查看登录记录、设备管理、隐私设置等安全相关功能</div>
            </div>
        </div>

        <!-- 最近订单 -->
        <div class="section-card">
            <div class="section-header">
                <h2 class="section-title">
                    <i class="fas fa-clock"></i> 最近订单
                </h2>
                <button class="btn-view-all" onclick="window.location.href='orders.html'">
                    查看全部 <i class="fas fa-chevron-right" style="font-size: 11px; margin-left: 4px;"></i>
                </button>
            </div>
            <div id="recentOrdersList" class="recent-orders-list">
                <div class="loading">加载中...</div>
            </div>
        </div>
    </main>

    <script>
        let currentUser = null;

        document.addEventListener('DOMContentLoaded', function() {
            loadUserProfile();
            loadRecentOrders();
        });

        function loadUserProfile() {
            currentUser = getCurrentUser();

            if (!currentUser) {
                showUserMessage('请先登录', 'warning');
                setTimeout(() => {
                    window.location.href = 'index.html';
                }, 1500);
                return;
            }

            const profileHeader = document.getElementById('profileHeader');
            const joinDate = currentUser.createTime
                ? new Date(currentUser.createTime).toLocaleDateString('zh-CN')
                : new Date().toLocaleDateString('zh-CN');

            const name = currentUser.fullName || currentUser.username || '用户';

            profileHeader.innerHTML = `
                <div class="avatar-section">
                    <div class="user-avatar-large">
                        ${name.charAt(0).toUpperCase()}
                    </div>
                    <div class="avatar-badge">
                        <i class="fas fa-check"></i>
                    </div>
                </div>

                <div class="user-info-section">
                    <div class="user-name-large">${name}</div>
                    <div class="user-meta">
                        <div class="user-meta-item">
                            <i class="fas fa-envelope"></i>
                            <span>${currentUser.email || '未设置邮箱'}</span>
                        </div>
                        <div class="user-meta-item">
                            <i class="fas fa-phone"></i>
                            <span>${currentUser.phone || '未设置手机'}</span>
                        </div>
                        <div class="user-meta-item">
                            <i class="fas fa-calendar-alt"></i>
                            <span>加入时间: ${joinDate}</span>
                        </div>
                    </div>
                    <div class="user-stats">
                        <div class="stat-item">
                            <div class="stat-value" id="totalOrders">-</div>
                            <div class="stat-label">总订单</div>
                        </div>
                        <div class="stat-item">
                            <div class="stat-value" id="completedOrders">-</div>
                            <div class="stat-label">已完成</div>
                        </div>
                        <div class="stat-item">
                            <div class="stat-value" id="totalSpent">¥0</div>
                            <div class="stat-label">总消费</div>
                        </div>
                    </div>
                </div>

                <div class="logout-btn-section">
                    <button class="btn-logout" onclick="doLogout()">
                        <i class="fas fa-sign-out-alt"></i> 退出登录
                    </button>
                </div>
            `;
        }

        async function loadRecentOrders() {
            if (!currentUser) return;

            const container = document.getElementById('recentOrdersList');

            try {
                const data = await mockGetUserOrders(currentUser.userId);
                const orders = (data.data || []).slice(0, 5);

                // 更新统计数据
                updateOrderStats(data.data || []);

                if (orders.length > 0) {
                    renderRecentOrders(orders);
                } else {
                    container.innerHTML = `
                        <div class="empty-state">
                            <i class="fas fa-ticket-alt"></i>
                            <p>暂无订单记录，快去选购电影票吧！</p>
                        </div>
                    `;
                }
            } catch (error) {
                console.error('加载订单失败:', error);
                // 从localStorage读取
                const orders = getOrders().filter(o => o.userId == currentUser.userId);
                updateOrderStats(orders);
                const recent = orders.slice(0, 5);
                if (recent.length > 0) {
                    renderRecentOrders(recent);
                } else {
                    container.innerHTML = `
                        <div class="empty-state">
                            <i class="fas fa-ticket-alt"></i>
                            <p>暂无订单记录</p>
                        </div>
                    `;
                }
            }
        }

        function updateOrderStats(orders) {
            const totalOrders = orders.length;
            const completedOrders = orders.filter(o =>
                o.orderStatus === 'paid' || o.orderStatus === 'completed'
            ).length;
            const totalSpent = orders.reduce((sum, order) =>
                sum + (parseFloat(order.totalPrice) || parseFloat(order.totalAmount) || 0), 0
            );

            document.getElementById('totalOrders').textContent = totalOrders;
            document.getElementById('completedOrders').textContent = completedOrders;
            document.getElementById('totalSpent').textContent = '¥' + totalSpent.toFixed(0);
        }

        function renderRecentOrders(orders) {
            const container = document.getElementById('recentOrdersList');

            const ordersHTML = orders.map(order => {
                const date = (order.createdAt || order.createTime)
                    ? new Date(order.createdAt || order.createTime).toLocaleDateString('zh-CN')
                    : '未知';
                const statusClass = getStatusClass(order.orderStatus);
                const statusText = getStatusText(order.orderStatus);
                const totalPrice = order.totalPrice || order.totalAmount || 0;

                return `
                    <div class="order-item" onclick="window.location.href='orders.html'">
                        <div class="order-item-info">
                            <div class="order-movie-title">${order.movieTitle || '电影票'}</div>
                            <div class="order-details-small">
                                <div class="order-detail-item">
                                    <i class="fas fa-calendar"></i>
                                    <span>${date}</span>
                                </div>
                                <div class="order-detail-item">
                                    <i class="fas fa-door-open"></i>
                                    <span>${order.hallName || '影厅'}</span>
                                </div>
                                <div class="order-detail-item">
                                    <i class="fas fa-clock"></i>
                                    <span>${order.showTime || '场次'}</span>
                                </div>
                            </div>
                        </div>
                        <div class="order-item-right">
                            <div class="order-price">¥${totalPrice.toFixed(2)}</div>
                            <div class="order-status-small ${statusClass}">${statusText}</div>
                        </div>
                    </div>
                `;
            }).join('');

            container.innerHTML = ordersHTML;
        }

        function getStatusClass(status) {
            const map = {
                'pending': 'status-pending',
                'paid': 'status-paid',
                'completed': 'status-paid',
                'cancelled': 'status-cancelled'
            };
            return map[status] || 'status-pending';
        }

        function getStatusText(status) {
            const map = {
                'pending': '待支付',
                'paid': '已支付',
                'completed': '已完成',
                'cancelled': '已取消'
            };
            return map[status] || status;
        }

        function doLogout() {
            if (confirm('确定要退出登录吗？')) {
                logoutUser();
                showUserMessage('已退出登录', 'info');
                setTimeout(() => {
                    window.location.href = 'index.html';
                }, 800);
            }
        }

        function showComingSoon() {
            showUserMessage('该功能开发中，敬请期待！', 'info');
        }

        function showUserMessage(message, type = 'info') {
            let msgEl = document.getElementById('user-msg-toast');
            if (!msgEl) {
                msgEl = document.createElement('div');
                msgEl.id = 'user-msg-toast';
                msgEl.style.cssText = `
                    position: fixed;
                    top: 80px;
                    right: 20px;
                    padding: 16px 24px;
                    border-radius: 12px;
                    color: white;
                    font-weight: 500;
                    z-index: 9999;
                    opacity: 0;
                    transform: translateX(100px);
                    transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
                    backdrop-filter: blur(10px);
                    box-shadow: 0 8px 30px rgba(0,0,0,0.2);
                    max-width: 400px;
                `;
                document.body.appendChild(msgEl);
            }

            const colors = {
                success: 'linear-gradient(135deg, #00b894, #00a885)',
                error: 'linear-gradient(135deg, #ff4757, #ff3838)',
                warning: 'linear-gradient(135deg, #fdcb6e, #f39c12)',
                info: 'linear-gradient(135deg, #4361ee, #3a56d4)'
            };

            msgEl.textContent = message;
            msgEl.style.background = colors[type] || colors.info;
            msgEl.style.opacity = '1';
            msgEl.style.transform = 'translateX(0)';

            setTimeout(() => {
                msgEl.style.opacity = '0';
                msgEl.style.transform = 'translateX(100px)';
            }, 3000);
        }
    </script>
</body>
</html>
