<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>我的订单 - 影院购票系统</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <script src="mock-data.js"></script>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        :root {
            --primary: #4361ee;
            --primary-dark: #3a56d4;
            --secondary: #7209b7;
            --accent: #f72585;
            --success: #2ed573;
            --danger: #ff4757;
            --warning: #ffa502;
            --dark: #1a1a2e;
            --light: #f8f9fa;
            --gray: #6c757d;
            --light-gray: #e9ecef;
            --card-shadow: 0 8px 30px rgba(0, 0, 0, 0.08);
            --hover-shadow: 0 20px 40px rgba(0, 0, 0, 0.12);
            --transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', 'PingFang SC', 'Microsoft YaHei', sans-serif;
            background: linear-gradient(135deg, #f5f7fa 0%, #c3cfe2 100%);
            color: var(--dark);
            min-height: 100vh;
        }

        .container {
            max-width: 1200px;
            margin: 0 auto;
            padding: 0 20px;
        }

        .header {
            background: linear-gradient(135deg, var(--dark) 0%, #16213e 100%);
            color: white;
            padding: 15px 0;
            box-shadow: 0 4px 20px rgba(0,0,0,0.1);
            position: sticky;
            top: 0;
            z-index: 1000;
        }

        .header-container {
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 30px;
        }

        .logo {
            display: flex;
            align-items: center;
            gap: 12px;
            text-decoration: none;
            color: white;
            transition: var(--transition);
        }

        .logo:hover {
            transform: translateY(-2px);
        }

        .logo-icon {
            font-size: 32px;
            background: linear-gradient(135deg, var(--accent), var(--secondary));
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
        }

        .logo-text {
            font-size: 24px;
            font-weight: 700;
            background: linear-gradient(135deg, #fff, #c3cfe2);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
        }

        .nav-menu {
            display: flex;
            gap: 20px;
        }

        .nav-item {
            color: rgba(255, 255, 255, 0.85);
            text-decoration: none;
            font-size: 15px;
            font-weight: 500;
            padding: 10px 16px;
            border-radius: 8px;
            transition: var(--transition);
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .nav-item:hover {
            color: white;
            background: rgba(255, 255, 255, 0.1);
            transform: translateY(-2px);
        }

        .nav-item.active {
            color: white;
            background: rgba(255, 255, 255, 0.15);
        }

        .main-content {
            padding: 40px 0 60px;
        }

        .page-header {
            margin-bottom: 30px;
        }

        .page-header h1 {
            font-size: 32px;
            font-weight: 700;
            margin-bottom: 10px;
            color: var(--dark);
            display: flex;
            align-items: center;
            gap: 12px;
        }

        .page-header p {
            color: var(--gray);
            font-size: 16px;
        }

        .filter-bar {
            background: white;
            padding: 20px 25px;
            border-radius: 16px;
            box-shadow: var(--card-shadow);
            margin-bottom: 30px;
            display: flex;
            gap: 20px;
            flex-wrap: wrap;
            align-items: center;
        }

        .filter-group {
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .filter-group label {
            font-weight: 600;
            color: var(--dark);
            font-size: 14px;
        }

        .filter-select, .filter-input {
            padding: 10px 15px;
            border: 2px solid var(--light-gray);
            border-radius: 8px;
            font-size: 14px;
            transition: var(--transition);
            background: white;
        }

        .filter-select:focus, .filter-input:focus {
            outline: none;
            border-color: var(--primary);
            box-shadow: 0 0 0 3px rgba(67, 97, 238, 0.1);
        }

        .filter-input {
            min-width: 220px;
        }

        .btn-search {
            padding: 10px 24px;
            background: linear-gradient(135deg, var(--primary), var(--primary-dark));
            color: white;
            border: none;
            border-radius: 8px;
            font-weight: 600;
            cursor: pointer;
            transition: var(--transition);
        }

        .btn-search:hover {
            transform: translateY(-2px);
            box-shadow: 0 8px 20px rgba(67, 97, 238, 0.3);
        }

        .orders-list {
            display: grid;
            gap: 20px;
        }

        .order-card {
            background: white;
            border-radius: 16px;
            padding: 25px;
            box-shadow: var(--card-shadow);
            transition: var(--transition);
            cursor: pointer;
            position: relative;
            overflow: hidden;
        }

        .order-card:hover {
            transform: translateY(-4px);
            box-shadow: var(--hover-shadow);
        }

        .order-card::before {
            content: '';
            position: absolute;
            left: 0;
            top: 0;
            bottom: 0;
            width: 4px;
            background: linear-gradient(135deg, var(--primary), var(--secondary));
        }

        .order-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 20px;
            padding-bottom: 15px;
            border-bottom: 2px solid var(--light-gray);
        }

        .order-info {
            display: flex;
            gap: 20px;
            align-items: center;
            flex-wrap: wrap;
        }

        .order-number {
            font-weight: 700;
            color: var(--dark);
            font-size: 16px;
            font-family: 'Courier New', monospace;
        }

        .order-date {
            color: var(--gray);
            font-size: 14px;
        }

        .order-status {
            padding: 6px 16px;
            border-radius: 20px;
            font-size: 13px;
            font-weight: 600;
        }

        .status-pending {
            background: #fff3cd;
            color: #856404;
        }

        .status-paid {
            background: #d4edda;
            color: #155724;
        }

        .status-cancelled {
            background: #f8d7da;
            color: #721c24;
        }

        .status-completed {
            background: #d1ecf1;
            color: #0c5460;
        }

        .order-body {
            display: grid;
            grid-template-columns: auto 1fr auto;
            gap: 20px;
            align-items: center;
        }

        .movie-poster {
            width: 90px;
            height: 120px;
            border-radius: 10px;
            overflow: hidden;
            background: linear-gradient(135deg, var(--primary), var(--secondary));
            display: flex;
            align-items: center;
            justify-content: center;
            color: white;
            font-size: 32px;
            flex-shrink: 0;
        }

        .order-details {
            flex: 1;
            min-width: 0;
        }

        .movie-title {
            font-size: 19px;
            font-weight: 700;
            margin-bottom: 10px;
            color: var(--dark);
        }

        .detail-row {
            display: flex;
            gap: 20px;
            margin-bottom: 6px;
            font-size: 13px;
            color: var(--gray);
            flex-wrap: wrap;
        }

        .detail-item {
            display: flex;
            align-items: center;
            gap: 6px;
        }

        .detail-item i {
            color: var(--primary);
            width: 14px;
            font-size: 12px;
        }

        .seats-inline {
            display: flex;
            flex-wrap: wrap;
            gap: 5px;
            margin-top: 8px;
        }

        .seat-mini {
            background: linear-gradient(135deg, var(--primary), var(--primary-dark));
            color: white;
            padding: 3px 8px;
            border-radius: 10px;
            font-size: 11px;
            font-weight: 500;
        }

        .seat-mini.vip {
            background: linear-gradient(135deg, var(--accent), var(--danger));
        }

        .order-footer {
            display: flex;
            flex-direction: column;
            align-items: flex-end;
            gap: 12px;
            flex-shrink: 0;
        }

        .order-total {
            font-size: 24px;
            font-weight: 700;
            color: var(--accent);
        }

        .order-actions {
            display: flex;
            gap: 8px;
            flex-wrap: wrap;
            justify-content: flex-end;
        }

        .btn-action {
            padding: 8px 16px;
            border: 2px solid var(--primary);
            background: white;
            color: var(--primary);
            border-radius: 8px;
            font-size: 13px;
            font-weight: 600;
            cursor: pointer;
            transition: var(--transition);
        }

        .btn-action:hover {
            background: var(--primary);
            color: white;
            transform: translateY(-1px);
        }

        .btn-primary {
            background: linear-gradient(135deg, var(--primary), var(--primary-dark));
            color: white;
            border: none;
        }

        .btn-primary:hover {
            background: linear-gradient(135deg, var(--primary-dark), var(--primary));
        }

        .btn-danger {
            border-color: var(--danger);
            color: var(--danger);
        }

        .btn-danger:hover {
            background: var(--danger);
            color: white;
        }

        .empty-state {
            text-align: center;
            padding: 80px 20px;
            background: white;
            border-radius: 16px;
            box-shadow: var(--card-shadow);
        }

        .empty-state i {
            font-size: 70px;
            color: var(--light-gray);
            margin-bottom: 20px;
        }

        .empty-state h3 {
            font-size: 22px;
            color: var(--dark);
            margin-bottom: 10px;
        }

        .empty-state p {
            color: var(--gray);
            margin-bottom: 25px;
        }

        .btn-go-movies {
            display: inline-block;
            padding: 12px 30px;
            background: linear-gradient(135deg, var(--primary), var(--primary-dark));
            color: white;
            text-decoration: none;
            border-radius: 10px;
            font-weight: 600;
            transition: var(--transition);
        }

        .btn-go-movies:hover {
            transform: translateY(-2px);
            box-shadow: 0 8px 20px rgba(67, 97, 238, 0.3);
        }

        .loading {
            text-align: center;
            padding: 60px;
            color: var(--gray);
        }

        .loading-spinner {
            width: 50px;
            height: 50px;
            border: 4px solid var(--light-gray);
            border-top-color: var(--primary);
            border-radius: 50%;
            animation: spin 1s linear infinite;
            margin: 0 auto 20px;
        }

        @keyframes spin {
            to { transform: rotate(360deg); }
        }

        /* 票券模态框 */
        .modal-overlay {
            position: fixed;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            background: rgba(0, 0, 0, 0.7);
            backdrop-filter: blur(5px);
            display: flex;
            align-items: center;
            justify-content: center;
            z-index: 9999;
            opacity: 0;
            transition: opacity 0.3s;
            padding: 20px;
            pointer-events: none;
        }

        .modal-overlay.show {
            opacity: 1;
            pointer-events: auto;
        }

        .modal-content {
            background: white;
            border-radius: 20px;
            max-width: 420px;
            width: 100%;
            max-height: 90vh;
            overflow-y: auto;
            box-shadow: 0 20px 60px rgba(0, 0, 0, 0.3);
            transform: scale(0.9) translateY(20px);
            transition: transform 0.3s;
        }

        .modal-overlay.show .modal-content {
            transform: scale(1) translateY(0);
        }

        .modal-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 20px 25px;
            border-bottom: 2px solid var(--light-gray);
        }

        .modal-header h2 {
            font-size: 20px;
            color: var(--dark);
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .modal-close {
            background: none;
            border: none;
            font-size: 24px;
            color: var(--gray);
            cursor: pointer;
            padding: 5px;
            transition: var(--transition);
        }

        .modal-close:hover {
            color: var(--danger);
            transform: rotate(90deg);
        }

        .modal-body {
            padding: 25px;
        }

        .ticket-card {
            background: white;
            border-radius: 16px;
            overflow: hidden;
            box-shadow: 0 4px 20px rgba(0, 0, 0, 0.1);
            border: 2px solid var(--light-gray);
        }

        .ticket-header-gradient {
            background: linear-gradient(135deg, var(--primary), var(--secondary));
            color: white;
            padding: 20px;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .ticket-cinema {
            font-size: 18px;
            font-weight: 700;
        }

        .ticket-type {
            padding: 4px 12px;
            background: rgba(255, 255, 255, 0.2);
            border-radius: 20px;
            font-size: 12px;
            font-weight: 600;
        }

        .ticket-info-section {
            padding: 25px;
        }

        .ticket-movie-title {
            font-size: 20px;
            font-weight: 700;
            color: var(--dark);
            margin-bottom: 20px;
            text-align: center;
        }

        .ticket-detail-row {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 12px;
            margin-bottom: 12px;
        }

        .ticket-detail-item {
            padding: 12px;
            background: var(--light);
            border-radius: 10px;
        }

        .ticket-label {
            font-size: 12px;
            color: var(--gray);
            margin-bottom: 4px;
        }

        .ticket-value {
            font-size: 15px;
            font-weight: 600;
            color: var(--dark);
        }

        .ticket-value i {
            color: var(--primary);
            margin-right: 5px;
        }

        .seats-highlight {
            color: var(--accent);
            font-size: 13px;
            line-height: 1.6;
        }

        .price-highlight {
            color: var(--success);
            font-size: 18px;
        }

        .ticket-qr-section {
            margin-top: 20px;
            padding-top: 20px;
            border-top: 2px dashed var(--light-gray);
            text-align: center;
        }

        .qr-code-container {
            margin-bottom: 12px;
        }

        .qr-code-placeholder {
            width: 140px;
            height: 140px;
            margin: 0 auto;
            background: linear-gradient(135deg, #f5f7fa, #e9ecef);
            border-radius: 12px;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            gap: 8px;
        }

        .qr-code-placeholder i {
            font-size: 50px;
            color: var(--dark);
        }

        .qr-text {
            font-size: 11px;
            color: var(--gray);
        }

        .ticket-code {
            font-family: 'Courier New', monospace;
            font-size: 15px;
            font-weight: bold;
            color: var(--primary);
            letter-spacing: 1px;
            margin: 8px 0;
        }

        .ticket-tip {
            font-size: 12px;
            color: var(--gray);
        }

        .ticket-footer-info {
            padding: 15px 25px;
            background: var(--light);
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .ticket-status-badge {
            padding: 6px 14px;
            border-radius: 20px;
            font-size: 12px;
            font-weight: 600;
        }

        .ticket-order-date {
            font-size: 11px;
            color: var(--gray);
        }

        .modal-footer {
            padding: 15px 25px 25px;
            display: flex;
            gap: 10px;
        }

        .btn-modal {
            flex: 1;
            padding: 12px;
            border: none;
            border-radius: 10px;
            font-size: 14px;
            font-weight: 600;
            cursor: pointer;
            transition: var(--transition);
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
        }

        .btn-download {
            background: linear-gradient(135deg, var(--primary), var(--primary-dark));
            color: white;
        }

        .btn-download:hover {
            transform: translateY(-2px);
            box-shadow: 0 6px 15px rgba(67, 97, 238, 0.3);
        }

        .btn-close-modal {
            background: var(--light-gray);
            color: var(--dark);
        }

        .btn-close-modal:hover {
            background: #dee2e6;
        }

        @media (max-width: 768px) {
            .order-body {
                grid-template-columns: 1fr;
            }

            .order-footer {
                align-items: flex-start;
            }

            .order-actions {
                justify-content: flex-start;
            }

            .filter-bar {
                flex-direction: column;
                align-items: stretch;
            }

            .filter-group {
                flex-direction: column;
                align-items: stretch;
            }

            .page-header h1 {
                font-size: 26px;
            }
        }
    </style>
</head>
<body>
    <header class="header">
        <div class="container header-container">
            <a href="index.html" class="logo">
                <i class="fas fa-film logo-icon"></i>
                <span class="logo-text">嘻囔电影</span>
            </a>

            <nav class="nav-menu">
                <a href="index.html" class="nav-item">
                    <i class="fas fa-film"></i> 电影
                </a>
                <a href="cinemas.html" class="nav-item">
                    <i class="fas fa-building"></i> 影院
                </a>
                <a href="orders.html" class="nav-item active">
                    <i class="fas fa-ticket-alt"></i> 订单
                </a>
                <a href="user.html" class="nav-item">
                    <i class="fas fa-user"></i> 我的
                </a>
            </nav>
        </div>
    </header>

    <main class="container main-content">
        <div class="page-header">
            <h1><i class="fas fa-ticket-alt"></i> 我的订单</h1>
            <p>查看和管理您的所有电影票订单</p>
        </div>

        <div class="filter-bar">
            <div class="filter-group">
                <label>订单状态：</label>
                <select class="filter-select" id="statusFilter">
                    <option value="">全部订单</option>
                    <option value="paid">已支付</option>
                    <option value="pending">待支付</option>
                    <option value="cancelled">已取消</option>
                    <option value="completed">已完成</option>
                </select>
            </div>

            <div class="filter-group">
                <label>搜索：</label>
                <input type="text" class="filter-input" id="searchInput" placeholder="输入订单号或电影名称">
            </div>

            <button class="btn-search" onclick="filterOrders()">
                <i class="fas fa-search"></i> 搜索
            </button>
        </div>

        <div id="ordersContainer">
            <div class="loading">
                <div class="loading-spinner"></div>
                <p>加载中...</p>
            </div>
        </div>
    </main>

    <script>
        let allOrders = [];

        document.addEventListener('DOMContentLoaded', function() {
            const currentUser = getCurrentUser();

            if (currentUser) {
                loadOrders();
            } else {
                showLoginRequired();
            }
        });

        function showLoginRequired() {
            const container = document.getElementById('ordersContainer');
            container.innerHTML = `
                <div class="empty-state">
                    <i class="fas fa-lock"></i>
                    <h3>请先登录</h3>
                    <p>登录后查看您的订单记录</p>
                    <a href="index.html" class="btn-go-movies">
                        <i class="fas fa-sign-in-alt"></i> 去登录
                    </a>
                </div>
            `;
        }

        async function loadOrders() {
            const container = document.getElementById('ordersContainer');
            container.innerHTML = `
                <div class="loading">
                    <div class="loading-spinner"></div>
                    <p>加载订单中...</p>
                </div>
            `;

            const currentUser = getCurrentUser();
            if (!currentUser) {
                showLoginRequired();
                return;
            }

            try {
                const data = await mockGetUserOrders(currentUser.userId);
                if (data.success && data.data) {
                    allOrders = data.data;
                    displayOrders(allOrders);
                } else {
                    showEmptyState();
                }
            } catch (error) {
                console.error('加载订单失败:', error);
                // 直接从localStorage读取
                const orders = getOrders().filter(o => o.userId == currentUser.userId);
                allOrders = orders;
                displayOrders(orders);
            }
        }

        function displayOrders(orders) {
            const container = document.getElementById('ordersContainer');

            if (!orders || orders.length === 0) {
                showEmptyState();
                return;
            }

            const statusFilter = document.getElementById('statusFilter').value;
            const searchText = document.getElementById('searchInput').value.toLowerCase().trim();

            let filteredOrders = orders;

            if (statusFilter) {
                filteredOrders = filteredOrders.filter(order =>
                    order.orderStatus === statusFilter
                );
            }

            if (searchText) {
                filteredOrders = filteredOrders.filter(order =>
                    order.orderId.toLowerCase().includes(searchText) ||
                    (order.movieTitle && order.movieTitle.toLowerCase().includes(searchText))
                );
            }

            if (filteredOrders.length === 0) {
                container.innerHTML = `
                    <div class="empty-state">
                        <i class="fas fa-search"></i>
                        <h3>没有找到匹配的订单</h3>
                        <p>试试其他搜索条件吧</p>
                    </div>
                `;
                return;
            }

            const ordersHTML = filteredOrders.map(order => createOrderCard(order)).join('');
            container.innerHTML = `<div class="orders-list">${ordersHTML}</div>`;
        }

        function createOrderCard(order) {
            const statusClass = getStatusClass(order.orderStatus);
            const statusText = getStatusText(order.orderStatus);
            const date = order.createdAt || order.createTime
                ? new Date(order.createdAt || order.createTime).toLocaleString('zh-CN')
                : '未知时间';

            const seats = order.seats || [];
            const seatsDisplay = Array.isArray(seats)
                ? seats.map(s => {
                    const isVIP = s.seatType === 'vip' || s.seatType === 'VIP';
                    return `<span class="seat-mini ${isVIP ? 'vip' : ''}">${s.rowNum || '?'}排${s.colNum || '?'}座</span>`;
                }).join('')
                : `<span style="color: var(--gray); font-size: 13px;">${order.seatsDisplay || order.seats || '座位信息'}</span>`;

            const totalPrice = order.totalPrice || order.totalAmount || 0;

            return `
                <div class="order-card" onclick="viewTicket('${order.orderId}')">
                    <div class="order-header">
                        <div class="order-info">
                            <div class="order-number">订单号：${order.orderId}</div>
                            <div class="order-date"><i class="far fa-clock"></i> ${date}</div>
                        </div>
                        <div class="order-status ${statusClass}">${statusText}</div>
                    </div>

                    <div class="order-body">
                        <div class="movie-poster">
                            <i class="fas fa-film"></i>
                        </div>

                        <div class="order-details">
                            <div class="movie-title">${order.movieTitle || '电影票'}</div>
                            <div class="detail-row">
                                <div class="detail-item">
                                    <i class="fas fa-clock"></i>
                                    <span>${order.showTime || '场次待定'}</span>
                                </div>
                                <div class="detail-item">
                                    <i class="fas fa-door-open"></i>
                                    <span>${order.hallName || '影厅待定'}</span>
                                </div>
                                <div class="detail-item">
                                    <i class="fas fa-ticket-alt"></i>
                                    <span>${seats.length || 0}张票</span>
                                </div>
                            </div>
                            <div class="seats-inline">
                                ${seatsDisplay}
                            </div>
                        </div>

                        <div class="order-footer">
                            <div class="order-total">¥${totalPrice.toFixed(2)}</div>
                            <div class="order-actions">
                                ${getActionButtons(order)}
                            </div>
                        </div>
                    </div>
                </div>
            `;
        }

        function getStatusClass(status) {
            const map = {
                'pending': 'status-pending',
                'paid': 'status-paid',
                'completed': 'status-paid',
                'cancelled': 'status-cancelled'
            };
            return map[status] || 'status-pending';
        }

        function getStatusText(status) {
            const map = {
                'pending': '待支付',
                'paid': '已支付',
                'completed': '已完成',
                'cancelled': '已取消'
            };
            return map[status] || status;
        }

        function getActionButtons(order) {
            if (order.orderStatus === 'pending') {
                return `
                    <button class="btn-action btn-primary" onclick="event.stopPropagation(); payOrder('${order.orderId}')">
                        <i class="fas fa-credit-card"></i> 去支付
                    </button>
                    <button class="btn-action btn-danger" onclick="event.stopPropagation(); cancelOrder('${order.orderId}')">
                        <i class="fas fa-times"></i> 取消
                    </button>
                `;
            } else if (order.orderStatus === 'paid' || order.orderStatus === 'completed') {
                return `
                    <button class="btn-action btn-primary" onclick="event.stopPropagation(); viewTicket('${order.orderId}')">
                        <i class="fas fa-qrcode"></i> 查看票券
                    </button>
                `;
            }
            return `
                <button class="btn-action" onclick="event.stopPropagation(); viewTicket('${order.orderId}')">
                    <i class="fas fa-eye"></i> 查看详情
                </button>
            `;
        }

        function showEmptyState() {
            const container = document.getElementById('ordersContainer');
            container.innerHTML = `
                <div class="empty-state">
                    <i class="fas fa-ticket-alt"></i>
                    <h3>暂无订单</h3>
                    <p>您还没有任何订单，快去选购电影票吧！</p>
                    <a href="index.html" class="btn-go-movies">
                        <i class="fas fa-film"></i> 浏览电影
                    </a>
                </div>
            `;
        }

        function filterOrders() {
            displayOrders(allOrders);
        }

        function payOrder(orderId) {
            const order = allOrders.find(o => o.orderId === orderId);
            if (order) {
                sessionStorage.setItem(STORAGE_KEYS.ORDER_INFO, JSON.stringify(order));
                window.location.href = 'payment.html';
            }
        }

        async function cancelOrder(orderId) {
            if (!confirm('确定要取消这个订单吗？取消后座位将被释放。')) {
                return;
            }

            try {
                const result = await mockCancelOrder(orderId);
                if (result.success) {
                    showOrderMessage('订单已取消', 'success');
                    loadOrders();
                } else {
                    showOrderMessage(result.message || '取消失败', 'error');
                }
            } catch (error) {
                console.error('取消订单失败:', error);
                showOrderMessage('取消失败，请稍后重试', 'error');
            }
        }

        async function viewTicket(orderId) {
            try {
                const result = await mockGetOrderById(orderId);
                if (result.success && result.data) {
                    createTicketModal(result.data);
                } else {
                    showOrderMessage('获取订单信息失败', 'error');
                }
            } catch (error) {
                console.error('加载票券失败:', error);
                // 尝试直接从allOrders中找
                const order = allOrders.find(o => o.orderId === orderId);
                if (order) {
                    createTicketModal(order);
                } else {
                    showOrderMessage('加载失败，请稍后重试', 'error');
                }
            }
        }

        function createTicketModal(order) {
            const existingModal = document.getElementById('ticketModal');
            if (existingModal) existingModal.remove();

            const seats = order.seats || [];
            const seatsText = Array.isArray(seats) && seats.length > 0
                ? seats.map(s => `${s.rowNum || '?'}排${s.colNum || '?'}座`).join('、')
                : (order.seatsDisplay || order.seats || '待定');

            const totalPrice = order.totalPrice || order.totalAmount || 0;
            const date = order.createdAt || order.createTime
                ? new Date(order.createdAt || order.createTime).toLocaleString('zh-CN')
                : '未知时间';

            const statusText = getStatusText(order.orderStatus);
            const statusClass = getStatusClass(order.orderStatus);

            const modalHTML = `
                <div id="ticketModal" class="modal-overlay" onclick="if(event.target === this) closeTicketModal()">
                    <div class="modal-content">
                        <div class="modal-header">
                            <h2><i class="fas fa-ticket-alt"></i> 电影票详情</h2>
                            <button class="modal-close" onclick="closeTicketModal()">
                                <i class="fas fa-times"></i>
                            </button>
                        </div>

                        <div class="modal-body">
                            <div class="ticket-card">
                                <div class="ticket-header-gradient">
                                    <div class="ticket-cinema">嘻囔国际影城</div>
                                    <div class="ticket-type">电子票</div>
                                </div>

                                <div class="ticket-info-section">
                                    <div class="ticket-movie-title">${order.movieTitle || '电影票'}</div>

                                    <div class="ticket-detail-row">
                                        <div class="ticket-detail-item">
                                            <div class="ticket-label">放映时间</div>
                                            <div class="ticket-value"><i class="fas fa-clock"></i>${order.showTime || '待定'}</div>
                                        </div>
                                        <div class="ticket-detail-item">
                                            <div class="ticket-label">影厅</div>
                                            <div class="ticket-value"><i class="fas fa-door-open"></i>${order.hallName || '待定'}</div>
                                        </div>
                                    </div>

                                    <div class="ticket-detail-row">
                                        <div class="ticket-detail-item">
                                            <div class="ticket-label">座位</div>
                                            <div class="ticket-value seats-highlight" style="font-size: 13px;">
                                                <i class="fas fa-chair"></i>${seatsText}
                                            </div>
                                        </div>
                                        <div class="ticket-detail-item">
                                            <div class="ticket-label">票价</div>
                                            <div class="ticket-value price-highlight">¥${totalPrice.toFixed(2)}</div>
                                        </div>
                                    </div>

                                    <div class="ticket-qr-section">
                                        <div class="qr-code-container">
                                            <div class="qr-code-placeholder">
                                                <i class="fas fa-qrcode"></i>
                                                <div class="qr-text">扫码入场</div>
                                            </div>
                                        </div>
                                        <div class="ticket-code">${order.orderId}</div>
                                        <div class="ticket-tip">请出示此二维码或订单号入场</div>
                                    </div>
                                </div>

                                <div class="ticket-footer-info">
                                    <div class="ticket-status-badge ${statusClass}">${statusText}</div>
                                    <div class="ticket-order-date">下单: ${date}</div>
                                </div>
                            </div>
                        </div>

                        <div class="modal-footer">
                            <button class="btn-modal btn-download" onclick="saveTicket()">
                                <i class="fas fa-download"></i> 保存票券
                            </button>
                            <button class="btn-modal btn-close-modal" onclick="closeTicketModal()">
                                <i class="fas fa-times"></i> 关闭
                            </button>
                        </div>
                    </div>
                </div>
            `;

            document.body.insertAdjacentHTML('beforeend', modalHTML);

            setTimeout(() => {
                const modal = document.getElementById('ticketModal');
                if (modal) modal.classList.add('show');
            }, 10);
        }

        function closeTicketModal() {
            const modal = document.getElementById('ticketModal');
            if (modal) {
                modal.classList.remove('show');
                setTimeout(() => modal.remove(), 300);
            }
        }

        function saveTicket() {
            showOrderMessage('演示版本不支持保存功能', 'info');
        }

        function showOrderMessage(message, type = 'info') {
            let msgEl = document.getElementById('order-msg-toast');
            if (!msgEl) {
                msgEl = document.createElement('div');
                msgEl.id = 'order-msg-toast';
                msgEl.style.cssText = `
                    position: fixed;
                    top: 80px;
                    right: 20px;
                    padding: 16px 24px;
                    border-radius: 12px;
                    color: white;
                    font-weight: 500;
                    z-index: 9999;
                    opacity: 0;
                    transform: translateX(100px);
                    transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
                    backdrop-filter: blur(10px);
                    box-shadow: 0 8px 30px rgba(0,0,0,0.2);
                    max-width: 400px;
                `;
                document.body.appendChild(msgEl);
            }

            const colors = {
                success: 'linear-gradient(135deg, #00b894, #00a885)',
                error: 'linear-gradient(135deg, #ff4757, #ff3838)',
                warning: 'linear-gradient(135deg, #fdcb6e, #f39c12)',
                info: 'linear-gradient(135deg, #4361ee, #3a56d4)'
            };

            msgEl.textContent = message;
            msgEl.style.background = colors[type] || colors.info;
            msgEl.style.opacity = '1';
            msgEl.style.transform = 'translateX(0)';

            setTimeout(() => {
                msgEl.style.opacity = '0';
                msgEl.style.transform = 'translateX(100px)';
            }, 3000);
        }

        // 监听筛选器变化
        document.getElementById('statusFilter').addEventListener('change', () => displayOrders(allOrders));
        document.getElementById('searchInput').addEventListener('input', () => displayOrders(allOrders));
    </script>
</body>
</html>
